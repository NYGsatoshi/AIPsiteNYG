name: One-time fix PR287

on:
  push:
    branches:
      - agent/ci-compose-helper-preflight

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply deterministic legacy candidate ordering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/AipPortal.Tests/PostgreSql/Wpc01WorkspaceCreationPostgreSqlTests.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            IQueryable<Guid> LegacyCandidateConversationIds() =>
                setupDb.Messages
                    .AsNoTracking()
                    .Where(message => message.TenantId == tenantId
                                      && message.DeletedAt == null
                                      && EF.Functions.ILike(message.Body, "%needle%"))
                    .Select(message => message.ConversationId)
                    .Distinct();'''
          new = '''            IQueryable<Guid> LegacyCandidateConversationIds() =>
                setupDb.Messages
                    .AsNoTracking()
                    .Where(message => message.TenantId == tenantId
                                      && message.DeletedAt == null
                                      && EF.Functions.ILike(message.Body, "%needle%"))
                    .Select(message => message.ConversationId)
                    .Distinct()
                    .OrderBy(conversationId => conversationId);'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy candidate query, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm .github/workflows/one-time-fix-pr287.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/AipPortal.Tests/PostgreSql/Wpc01WorkspaceCreationPostgreSqlTests.cs .github/workflows/one-time-fix-pr287.yml
          git commit -m "Stabilize message search authorization regression test"
          git push origin "HEAD:${GITHUB_REF_NAME}"
