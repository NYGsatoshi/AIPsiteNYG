version: "1.0"

# Qodana Community for .NET
linter: qodana-cdnet

profile:
  name: qodana.recommended

dotnet:
  solution: AipPortal.slnx
  configuration: Release

# Qodana実行前に.NETの依存関係とプロジェクトモデルを構築する
bootstrap: |
  set -Eeuo pipefail

  echo "=== .NET SDK ==="
  dotnet --info
  dotnet --list-sdks

  echo "=== Restore ==="
  dotnet restore AipPortal.slnx --verbosity normal

  echo "=== Build ==="
  dotnet build AipPortal.slnx \
    --configuration Release \
    --no-restore

exclude:
  - name: All
    paths:
      # .NET generated files
      - "bin"
      - "obj"
      - "**/bin/**"
      - "**/obj/**"

      # Node dependencies and generated frontend output
      - "node_modules"
      - "**/node_modules/**"
      - "dist"
      - "**/dist/**"
      - ".angular"
      - "**/.angular/**"
      - "**/storybook-static/**"

      # Test output
      - "**/coverage/**"
      - "**/TestResults/**"
      - "**/test-results/**"
      - "**/playwright-report/**"
      - "**/.playwright/**"

      # Qodana output
      - ".qodana"
      - "**/.qodana/**"
      - ".tmp"
      - "**/.tmp/**"

      # ASP.NET CoreにコピーされたAngularビルド成果物
      - "src/AipPortal.Web/wwwroot/**"

      # Runtime data
      - "src/AipPortal.Web/data/**"

      # 使用していない旧Angularプロジェクト
      - "aipsite-frontend/**"
