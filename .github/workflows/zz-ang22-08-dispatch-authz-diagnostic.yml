name: ANG22-08 dispatch protected AuthZ diagnostic (one-shot)

on:
  push:
    branches:
      - chore/ang22-08-dispatch-acceptance
    paths:
      - .github/workflows/zz-ang22-08-dispatch-authz-diagnostic.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify candidate and dispatch protected AuthZ acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 45ed4aa383fe0feb4c05330a8aa551795d1901db
        run: |
          set -euo pipefail
          candidate_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/integration/angular-22-migration" --jq '.object.sha')"
          test "$candidate_sha" = "$EXPECTED_SHA"
          gh workflow run licensed-real-backend-acceptance.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref integration/angular-22-migration \
            -f suite=authz
          echo "Dispatched protected AuthZ acceptance for ${candidate_sha}."
