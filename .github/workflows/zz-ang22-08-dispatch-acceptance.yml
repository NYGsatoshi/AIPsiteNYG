name: ANG22-08 dispatch protected acceptance (one-shot)

on:
  push:
    branches:
      - chore/ang22-08-dispatch-acceptance
    paths:
      - .github/workflows/zz-ang22-08-dispatch-acceptance.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify candidate and dispatch protected acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 6d94e6224ef033cd032ae2b120b213b649dee316
        run: |
          set -euo pipefail
          candidate_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/integration/angular-22-migration" \
            --jq '.object.sha')"
          test "$candidate_sha" = "$EXPECTED_SHA"
          gh workflow run licensed-real-backend-acceptance.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref integration/angular-22-migration \
            -f suite=all
          echo "Dispatched Licensed Real Backend Acceptance for ${candidate_sha}."
