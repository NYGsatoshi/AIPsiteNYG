name: Real Backend P0 Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/real-backend-p0.yml"
      - "Dockerfile"
      - "Dockerfile.playwright"
      - "docker-compose.real-backend-smoke.yml"
      - "AipPortal.slnx"
      - "global.json"
      - "Directory.Build.*"
      - "Directory.Packages.*"
      - "NuGet.config"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.*"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/angular.json"
      - "frontend/tsconfig*.json"
      - "frontend/src/index.html"
      - "frontend/src/main.ts"
      - "frontend/src/styles.*"
      - "frontend/src/app/app.*"
      - "frontend/src/app/core/**"
      - "frontend/src/app/shared/**"
      - "frontend/src/app/features/account/**"
      - "frontend/src/app/features/announcements/**"
      - "frontend/src/app/features/auth/**"
      - "frontend/src/app/features/files/**"
      - "frontend/src/app/features/messaging/**"
      - "frontend/src/app/features/projects/**"
      - "frontend/src/app/features/workspaces/**"
      - "src/**/*.csproj"
      - "src/AipPortal.Application/Announcements/**"
      - "src/AipPortal.Application/Auth/**"
      - "src/AipPortal.Application/Common/**"
      - "src/AipPortal.Application/Communication/**"
      - "src/AipPortal.Application/DependencyInjection.cs"
      - "src/AipPortal.Application/Files/**"
      - "src/AipPortal.Application/Messaging/**"
      - "src/AipPortal.Application/Notifications/**"
      - "src/AipPortal.Application/Planning/**"
      - "src/AipPortal.Application/Projects/**"
      - "src/AipPortal.Application/Realtime/**"
      - "src/AipPortal.Application/Security/**"
      - "src/AipPortal.Application/Tenancy/**"
      - "src/AipPortal.Application/UiShell/**"
      - "src/AipPortal.Application/Workspaces/**"
      - "src/AipPortal.Domain/Common/**"
      - "src/AipPortal.Domain/Entities/CommunicationEntities.cs"
      - "src/AipPortal.Domain/Entities/IdentityEntities.cs"
      - "src/AipPortal.Domain/Entities/MessagingEntities.cs"
      - "src/AipPortal.Domain/Entities/ProductionEntities.cs"
      - "src/AipPortal.Domain/Enums/**"
      - "src/AipPortal.Infrastructure/BackgroundJobs/**"
      - "src/AipPortal.Infrastructure/DependencyInjection.cs"
      - "src/AipPortal.Infrastructure/FileStorage/**"
      - "src/AipPortal.Infrastructure/Files/**"
      - "src/AipPortal.Infrastructure/Persistence/**"
      - "src/AipPortal.Infrastructure/Security/**"
      - "src/AipPortal.Infrastructure/TaskExecution/**"
      - "src/AipPortal.Web/Controllers/AnnouncementsController.cs"
      - "src/AipPortal.Web/Controllers/AuthController.cs"
      - "src/AipPortal.Web/Controllers/CommunicationPollingController.cs"
      - "src/AipPortal.Web/Controllers/ConversationsController.cs"
      - "src/AipPortal.Web/Controllers/FilesController.cs"
      - "src/AipPortal.Web/Controllers/MessageFollowUpsController.cs"
      - "src/AipPortal.Web/Controllers/MessageNotificationPreferencesController.cs"
      - "src/AipPortal.Web/Controllers/NotificationsController.cs"
      - "src/AipPortal.Web/Controllers/PlanningController.cs"
      - "src/AipPortal.Web/Controllers/ProjectActivationController.cs"
      - "src/AipPortal.Web/Controllers/ProjectKanbanController.cs"
      - "src/AipPortal.Web/Controllers/ProjectTaskCreateController.cs"
      - "src/AipPortal.Web/Controllers/ProjectsController.cs"
      - "src/AipPortal.Web/Controllers/TaskExecutionController.cs"
      - "src/AipPortal.Web/Controllers/TaskNotificationPreferencesController.cs"
      - "src/AipPortal.Web/Controllers/UiShellController.cs"
      - "src/AipPortal.Web/Controllers/WorkspaceProjectsController.cs"
      - "src/AipPortal.Web/Controllers/WorkspacesController.cs"
      - "src/AipPortal.Web/Hubs/**"
      - "src/AipPortal.Web/Program.cs"
      - "src/AipPortal.Web/Security/**"
      - "src/AipPortal.Web/Tenancy/**"
      - "src/AipPortal.Web/appsettings*.json"
      - "tests/ui/*real-backend*"
      - "scripts/ci/build-playwright-grep.mjs"
      - "scripts/ci/npm-ci-retry.sh"
      - "scripts/ci/real-backend-pr-p0-required-tests.txt"
      - "scripts/ci/verify-playwright-required-tests.mjs"

permissions:
  contents: read

jobs:
  real-backend-p0-acceptance:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, aipsite-ci, general]
    timeout-minutes: 45
    concurrency:
      group: real-backend-p0-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install smoke runner dependencies
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Prune unused Docker networks
        shell: bash
        run: docker network prune --force

      - name: Run required real-backend P0 acceptance set
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
        shell: bash
        run: |
          test -n "${SYNCFUSION_LICENSE:-}" || {
            echo "SYNCFUSION_LICENSE is not configured." >&2
            exit 1
          }
          node tests/ui/run-real-backend-p0.mjs

      - name: Validate Dependabot no-secret acceptance boundary
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        shell: bash
        run: |
          echo "Protected Syncfusion license is unavailable to Dependabot by design; licensed real-backend acceptance is not executed in this trust context."
          node --check tests/ui/run-real-backend-p0.mjs
          node --check tests/ui/run-real-backend-smoke-compose.mjs
          docker compose -p aipsite-dependabot-p0 -f docker-compose.real-backend-smoke.yml config --quiet

      - name: Upload Playwright artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: real-backend-p0-acceptance-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Report runner resources on failure
        if: failure()
        shell: bash
        run: |
          df -h || true
          df -i || true
          free -h || true
          docker system df || true

      - name: Repair final workspace ownership
        if: always()
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"