name: WPC-Final02 one-shot static correction

on:
  push:
    branches:
      - wpc-final02-migration-legacy-audit
    paths:
      - .github/workflows/wpc-final02-one-shot-fix.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: wpc-final02-migration-legacy-audit
          persist-credentials: true
      - name: Apply audited literal corrections and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test = Path("tests/AipPortal.Tests/PostgreSql/WpcFinal02MigrationLegacyCompatibilityPostgreSqlTests.cs")
          text = test.read_text(encoding="utf-8")
          replacements = {
              '"FK_workspace_task_workflow_defaults_templates_TenantId_TemplateId"':
                  '"FK_workspace_task_workflow_defaults_templates_TenantId_Template"',
              'Assert.Equal(7, definition.VersionNo);':
                  'Assert.Equal(7L, definition.VersionNo);',
              'Assert.Equal(3, actual.VersionNo);':
                  'Assert.Equal(3L, actual.VersionNo);',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}")
              text = text.replace(old, new)
          test.write_text(text, encoding="utf-8")

          Path(".github/workflows/wpc-final02-one-shot-fix.yml").unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(wpc-final02): align PostgreSQL identifiers and numeric types"
          git push origin HEAD:wpc-final02-migration-legacy-audit
