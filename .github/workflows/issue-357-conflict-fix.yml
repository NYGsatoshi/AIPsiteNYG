name: Issue 357 conflict resolution

on:
  push:
    branches:
      - feat/357-active-source-scope-completion
    paths:
      - .github/workflows/issue-357-conflict-fix.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Issue 357 branch
        uses: actions/checkout@v7
        with:
          ref: feat/357-active-source-scope-completion
          fetch-depth: 0

      - name: Merge current main and resolve the Task source-scope contract
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          expected="frontend/src/app/features/projects/task-execution-scope/task-execution-scope.component.html"
          if [[ -n "$conflicts" ]]; then
            if [[ "$conflicts" != "$expected" ]]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi
            git checkout --theirs -- "$expected"
          elif [[ "$merge_status" -ne 0 ]]; then
            echo "Merge failed without a resolvable expected conflict." >&2
            exit "$merge_status"
          fi

          python3 <<'PY'
          from pathlib import Path

          html_path = Path('frontend/src/app/features/projects/task-execution-scope/task-execution-scope.component.html')
          text = html_path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one HTML match, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '      <p class="task-execution-scope__intro">The server decides which source policy is active for this Task.</p>',
              '      <p class="task-execution-scope__intro">The server decides the effective source policy for the next run request of this Task.</p>',
          )
          replace_once(
              '''      <div>\n        <dt>Web</dt>\n        <dd data-testid="task-execution-scope-web">{{ sourceEligibility(current.task.effectivePolicy.webEnabled) }}</dd>\n      </div>''',
              '''      <div>\n        <dt>Web</dt>\n        <dd data-testid="task-execution-scope-web">{{ current.task.effectivePolicy.webEnabled ? 'Enabled' : 'Disabled' }}</dd>\n        <dd data-testid="task-execution-scope-web-policy">{{ current.task.effectivePolicy.webEnabled ? 'Allow — eligible under this Task scope' : 'Exclude — not eligible under this Task scope' }}</dd>\n      </div>''',
          )
          replace_once(
              '''      <div>\n        <dt>Project files</dt>\n        <dd data-testid="task-execution-scope-files">{{ sourceEligibility(current.task.effectivePolicy.projectFilesEnabled) }}</dd>\n      </div>\n    </dl>''',
              '''      <div>\n        <dt>Project files</dt>\n        <dd data-testid="task-execution-scope-files">{{ current.task.effectivePolicy.projectFilesEnabled ? 'Enabled' : 'Disabled' }}</dd>\n        <dd data-testid="task-execution-scope-files-policy">{{ current.task.effectivePolicy.projectFilesEnabled ? 'Allow — eligible under this Task scope' : 'Exclude — not eligible under this Task scope' }}</dd>\n      </div>\n      <div>\n        <dt>Specific sites</dt>\n        <dd data-testid="task-execution-scope-sites">Not available in the current source-scope contract</dd>\n      </div>\n      <div>\n        <dt>Connected apps</dt>\n        <dd data-testid="task-execution-scope-apps">Not available in the current source-scope contract</dd>\n      </div>\n    </dl>\n\n    <section class="task-execution-scope__snapshot" aria-labelledby="task-execution-scope-terms-heading" data-testid="task-execution-scope-terms">\n      <h3 id="task-execution-scope-terms-heading">Scope terms</h3>\n      <dl>\n        <div>\n          <dt>Allow</dt>\n          <dd>The source kind is eligible under the active scope.</dd>\n        </div>\n        <div>\n          <dt>Restrict</dt>\n          <dd>Only explicitly named members of a broader source kind would be eligible.</dd>\n        </div>\n        <div>\n          <dt>Prioritize</dt>\n          <dd>Named members would be preferred while the broader allowed source remains eligible.</dd>\n        </div>\n      </dl>\n      <p class="task-execution-scope__intro" data-testid="task-execution-scope-rule-limit">Restrict and Prioritize rules are not configured by the current source-scope contract; current configurable source kinds use Allow or Exclude.</p>\n    </section>''',
          )
          replace_once(
              '      Changes apply to future run requests only. A run policy snapshot is locked when the request is accepted.',
              '      This summary is the current next-run policy. Changes apply to future run requests only; a run policy snapshot is locked when that request is accepted.',
          )
          replace_once(
              '      No execution runtime is configured in this release. No Web request can be sent from this screen.',
              '      Execution provider: None. No execution runtime is configured in this release; a run request can record an immutable policy snapshot, but no Web or Project-file I/O starts and the run finishes unavailable. No Web request can be sent from this screen.',
          )
          replace_once(
              '<div><dt>Web at request</dt><dd>{{ sourceEligibility(latestRun.snapshotWebEnabled) }}</dd></div>',
              "<div><dt>Web at request</dt><dd>{{ latestRun.snapshotWebEnabled ? 'Allow' : 'Exclude' }}</dd></div>",
          )
          replace_once(
              '<div><dt>Project files at request</dt><dd>{{ sourceEligibility(latestRun.snapshotProjectFilesEnabled) }}</dd></div>',
              "<div><dt>Project files at request</dt><dd>{{ latestRun.snapshotProjectFilesEnabled ? 'Allow' : 'Exclude' }}</dd></div>",
          )
          html_path.write_text(text)

          smoke_path = Path('tests/ui/angular-smoke.spec.ts')
          smoke = smoke_path.read_text()
          old = "    await expect(scope).not.toContainText('provider');"
          new = "    await expect(scope.getByTestId('task-execution-runtime-unavailable')).toContainText('Execution provider: None');"
          count = smoke.count(old)
          if count != 1:
              raise SystemExit(f'Expected one stale provider assertion, found {count}')
          smoke_path.write_text(smoke.replace(old, new, 1))
          PY

          git add frontend/src/app/features/projects/task-execution-scope/task-execution-scope.component.html tests/ui/angular-smoke.spec.ts
          git rm .github/workflows/issue-357-conflict-fix.yml
          git status --short
          git commit -m "merge main into Issue 357 completion"
          git push origin HEAD:feat/357-active-source-scope-completion
