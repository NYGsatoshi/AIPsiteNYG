name: ANG22-07 inspection lockfile generation (one-shot)

on:
  push:
    branches:
      - chore/ang22-07-lockfile-supply-chain
    paths:
      - .github/workflows/zz-ang22-07-inspection-lock-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ANG22-07 branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Report repository npm baseline
        run: npm exec --yes --package=npm@11.17.0 -- npm --version

      - name: Generate deterministic inspection toolchain lockfile
        shell: bash
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_ALLOW_GIT: none
          NPM_CONFIG_ALLOW_REMOTE: none
        run: |
          set -euo pipefail
          npm exec --yes --package=npm@11.17.0 -- npm \
            --prefix tools/frontend-inspections install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund
          node scripts/ci/verify-npm-lockfile.mjs tools/frontend-inspections
          git diff --check

      - name: Commit inspection lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/frontend-inspections/package-lock.json
          git commit -m 'build(frontend): lock inspection toolchain dependencies'
          git push origin HEAD:chore/ang22-07-lockfile-supply-chain
