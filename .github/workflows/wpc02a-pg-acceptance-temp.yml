name: WPC-02A PostgreSQL acceptance temporary

on:
  push:
    branches:
      - wpc-02a-visibility-provenance-archive

permissions:
  contents: read

jobs:
  postgresql-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore AipPortal.slnx
      - run: dotnet build AipPortal.slnx --configuration Release --no-restore
      - name: Verify EF snapshot
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/AipPortal.Infrastructure \
            --startup-project src/AipPortal.Web \
            --configuration Release \
            --no-build
      - name: Run WPC-02A PostgreSQL acceptance
        run: dotnet test tests/AipPortal.Tests/AipPortal.Tests.csproj --configuration Release --no-build --filter 'Scope=WPC02A' --logger 'console;verbosity=normal'
