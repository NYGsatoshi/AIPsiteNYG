name: CodeQL remediation diagnostics

on:
  push:
    branches:
      - security/codeql-non-angular-remediation
    paths:
      - .github/workflows/codeql-remediation-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Diagnose (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - csharp
          - javascript-typescript
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze without uploading to Code Scanning
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: false
          output: sarif-results

      - name: Preserve SARIF for remediation triage
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: error
          retention-days: 1
