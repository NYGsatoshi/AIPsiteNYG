name: Issue336 Backend Verify

on:
  push:
    branches: ["feat/336-authoritative-folder-move"]
    paths:
      - ".github/workflows/issue336-backend-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Build, model test and EF drift check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=aipsite_issue336_verify;Username=postgres;Password=postgres"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/336-authoritative-folder-move

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore AipPortal.slnx

      - name: Build
        run: dotnet build AipPortal.slnx --configuration Release --no-restore

      - name: File folder model tests
        run: >-
          dotnet test tests/AipPortal.Tests/AipPortal.Tests.csproj
          --configuration Release
          --no-build
          --filter FullyQualifiedName~FileFolderModelTests

      - name: Restore tools
        run: dotnet tool restore

      - name: Verify EF model has no pending changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/AipPortal.Infrastructure
          --startup-project src/AipPortal.Web
          --configuration Release
          --no-build
