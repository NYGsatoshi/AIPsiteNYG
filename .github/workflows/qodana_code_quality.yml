#-------------------------------------------------------------------------------#
#        Discover additional configuration options in our documentation         #
#               https://www.jetbrains.com/help/qodana/github.html               #
#-------------------------------------------------------------------------------#

name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: qodana-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # Full C#/ASP.NET and frontend framework coverage requires qodana-dotnet.
      # Do not silently downgrade to qodana-cdnet, which cannot inspect the
      # JavaScript/TypeScript/Angular part of this repository.
      - name: Require Qodana Ultimate token
        shell: bash
        run: |
          if [[ -z "${QODANA_TOKEN}" ]]; then
            echo "::error::QODANA_TOKEN is required for full qodana-dotnet inspection coverage."
            exit 1
          fi

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: true
          push-fixes: none
