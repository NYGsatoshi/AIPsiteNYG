name: Code Quality

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  qodana-dotnet-community:
    name: Qodana Community / .NET
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run Qodana Community for .NET
        uses: JetBrains/qodana-action@v2026.1
        with:
          args: |
            --image jetbrains/qodana-cdnet:2026.1-eap-privileged
            --solution AipPortal.slnx
            --configuration Release
          pr-mode: false
          results-dir: ${{ runner.temp }}/qodana/results
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: true
          push-fixes: none

      - name: Guard Qodana project model
        if: always()
        env:
          QODANA_PROJECT_MODEL_SUMMARY_PATH: ${{ runner.temp }}/qodana/project-model-summary.json
        run: |
          node scripts/quality/check-qodana-project-model.mjs \
            "${{ runner.temp }}/qodana/results/qodana.sarif.json"

      - name: Upload Qodana project-model summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qodana-project-model-summary
          path: ${{ runner.temp }}/qodana/project-model-summary.json
          if-no-files-found: ignore

  frontend-quality:
    name: Angular / TypeScript / JavaScript / HTML / SCSS / CSS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      # TypeScript、JavaScript、Angular HTML template
      - name: ESLint and Angular template analysis
        run: npm run lint

      # CSS、SCSS
      - name: Stylelint
        run: npm run lint:styles

      # TypeScript型検査、Angular template型検査、production build
      - name: Angular production build
        run: npm run build

      # Angular unit tests
      - name: Angular unit tests
        run: npm test -- --watch=false

  root-ui-tests:
    name: Playwright / UI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Build Angular frontend
        run: npm --prefix frontend run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm run test:ui:angular
