name: Issue336 One-off Patch

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/issue336-oneoff-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    name: Patch regression fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/336-authoritative-folder-move
          fetch-depth: 0

      - name: Patch files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          spec = Path('frontend/src/app/features/files/files-page/files-page.component.spec.ts')
          text = spec.read_text()
          old = "  fixture.detectChanges();\n  flushFileList(http, items);\n  fixture.detectChanges();\n"
          new = "  fixture.detectChanges();\n  flushFolderList(http);\n  flushFileList(http, items);\n  fixture.detectChanges();\n"
          if old not in text:
              raise SystemExit('renderLiveFilesPage marker not found')
          text = text.replace(old, new, 1)
          marker = "const flushFileList = (http: HttpTestingController, items: readonly unknown[]): void => {\n"
          helper = """const flushFolderList = (http: HttpTestingController): void => {\n  const request = http.expectOne((candidate) => candidate.url === '/api/file-folders' && candidate.method === 'GET');\n  expect(request.request.params.get('workspaceId')).toBe(WORKSPACE_ID);\n  expect(request.request.withCredentials).toBe(true);\n  request.flush([]);\n};\n\n"""
          if marker not in text:
              raise SystemExit('flushFileList marker not found')
          text = text.replace(marker, helper + marker, 1)
          spec.write_text(text)

          service = Path('src/AipPortal.Infrastructure/Persistence/FileFolderService.cs')
          text = service.read_text()
          old = ".Include(candidate => candidate.FileObject)\n            .SingleOrDefaultAsync(candidate =>"
          new = ".Include(candidate => candidate.FileObject)\n            .OrderBy(candidate => candidate.Id)\n            .FirstOrDefaultAsync(candidate =>"
          if old not in text:
              raise SystemExit('workspace attachment lookup marker not found')
          service.write_text(text.replace(old, new, 1))

          store = Path('frontend/src/app/features/files/file-folders.service.ts')
          text = store.read_text()
          block = """interface FileLocationDto {\n  readonly fileObjectId?: unknown;\n  readonly workspaceId?: unknown;\n  readonly folderId?: unknown;\n  readonly version?: unknown;\n}\n\n"""
          if block not in text:
              raise SystemExit('unused FileLocationDto marker not found')
          store.write_text(text.replace(block, '', 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/features/files/files-page/files-page.component.spec.ts \
                  frontend/src/app/features/files/file-folders.service.ts \
                  src/AipPortal.Infrastructure/Persistence/FileFolderService.cs
          git commit -m "test(files): cover authoritative folder loading"
          git push origin HEAD:feat/336-authoritative-folder-move
