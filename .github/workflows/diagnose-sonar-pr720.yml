name: Apply remaining Sonar return fixes

on:
  push:
    branches:
      - feat/sec06-zap-authenticated-dast-578
    paths:
      - .github/workflows/diagnose-sonar-pr720.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Apply exact fixes and validate
        run: |
          set -euo pipefail
          python3 - <<'PYTHON_SCRIPT'
          from pathlib import Path

          path = Path("scripts/security/zap-runner.sh")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "  printf '%s\\n' alpha-owner alpha-restricted beta-owner\n}\n\nsecurity_zap_require_target() {",
              "  printf '%s\\n' alpha-owner alpha-restricted beta-owner || return 1\n  return 0\n}\n\nsecurity_zap_require_target() {",
              "security_zap_roles",
          )

          replace_once(
              "security_zap_target_regex() {\n  python3 - \"$SECURITY_SCAN_TARGET\" <<'PY'\n",
              "security_zap_target_regex() {\n  python3 - \"$SECURITY_SCAN_TARGET\" <<'PY' || return 1\n",
              "security_zap_target_regex command",
          )
          replace_once(
              "print(re.escape(sys.argv[1]))\nPY\n}\n\nsecurity_zap_cookie_header() {",
              "print(re.escape(sys.argv[1]))\nPY\n  return 0\n}\n\nsecurity_zap_cookie_header() {",
              "security_zap_target_regex return",
          )

          replace_once(
              "sys.stdout.write(text)\n'\n}\n\nsecurity_zap_verify_toolchain() {",
              "sys.stdout.write(text)\n' || return 1\n  return 0\n}\n\nsecurity_zap_verify_toolchain() {",
              "security_zap_redact_stream",
          )

          path.write_text(text, encoding="utf-8")
          PYTHON_SCRIPT

          bash -n scripts/security/zap-runner.sh
          bash -n scripts/security/test-zap-contract.sh
          bash scripts/security/test-zap-contract.sh
          git diff --check
          git diff -- scripts/security/zap-runner.sh

      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/security/zap-runner.sh
          git commit -m "fix remaining Sonar return findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
