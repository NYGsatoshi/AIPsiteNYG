name: Generate compatible npm security fixes

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 'security/npm-compatible-audit-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: security/npm-compatible-audit-fixes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            **/package-lock.json

      - name: Apply compatible lockfile security fixes
        shell: bash
        run: |
          set -uo pipefail
          mapfile -d '' lockfiles < <(
            find . -name package-lock.json \
              -not -path '*/node_modules/*' \
              -print0 | sort -z
          )

          if [ "${#lockfiles[@]}" -eq 0 ]; then
            echo "No package-lock.json files found." >&2
            exit 1
          fi

          for lockfile in "${lockfiles[@]}"; do
            package_dir="$(dirname "$lockfile")"
            relative_dir="${package_dir#./}"
            if [ "$relative_dir" = "." ] || [ -z "$relative_dir" ]; then
              relative_dir="root"
            fi

            echo "::group::npm audit fix: $relative_dir"
            set +e
            npm --prefix "$package_dir" audit fix \
              --package-lock-only \
              --ignore-scripts \
              --no-fund
            status=$?
            set -e
            echo "npm audit fix exit status: $status"
            echo "::endgroup::"
          done

      - name: Audit generated dependency trees
        shell: bash
        run: |
          mkdir -p artifacts/npm-audit-fixed
          while IFS= read -r -d '' lockfile; do
            package_dir="$(dirname "$lockfile")"
            relative_dir="${package_dir#./}"
            if [ "$relative_dir" = "." ] || [ -z "$relative_dir" ]; then
              relative_dir="root"
            fi
            report_name="$(printf '%s' "$relative_dir" | tr '/ ' '__')"
            npm --prefix "$package_dir" audit --package-lock-only --json \
              > "artifacts/npm-audit-fixed/${report_name}.json" || true
          done < <(find . -name package-lock.json -not -path '*/node_modules/*' -print0 | sort -z)

      - name: Upload generated lockfiles and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: npm-compatible-security-fixes
          path: |
            **/package-lock.json
            artifacts/npm-audit-fixed/*.json
          if-no-files-found: error
