@let vm = page();

<section class="dm-page" data-testid="dm-page">
  @if (realtime.connectionState() === 'Degraded') {
    <p class="dm-page__realtime-notice" role="status">Realtime updates are delayed. Sending and refresh remain available.</p>
  }
  <header class="dm-page__header">
    <div>
      <p class="dm-page__eyebrow">DM</p>
      <h1>{{ vm.conversation.title }}</h1>
      <p>{{ vm.conversation.subtitle }}</p>
    </div>
    <button type="button" data-testid="manual-refresh" (click)="facade.manualRefresh()">更新</button>
  </header>

  <main class="dm-page__main" data-testid="dm-route-surface">
    <app-message-timeline
      [messages]="vm.messages"
      [status]="vm.status"
      [canReadBody]="canReadBody()"
      [canViewOthersPreciseReadTimestamps]="false"
      [hasNewMessagesWhileReading]="vm.hasNewMessagesWhileReading"
      [inlineError]="vm.inlineError ?? ''"
      (retry)="facade.retryMessage($event)"
      (loadOlder)="facade.loadOlder()"
      (loadNewer)="facade.loadNewer()"
      (acknowledgeNewMessages)="facade.acknowledgeNewMessages()"
    />

    @if (showComposer()) {
      <app-message-composer
        [draft]="vm.draft"
        [disabled]="!canPost()"
        [sending]="vm.sending"
        [sendState]="vm.sendState"
        [disabledReason]="composerDisabledReason()"
        [attachmentDisabledLabel]="vm.conversation.attachment.label"
        (draftChange)="facade.setDraft($event)"
        (send)="facade.sendDraft()"
      />
    }
  </main>
</section>
