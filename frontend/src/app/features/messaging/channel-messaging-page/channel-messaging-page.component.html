@let vm = page();

<section class="messaging-page" data-testid="channel-messaging-page">
  @if (realtime.connectionState() === 'Degraded') {
    <p class="messaging-page__realtime-notice" role="status">Realtime updates are delayed. Sending and refresh remain available.</p>
  }
  <a
    id="messages-mobile-back-link"
    class="messaging-page__back"
    routerLink="/messages"
    [replaceUrl]="true"
    data-testid="messages-back-link"
    aria-label="会話一覧へ戻る"
  >
    ← 会話一覧
  </a>
  <header class="messaging-page__header">
    <div>
      <p class="messaging-page__eyebrow">チャンネル</p>
      <h1>{{ vm.conversation.title }}</h1>
      <p>{{ vm.conversation.subtitle }}</p>
    </div>
    <button type="button" data-testid="manual-refresh" (click)="facade.manualRefresh()">更新</button>
  </header>

  <div class="messaging-page__layout">
    <aside class="messaging-page__rail">
      <app-conversation-list
        [conversations]="vm.conversations"
        [selectedConversationId]="vm.conversation.id"
      />
    </aside>

    <main class="messaging-page__main" data-testid="conversation-surface">
      <app-message-timeline
        [messages]="vm.messages"
        [status]="vm.status"
        [canReadBody]="canReadBody()"
        [canViewOthersPreciseReadTimestamps]="canViewOthersPreciseReadTimestamps()"
        [hasNewMessagesWhileReading]="vm.hasNewMessagesWhileReading"
        [inlineError]="vm.inlineError ?? ''"
        (retry)="facade.retryMessage($event)"
        (loadOlder)="facade.loadOlder()"
        (loadNewer)="facade.loadNewer()"
        (acknowledgeNewMessages)="facade.acknowledgeNewMessages()"
      />

      @if (canReadBody()) {
        <app-thread-preview />
      }

      @if (showComposer()) {
        <app-message-composer
          [draft]="vm.draft"
          [disabled]="!canPost()"
          [sending]="vm.sending"
          [sendState]="vm.sendState"
          [disabledReason]="composerDisabledReason()"
          [attachmentDisabledLabel]="vm.conversation.attachment.label"
          [mentionCandidates]="vm.conversation.mentionCandidates ?? []"
          (draftChange)="facade.setDraft($event)"
          (send)="facade.sendDraft($event)"
        />
      }
    </main>
  </div>
</section>
