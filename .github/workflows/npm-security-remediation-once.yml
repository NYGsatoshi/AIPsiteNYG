name: One-shot npm security remediation

on:
  push:
    branches:
      - chore/npm-security-remediation-20260801
    paths:
      - frontend/package.json
      - aipsite-frontend/package.json
      - .github/workflows/npm-security-remediation-once.yml
  pull_request:
    branches:
      - main
    paths:
      - frontend/package.json
      - aipsite-frontend/package.json
      - .github/workflows/npm-security-remediation-once.yml

permissions:
  contents: write

concurrency:
  group: npm-security-remediation-20260801
  cancel-in-progress: true

jobs:
  update-lockfiles:
    runs-on: self-hosted
    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout remediation branch
        uses: actions/checkout@v7
        with:
          ref: chore/npm-security-remediation-20260801
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            aipsite-frontend/package-lock.json

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Refresh lockfiles and apply compatible audit fixes
        shell: bash
        run: |
          set -euo pipefail
          for package_dir in frontend aipsite-frontend; do
            echo "::group::Refresh $package_dir"
            npm --prefix "$package_dir" install \
              --package-lock-only \
              --ignore-scripts \
              --no-audit \
              --no-fund

            set +e
            npm --prefix "$package_dir" audit fix \
              --package-lock-only \
              --ignore-scripts \
              --no-fund
            audit_fix_status=$?
            set -e

            if [ "$audit_fix_status" -ne 0 ]; then
              echo "Compatible fixes were applied where possible; unresolved advisories remain in $package_dir."
            fi
            echo "::endgroup::"
          done

      - name: Validate deterministic installs
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
          npm --prefix aipsite-frontend ci --ignore-scripts --no-audit --no-fund

      - name: Record post-remediation audit summaries
        shell: bash
        run: |
          set -uo pipefail
          for package_dir in frontend aipsite-frontend; do
            echo "::group::npm audit: $package_dir"
            npm --prefix "$package_dir" audit --package-lock-only || true
            echo "::endgroup::"
          done

      - name: Commit generated lockfiles and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/npm-security-remediation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/package.json \
            frontend/package-lock.json \
            aipsite-frontend/package.json \
            aipsite-frontend/package-lock.json \
            .github/workflows/npm-security-remediation-once.yml
          git commit -m "chore(deps): regenerate npm security lockfiles"
          git push origin HEAD:refs/heads/chore/npm-security-remediation-20260801

      - name: Repair workspace ownership
        if: always()
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"
