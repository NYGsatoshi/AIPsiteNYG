name: PR252 Regenerate Frontend Lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/frontend/multi-b62dc2f915
    paths:
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/pr252-regenerate-lock.yml

permissions:
  contents: write

concurrency:
  group: pr252-regenerate-frontend-lock
  cancel-in-progress: true

jobs:
  regenerate-lockfile:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dependabot/npm_and_yarn/frontend/multi-b62dc2f915

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerate and verify lockfile
        working-directory: frontend
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Remove one-time workflow and commit result
        shell: bash
        run: |
          rm .github/workflows/pr252-regenerate-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json .github/workflows/pr252-regenerate-lock.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated." >&2
            exit 1
          fi
          git commit -m "fix(deps): regenerate frontend lockfile"
          git push origin HEAD:dependabot/npm_and_yarn/frontend/multi-b62dc2f915
