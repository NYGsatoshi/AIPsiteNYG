name: PR 280 Lockfile Repair

on:
  push:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.17.0
      - working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - working-directory: aipsite-frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json aipsite-frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(ci): regenerate lockfiles for Angular 21 compatibility"
          git push origin "HEAD:${GITHUB_REF_NAME}"
