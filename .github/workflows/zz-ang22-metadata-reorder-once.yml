name: ANG22 metadata comma fix (one-shot)

on:
  push:
    branches:
      - chore/ang22-05-official-migrations
    paths:
      - .github/workflows/zz-ang22-metadata-reorder-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize migrated changeDetection commas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('frontend/src')
          target = 'changeDetection: ChangeDetectionStrategy.Eager'
          modified_files = 0
          modified_entries = 0

          for path in sorted(root.rglob('*.ts')):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              changed = False
              for index, line in enumerate(lines):
                  if target not in line:
                      continue
                  body = line.rstrip('\r\n')
                  newline = line[len(body):]
                  if body.rstrip().endswith(','):
                      continue
                  lines[index] = body + ',' + newline
                  changed = True
                  modified_entries += 1
              if changed:
                  path.write_text(''.join(lines), encoding='utf-8')
                  modified_files += 1

          print(f'modified_files={modified_files} modified_entries={modified_entries}')
          if modified_entries == 0:
              raise SystemExit('No migrated changeDetection commas required normalization.')
          PY

          git diff --check

      - name: Commit metadata comma fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src
          git commit -m 'fix(angular): preserve migrated component metadata syntax'
          git push origin HEAD:chore/ang22-05-official-migrations
