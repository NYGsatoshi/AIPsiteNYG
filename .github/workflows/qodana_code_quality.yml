name: Code Quality

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana-dotnet-community:
    name: Qodana Community / .NET
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'self-hosted' }}
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
      checks: write
    # Trusted main runs share the self-hosted machine with frontend-heavy jobs;
    # PR runs use an ephemeral GitHub-hosted runner and a PR-local queue.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('aipsite-code-quality-pr-{0}', github.event.pull_request.number) || 'aipsite-self-hosted-frontend-heavy-v2' }}
      cancel-in-progress: false
      queue: max

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      QODANA_FRONTEND_REQUIRED: "false"

    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure persistent .NET caches
        shell: bash
        run: bash scripts/ci/configure-persistent-caches.sh

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Remove orphaned Qodana containers for this workspace
        shell: bash
        run: bash scripts/ci/cleanup-qodana-containers.sh "$GITHUB_WORKSPACE"

      - name: Record complete Qodana inspection inventory
        # This non-gating inventory makes existing findings reviewable. The
        # following PR-mode scan is the deterministic blocking gate.
        continue-on-error: true
        uses: JetBrains/qodana-action@v2026.1.3
        with:
          args: |
            --image jetbrains/qodana-cdnet:2026.1-eap-privileged
            --solution AipPortal.slnx
            --configuration Release
          pr-mode: false
          results-dir: ${{ runner.temp }}/qodana/full-results-${{ github.run_id }}-${{ github.run_attempt }}
          use-caches: false
          post-pr-comment: false
          use-annotations: false
          upload-result: false
          push-fixes: none

      - name: Upload complete Qodana inspection inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-full-inventory
          path: ${{ runner.temp }}/qodana/full-results-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn

      - name: Remove Qodana inventory container before the PR gate
        shell: bash
        run: bash scripts/ci/cleanup-qodana-containers.sh "$GITHUB_WORKSPACE"

      - name: Gate PR-introduced Qodana findings
        id: qodana_gate
        uses: JetBrains/qodana-action@v2026.1.3
        with:
          args: |
            --image jetbrains/qodana-cdnet:2026.1-eap-privileged
            --solution AipPortal.slnx
            --configuration Release
          # fetch-depth: 0 plus PR mode compares this head to its GitHub base;
          # runner cache is never used as a baseline.
          pr-mode: true
          results-dir: ${{ runner.temp }}/qodana/results-${{ github.run_id }}-${{ github.run_attempt }}
          use-caches: false
          post-pr-comment: true
          use-annotations: true
          upload-result: true
          push-fixes: none

      - name: Repair Qodana workspace ownership
        if: always()
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Set up Node.js for project-model guard
        if: steps.qodana_gate.outcome == 'success'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Guard Qodana project model
        if: steps.qodana_gate.outcome == 'success'
        env:
          QODANA_PROJECT_MODEL_SUMMARY_PATH: ${{ runner.temp }}/qodana/project-model-summary.json
        shell: bash
        run: |
          sarif="${RUNNER_TEMP}/qodana/results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/qodana.sarif.json"
          if [[ ! -f "$sarif" ]]; then
            echo "::error::Qodana gate succeeded without producing the required SARIF report."
            exit 1
          fi
          node scripts/quality/check-qodana-project-model.mjs "$sarif"

      - name: Upload Qodana project-model summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-project-model-summary
          path: ${{ runner.temp }}/qodana/project-model-summary.json
          if-no-files-found: ignore

  frontend-quality:
    name: Angular / TypeScript / JavaScript / HTML / SCSS / CSS
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'self-hosted' }}
    needs: qodana-dotnet-community
    if: ${{ always() }}
    timeout-minutes: 90
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('aipsite-code-quality-pr-{0}', github.event.pull_request.number) || 'aipsite-self-hosted-frontend-heavy-v2' }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Configure persistent npm and Angular caches
        env:
          CI_ENABLE_ANGULAR_CACHE: "1"
        shell: bash
        run: bash scripts/ci/configure-persistent-caches.sh

      - name: Report Node toolchain
        run: |
          node --version
          npm --version

      - name: Install repository test dependencies
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Install Angular dependencies
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Install inspection toolchain
        shell: bash
        run: |
          for attempt in 1 2; do
            set +e
            if [[ "$attempt" -eq 1 ]]; then
              npm --prefix tools/frontend-inspections install --prefer-offline --ignore-scripts --no-audit --no-fund
            else
              npm_config_prefer_offline=false npm --prefix tools/frontend-inspections install --prefer-online --ignore-scripts --no-audit --no-fund
            fi
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if [[ "$attempt" -eq 2 ]]; then
              exit "$status"
            fi
            df -h || true
            df -i || true
            free -h || true
            sleep 10
          done

      - name: Run complete frontend inspection inventory
        shell: bash
        run: |
          mkdir -p artifacts/frontend-inspections
          printf '{"status":"inspection-started","workflow":"code-quality"}\n' > artifacts/frontend-inspections/ci-manifest.json
          npm run lint:frontend

      - name: Upload frontend inspection reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-inspection-reports
          path: artifacts/frontend-inspections
          if-no-files-found: warn
          retention-days: 14

      - name: Validate TypeScript types
        working-directory: frontend
        run: ./node_modules/.bin/tsc --noEmit --project tsconfig.app.json

      - name: Validate Angular templates and styles
        run: npm --prefix frontend run build

      - name: Run Angular unit tests
        run: npm --prefix frontend test

      - name: Report cache and host resources on failure
        if: failure()
        shell: bash
        run: |
          du -sh "$HOME/.npm" "$HOME/.nuget/packages" "$HOME/.cache/aipsite-ci" 2>/dev/null || true
          df -h || true
          df -i || true
          free -h || true
          docker system df || true
