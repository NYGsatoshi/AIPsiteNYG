name: FCI-07 Functional Security

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Functional authorization-negative gate to run
        required: true
        default: functional-fast
        type: choice
        options:
          - functional-fast
          - functional-full
          - functional-extended
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/fci07-functional-security.yml"
      - "docker-compose.real-backend-smoke.yml"
      - "docker-compose.security.yml"
      - "docker-compose.fci07-functional-security.yml"
      - "Dockerfile"
      - "Dockerfile.playwright"
      - "package.json"
      - "package-lock.json"
      - "playwright.functional.config.ts"
      - "scripts/ci/functional-compose-harness.sh"
      - "scripts/ci/run-fci07-functional-security.sh"
      - "scripts/ci/run-fci07-playwright-owners.sh"
      - "scripts/ci/run-functional-playwright.mjs"
      - "scripts/ci/build-functional-grep.mjs"
      - "scripts/ci/functional-tags.mjs"
      - "tests/functional/**"
      - "src/**"
      - "frontend/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fci07-functional-security.yml"
      - "docker-compose.real-backend-smoke.yml"
      - "docker-compose.security.yml"
      - "docker-compose.fci07-functional-security.yml"
      - "Dockerfile"
      - "Dockerfile.playwright"
      - "package.json"
      - "package-lock.json"
      - "playwright.functional.config.ts"
      - "scripts/ci/**"
      - "tests/functional/**"
      - "src/**"
      - "frontend/**"
  schedule:
    - cron: "17 18 * * *"

concurrency:
  group: fci07-functional-security-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authorization-negative:
    name: FCI-07 authorization negative / ${{ github.event_name == 'pull_request' && 'fast' || github.event_name == 'push' && 'full' || github.event_name == 'schedule' && 'extended' || inputs.gate }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: syncfusion-licensed-build
    timeout-minutes: 90

    env:
      SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify protected license input
        shell: bash
        run: |
          test -n "${SYNCFUSION_LICENSE:-}" || {
            echo "SYNCFUSION_LICENSE is not configured in the protected environment." >&2
            exit 1
          }

      - name: Select FCI-07 gate
        id: gate
        shell: bash
        env:
          DISPATCH_GATE: ${{ inputs.gate }}
        run: |
          case "${GITHUB_EVENT_NAME}" in
            pull_request) gate=functional-fast ;;
            push) gate=functional-full ;;
            schedule) gate=functional-extended ;;
            workflow_dispatch) gate="${DISPATCH_GATE:-functional-fast}" ;;
            *) echo "Unsupported event: ${GITHUB_EVENT_NAME}" >&2; exit 2 ;;
          esac
          case "$gate" in
            functional-fast|functional-full|functional-extended) ;;
            *) echo "Unsupported FCI-07 gate: $gate" >&2; exit 2 ;;
          esac
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - name: Prune unused Docker networks
        run: docker network prune --force

      - name: Run required FCI-07 authorization-negative owners
        shell: bash
        run: bash scripts/ci/run-fci07-functional-security.sh "${{ steps.gate.outputs.gate }}"

      - name: Upload bounded FCI-07 evidence on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fci07-functional-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
