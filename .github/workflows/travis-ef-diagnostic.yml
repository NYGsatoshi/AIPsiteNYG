name: Temporary Travis EF Diagnostic

on:
  push:
    branches: ["ci/travis-full-migration"]

permissions:
  contents: read

jobs:
  ef-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run exact Travis PostgreSQL + EF entry point
        env:
          TRAVIS_JOB_ID: gha-diagnostic
        run: bash scripts/ci/run-travis-backend.sh ef
