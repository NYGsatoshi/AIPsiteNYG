<section class="password-panel" data-testid="password-panel">
  <div class="password-panel__header">
    <p class="password-panel__eyebrow">Password</p>
    <h2>Change password</h2>
  </div>

  @if (result === 'success') {
    <p class="password-panel__notice password-panel__notice--success" data-testid="password-change-success">
      Password changed.
    </p>
  } @else if (result === 'failure') {
    <p class="password-panel__notice password-panel__notice--failure" data-testid="password-change-failure">
      Password change failed. Check the current password and try again.
    </p>
  } @else if (pending) {
    <p class="password-panel__notice" data-testid="password-change-pending">
      Changing password...
    </p>
  }

  <form class="password-panel__form" [formGroup]="form" (ngSubmit)="submit()">
    <label>
      <span>Current password</span>
      <input type="password" formControlName="currentPassword" autocomplete="current-password" data-testid="current-password" />
      <app-field-error [messages]="currentPasswordMessages" />
    </label>

    <label>
      <span>New password</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" data-testid="new-password" />
      <app-field-error [messages]="newPasswordMessages" />
    </label>

    <label>
      <span>Confirm new password</span>
      <input type="password" formControlName="confirmNewPassword" autocomplete="new-password" data-testid="confirm-new-password" />
      <app-field-error [messages]="confirmNewPasswordMessages" />
    </label>

    <button type="submit" [disabled]="pending">{{ pending ? 'Changing...' : 'Change password' }}</button>
  </form>
</section>
