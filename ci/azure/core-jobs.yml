jobs:
  - job: DetectChanges
    displayName: Detect CI scopes
    timeoutInMinutes: 5
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: false

      - bash: |
          set -euo pipefail

          head_sha="$SOURCE_VERSION"
          if [ "$BUILD_REASON" = "PullRequest" ] && [ -n "${PR_SOURCE_COMMIT:-}" ]; then
            head_sha="$PR_SOURCE_COMMIT"
            target="${PR_TARGET_BRANCH#refs/heads/}"
            git fetch --no-tags origin "$target"
            base_sha="$(git merge-base "$head_sha" "origin/$target")"
          else
            if git rev-parse "${head_sha}^" >/dev/null 2>&1; then
              base_sha="${head_sha}^"
            else
              base_sha="$(git hash-object -t tree /dev/null)"
            fi
          fi

          echo "base=$base_sha"
          echo "head=$head_sha"
          git diff --name-only --diff-filter=ACMR "$base_sha" "$head_sha" | sort -u > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt || true

          primary=false
          docs=false
          backend=false
          frontend=false
          preflight=false
          dotnet_security=false
          container_security=false
          npm_security=false
          npm_legacy=false
          qodana=false
          p0=false
          my_tasks=false
          mbj01=false
          mbj02=false
          mbj03=false
          migration_all=false

          while IFS= read -r file; do
            [ -n "$file" ] || continue

            if [ "$file" = "azure-pipelines.yml" ] || [[ "$file" == ci/azure/* ]]; then
              migration_all=true
            fi

            case "$file" in
              *.md|docs/*|.github/workflows/documentation_ci.yml.disabled) docs=true ;;
              *) primary=true ;;
            esac

            case "$file" in
              src/*|tests/AipPortal.Tests/*|AipPortal.slnx|global.json|Directory.Build.*|Directory.Packages.*|NuGet.config|NuGet.Config|.config/dotnet-tools.json|*.csproj|*.props|*.targets|*.sln|*.slnx|scripts/ci/verify-trx-results.sh|scripts/ci/task-pr07*-required-tests.txt|scripts/ci/wpc02*-required-tests.txt)
                backend=true ;;
            esac

            case "$file" in
              frontend/*|tests/ui/*|tools/frontend-inspections/*|package.json|package-lock.json|frontend.Dockerfile|Dockerfile.playwright|docker-compose.playwright.yml|scripts/ci/npm-ci-retry.sh|scripts/ci/verify-node-toolchain.mjs|scripts/ci/build-playwright-grep.mjs|scripts/ci/verify-playwright-required-tests.mjs|scripts/ci/real-backend-*-required-tests.txt)
                frontend=true ;;
            esac

            case "$file" in
              Dockerfile|frontend.Dockerfile|package.json|frontend/package.json|scripts/ci/verify-node-toolchain.mjs|scripts/ci/build-playwright-grep.mjs|scripts/ci/real-backend-pr-p0-required-tests.txt|scripts/ci/verify-playwright-required-tests.mjs|tests/ui/build-playwright-grep.node-test.mjs|tests/ui/verify-playwright-required-tests.node-test.mjs|tests/ui/real-backend-smoke-compose-helpers.mjs|tests/ui/real-backend-smoke-compose-helpers.node-test.mjs|tests/ui/real-backend-smoke.spec.ts|tests/ui/prepare-real-backend-p0-state.mjs|tests/ui/run-real-backend-p0.mjs|tests/ui/run-real-backend-playwright.mjs|tests/ui/run-real-backend-smoke-compose.mjs|.github/workflows/node-toolchain-preflight.yml.disabled|.github/workflows/real-backend-p0-preflight.yml.disabled)
                preflight=true ;;
            esac

            case "$file" in
              *.csproj|*.props|*.targets|*.sln|*.slnx|Directory.Packages.*|NuGet.config|NuGet.Config|global.json|packages.lock.json|packages.config|.config/dotnet-tools.json)
                dotnet_security=true ;;
            esac

            case "$file" in
              Dockerfile|Dockerfile.*|frontend.Dockerfile|docker-compose*.yml|deploy/*docker-compose*.yml|*.csproj|*.props|*.targets|Directory.Packages.*|global.json|package.json|package-lock.json|frontend/package.json|frontend/package-lock.json)
                container_security=true ;;
            esac

            case "$file" in
              package.json|package-lock.json|frontend/package.json|frontend/package-lock.json|aipsite-frontend/package.json|aipsite-frontend/package-lock.json|.npmrc|scripts/ci/verify-npm-lockfile.mjs|scripts/ci/check-npm-audit-baseline.mjs|scripts/ci/npm-audit-baseline.json|scripts/ci/npm-ci-retry.sh)
                npm_security=true ;;
            esac

            case "$file" in
              aipsite-frontend/package.json|aipsite-frontend/package-lock.json|scripts/ci/npm-ci-retry.sh)
                npm_legacy=true ;;
            esac

            case "$file" in
              src/*|tests/AipPortal.Tests/*|*.csproj|*.sln|*.slnx|Directory.Build.*|Directory.Packages.*|global.json|qodana.yaml|.editorconfig|scripts/quality/*)
                qodana=true ;;
            esac

            case "$file" in
              Dockerfile|Dockerfile.playwright|docker-compose.real-backend-smoke.yml|frontend/*|src/*|tests/ui/*|scripts/ci/*|package.json|package-lock.json|global.json|.github/workflows/real-backend-p0.yml.disabled)
                p0=true ;;
            esac

            case "$file" in
              Dockerfile|Dockerfile.playwright|docker-compose.real-backend-smoke.yml|package.json|package-lock.json|global.json|scripts/ci/build-playwright-grep.mjs|scripts/ci/verify-playwright-required-tests.mjs|scripts/ci/real-backend-my-tasks-required-tests.txt|tests/ui/real-backend-smoke.spec.ts|tests/ui/run-real-backend-my-tasks.mjs|tests/ui/run-real-backend-smoke-compose.mjs|tests/ui/run-real-backend-playwright.mjs|tests/ui/real-backend-smoke-compose-helpers.mjs|src/AipPortal.Application/Planning/*|src/AipPortal.Application/Common/Interfaces/IPlanningRepository.cs|src/AipPortal.Application/Common/Interfaces/IOrganizationRepositories.cs|src/AipPortal.Application/Workspaces/*|src/AipPortal.Application/Realtime/*|src/AipPortal.Infrastructure/Persistence/PlanningRepository.cs|src/AipPortal.Infrastructure/Persistence/ProjectReadScope.cs|src/AipPortal.Infrastructure/Persistence/OrganizationRepositories.cs|src/AipPortal.Infrastructure/Persistence/CurrentAuthorizationTargetResolver.cs|src/AipPortal.Infrastructure/Persistence/AppDbContextSeed.cs|src/AipPortal.Web/Controllers/PlanningController.cs|src/AipPortal.Web/Controllers/WorkspacesController.cs|src/AipPortal.Web/Realtime/*|frontend/src/app/features/projects/my-tasks.facade.ts|frontend/src/app/features/projects/my-tasks.facade.spec.ts|frontend/src/app/features/projects/my-tasks-page/*|frontend/src/app/features/projects/projects.api.ts|frontend/src/app/core/realtime/*|.github/workflows/real-backend-my-tasks.yml.disabled)
                my_tasks=true ;;
            esac

            case "$file" in
              docker-compose.mbj01-bootstrap.yml|docker-compose.real-backend-smoke.yml|Dockerfile|Dockerfile.playwright|AipPortal.slnx|global.json|Directory.Build.*|Directory.Packages.*|NuGet.config|package.json|package-lock.json|frontend/*|src/*|scripts/ci/run-mbj01-bootstrap-acceptance.sh|scripts/ci/verify-npm-lockfile.mjs|tests/ui/mbj01-bootstrap-acceptance.mjs|.github/workflows/mbj01-bootstrap-acceptance.yml.disabled)
                mbj01=true ;;
            esac

            case "$file" in
              docker-compose.mbj02-invite.yml|docker-compose.real-backend-smoke.yml|Dockerfile|Dockerfile.playwright|AipPortal.slnx|global.json|Directory.Build.*|Directory.Packages.*|NuGet.config|package.json|package-lock.json|frontend/*|src/*|scripts/ci/run-mbj02-invite-acceptance.sh|scripts/ci/verify-npm-lockfile.mjs|tests/ui/mbj02-invite-acceptance.mjs|.github/workflows/mbj02-invite-onboarding.yml.disabled)
                mbj02=true ;;
            esac

            case "$file" in
              docker-compose.mbj03-session.yml|docker-compose.real-backend-smoke.yml|Dockerfile|Dockerfile.playwright|AipPortal.slnx|global.json|Directory.Build.*|Directory.Packages.*|NuGet.config|package.json|package-lock.json|frontend/*|src/*|scripts/ci/run-mbj03-session-acceptance.sh|scripts/ci/verify-npm-lockfile.mjs|tests/ui/mbj03-session-acceptance.mjs|.github/workflows/mbj03-session-lifecycle.yml.disabled)
                mbj03=true ;;
            esac
          done < changed-files.txt

          if [ "$migration_all" = true ]; then
            primary=true
            docs=true
            backend=true
            frontend=true
            preflight=true
            dotnet_security=true
            container_security=true
            npm_security=true
            npm_legacy=true
            qodana=true
            p0=true
            my_tasks=true
            mbj01=true
            mbj02=true
            mbj03=true
          fi

          set_output() {
            echo "##vso[task.setvariable variable=$1;isOutput=true]$2"
          }
          set_output primary "$primary"
          set_output docs "$docs"
          set_output backend "$backend"
          set_output frontend "$frontend"
          set_output preflight "$preflight"
          set_output dotnetSecurity "$dotnet_security"
          set_output containerSecurity "$container_security"
          set_output npmSecurity "$npm_security"
          set_output npmLegacy "$npm_legacy"
          set_output qodana "$qodana"
          set_output p0 "$p0"
          set_output myTasks "$my_tasks"
          set_output mbj01 "$mbj01"
          set_output mbj02 "$mbj02"
          set_output mbj03 "$mbj03"
        name: changes
        displayName: Classify changed paths
        env:
          BUILD_REASON: $(Build.Reason)
          SOURCE_VERSION: $(Build.SourceVersion)
          PR_SOURCE_COMMIT: $(System.PullRequest.SourceCommitId)
          PR_TARGET_BRANCH: $(System.PullRequest.TargetBranch)

  - job: Documentation
    displayName: Documentation validation
    dependsOn: DetectChanges
    condition: and(succeeded(), eq(dependencies.DetectChanges.outputs['changes.docs'], 'true'))
    timeoutInMinutes: 10
    steps:
      - checkout: self
        persistCredentials: false
      - bash: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          paths = sorted({p for p in Path('.').rglob('*.md') if '.git' not in p.parts})
          errors = []
          checked = 0
          for path in paths:
              checked += 1
              data = path.read_bytes()
              if b'\x00' in data:
                  errors.append(f'{path}: contains a NUL byte')
                  continue
              try:
                  text = data.decode('utf-8-sig')
              except UnicodeDecodeError as exc:
                  errors.append(f'{path}: invalid UTF-8 ({exc})')
                  continue
              for line_number, line in enumerate(text.splitlines(), start=1):
                  stripped = line.lstrip()
                  if stripped.startswith('<<<<<<< ') or stripped == '=======' or stripped.startswith('>>>>>>> '):
                      errors.append(f'{path}:{line_number}: unresolved merge-conflict marker')
          if errors:
              print('Documentation validation failed:', file=sys.stderr)
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)
          print(f'Documentation validation passed for {checked} file(s).')
          PY
        displayName: Validate UTF-8 and conflict markers

  - job: BuildTest
    displayName: Backend build, test and .NET dependency gates
    dependsOn: DetectChanges
    condition: and(succeeded(), eq(dependencies.DetectChanges.outputs['changes.backend'], 'true'))
    timeoutInMinutes: 60
    services:
      postgres: postgres
    variables:
      ASPNETCORE_ENVIRONMENT: Test
      ConnectionStrings__DefaultConnection: 'Host=localhost;Port=5432;Database=aip_portal_ci;Username=aip_portal_ci;Password=aip_portal_ci_password'
      POSTGRES_TEST_CONNECTION_STRING: 'Host=localhost;Port=5432;Database=aip_portal_ci;Username=aip_portal_ci;Password=aip_portal_ci_password'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: '1'
      runDotnetSecurity: $[ dependencies.DetectChanges.outputs['changes.dotnetSecurity'] ]
    steps:
      - checkout: self
        persistCredentials: false
      - task: UseDotNet@2
        displayName: Install .NET SDK from global.json
        inputs:
          packageType: sdk
          useGlobalJson: true
          workingDirectory: '$(Build.SourcesDirectory)'
      - bash: |
          set -euo pipefail
          postgres_id="$(docker ps --filter 'ancestor=postgres:18-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_id"
          for attempt in $(seq 1 30); do
            docker exec "$postgres_id" pg_isready -U aip_portal_ci -d aip_portal_ci && exit 0
            sleep 2
          done
          docker logs "$postgres_id" || true
          exit 1
        displayName: Wait for PostgreSQL
      - bash: |
          set -euo pipefail
          mkdir -p artifacts/ci artifacts/test-results artifacts/security
          log="artifacts/ci/build-test-dotnet-restore.log"
          set +e
          dotnet restore AipPortal.slnx --disable-parallel --verbosity normal 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
        displayName: Restore
      - bash: dotnet build AipPortal.slnx --configuration Release --no-restore --disable-build-servers -m:1
        displayName: Build
      - bash: dotnet tool restore
        displayName: Restore .NET tools
      - bash: dotnet ef database update --project src/AipPortal.Infrastructure --startup-project src/AipPortal.Web --configuration Release
        displayName: Apply PostgreSQL migrations
      - bash: dotnet ef migrations has-pending-model-changes --project src/AipPortal.Infrastructure --startup-project src/AipPortal.Web --configuration Release --no-build
        displayName: Verify EF Core model
      - bash: >-
          dotnet test AipPortal.slnx
          --configuration Release --no-build --disable-build-servers -m:1
          --verbosity normal --logger "trx;LogFileName=backend-tests.trx"
          --results-directory artifacts/test-results
        displayName: Full backend tests

      - bash: bash scripts/ci/verify-trx-results.sh artifacts/test-results/backend-tests.trx --minimum-total 1 --label "Full backend"
        displayName: Verify full backend results
        condition: succeededOrFailed()
      - bash: bash scripts/ci/verify-trx-results.sh artifacts/test-results/backend-tests.trx --minimum-total 1 --required-tests scripts/ci/task-pr07b-required-tests.txt --label "TASK-V1-PR07-B"
        displayName: Verify TASK-V1-PR07-B required tests from full run
        condition: succeededOrFailed()
      - bash: bash scripts/ci/verify-trx-results.sh artifacts/test-results/backend-tests.trx --minimum-total 1 --required-tests scripts/ci/task-pr07c-required-tests.txt --label "TASK-V1-PR07-C"
        displayName: Verify TASK-V1-PR07-C required tests from full run
        condition: succeededOrFailed()
      - bash: bash scripts/ci/verify-trx-results.sh artifacts/test-results/backend-tests.trx --minimum-total 1 --required-tests scripts/ci/task-pr07d-required-tests.txt --label "TASK-V1-PR07-D"
        displayName: Verify TASK-V1-PR07-D required tests from full run
        condition: succeededOrFailed()
      - bash: bash scripts/ci/verify-trx-results.sh artifacts/test-results/backend-tests.trx --minimum-total 4 --required-tests scripts/ci/wpc02b-required-tests.txt --label "WPC-02B PostgreSQL"
        displayName: Verify WPC-02B required tests from full run
        condition: succeededOrFailed()
      - bash: bash scripts/ci/verify-trx-results.sh artifacts/test-results/backend-tests.trx --minimum-total 15 --required-tests scripts/ci/wpc02c-required-tests.txt --label "WPC-02C PostgreSQL"
        displayName: Verify WPC-02C required tests from full run
        condition: succeededOrFailed()

      - bash: |
          set -euo pipefail
          set +e
          dotnet list AipPortal.slnx package --vulnerable --include-transitive > artifacts/security/dotnet-vulnerable-packages.txt 2>&1
          status=$?
          set -e
          cat artifacts/security/dotnet-vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" artifacts/security/dotnet-vulnerable-packages.txt; then
            exit 1
          fi
          exit "$status"
        displayName: Check .NET vulnerable packages
        condition: and(succeededOrFailed(), eq(variables['runDotnetSecurity'], 'true'))
      - bash: |
          set -euo pipefail
          set +e
          dotnet list AipPortal.slnx package --deprecated > artifacts/security/dotnet-deprecated-packages.txt 2>&1
          status=$?
          set -e
          cat artifacts/security/dotnet-deprecated-packages.txt
          exit "$status"
        displayName: Report .NET deprecated packages
        condition: and(succeededOrFailed(), eq(variables['runDotnetSecurity'], 'true'))

      - task: PublishTestResults@2
        displayName: Publish backend test results
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: 'artifacts/test-results/*.trx'
          searchFolder: '$(Build.SourcesDirectory)'
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: false
      - task: PublishPipelineArtifact@1
        displayName: Publish backend artifacts
        condition: always()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/artifacts'
          artifact: backend-ci-artifacts
          publishLocation: pipeline
