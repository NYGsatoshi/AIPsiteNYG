name: SonarQube

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional same-repository PR number to analyze after trust review
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  SONAR_SCANNER_VERSION: '11.3.0'

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve trusted pull request
        if: github.event_name == 'workflow_dispatch' && inputs.pull_request != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          if ($env:PR_NUMBER -notmatch '^\d+$') {
            throw 'pull_request must be a numeric pull request number.'
          }

          $pr = gh api "repos/${{ github.repository }}/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if ($pr.state -ne 'open') {
            throw "PR #$env:PR_NUMBER is not open."
          }
          if ($pr.head.repo.full_name -ne '${{ github.repository }}') {
            throw 'Only same-repository pull requests may be analyzed by this privileged workflow.'
          }
          if ($pr.base.ref -ne 'main') {
            throw "PR #$env:PR_NUMBER targets '$($pr.base.ref)', not 'main'."
          }

          git fetch --no-tags origin $pr.head.sha
          git checkout --detach $pr.head.sha

          "SONAR_PR_KEY=$($pr.number)" >> $env:GITHUB_ENV
          "SONAR_PR_BRANCH=$($pr.head.ref)" >> $env:GITHUB_ENV
          "SONAR_PR_BASE=$($pr.base.ref)" >> $env:GITHUB_ENV

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install SonarScanner for .NET
        shell: pwsh
        run: |
          New-Item -Path "${{ runner.temp }}\scanner" -ItemType Directory -Force | Out-Null
          dotnet tool install dotnet-sonarscanner --tool-path "${{ runner.temp }}\scanner" --version "$env:SONAR_SCANNER_VERSION"

      - name: Validate SonarQube configuration
        shell: pwsh
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'NYGsatoshi_AIPsiteNYG' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
            throw 'SONAR_HOST_URL secret is required for SonarQube Server.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw 'SONAR_TOKEN secret is required for SonarQube Server.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_PROJECT_KEY)) {
            throw 'SONAR_PROJECT_KEY repository variable is empty.'
          }

      - name: Restore .NET solution
        shell: pwsh
        run: dotnet restore Coglatas.slnx

      - name: Build and analyze
        shell: pwsh
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'NYGsatoshi_AIPsiteNYG' }}
        run: |
          $scanner = "${{ runner.temp }}\scanner\dotnet-sonarscanner.exe"
          $beginArgs = @(
            'begin',
            "/k:$env:SONAR_PROJECT_KEY",
            "/d:sonar.host.url=$env:SONAR_HOST_URL",
            "/d:sonar.token=$env:SONAR_TOKEN",
            '/d:sonar.sourceEncoding=UTF-8',
            '/d:sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,**/TestResults/**,**/test-results/**,**/playwright-report/**,**/.playwright/**,**/storybook-static/**,**/artifacts/**,src/Coglatas.Web/wwwroot/**,src/Coglatas.Web/data/**,coglatas-frontend/**',
            '/d:sonar.cpd.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/artifacts/**,src/Coglatas.Web/wwwroot/**,coglatas-frontend/**'
          )

          if (-not [string]::IsNullOrWhiteSpace($env:SONAR_PR_KEY)) {
            $beginArgs += "/d:sonar.pullrequest.key=$env:SONAR_PR_KEY"
            $beginArgs += "/d:sonar.pullrequest.branch=$env:SONAR_PR_BRANCH"
            $beginArgs += "/d:sonar.pullrequest.base=$env:SONAR_PR_BASE"
          }

          & $scanner @beginArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet build Coglatas.slnx --configuration Release --no-restore --no-incremental
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $scanner end "/d:sonar.token=$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
