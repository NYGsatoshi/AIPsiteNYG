version: "1.0"

# Qodana Community for .NET analyzes C#, ASP.NET Core and the .NET solution.
linter: qodana-cdnet

profile:
  name: qodana.recommended

# Qodana invokes bootstrap commands with /bin/sh by default. Delegate to the
# repository's Bash bootstrap so pipefail and the existing project-model setup
# behave consistently in local and GitHub Actions runs.
bootstrap: bash scripts/quality/qodana-bootstrap.sh

exclude:
  - name: All
    paths:
      - "bin"
      - "obj"
      - "node_modules"
      - "dist"
      - ".angular"
      - ".tmp"
      - ".qodana"
      - "**/bin/**"
      - "**/obj/**"
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/.angular/**"
      - "**/coverage/**"
      - "**/TestResults/**"
      - "**/test-results/**"
      - "**/playwright-report/**"
      - "**/.playwright/**"
      - "**/.qodana/**"
      - "**/storybook-static/**"
      - "src/AipPortal.Application/bin"
      - "src/AipPortal.Application/obj"
      - "src/AipPortal.Domain/bin"
      - "src/AipPortal.Domain/obj"
      - "src/AipPortal.Infrastructure/bin"
      - "src/AipPortal.Infrastructure/obj"
      - "src/AipPortal.Web/bin"
      - "src/AipPortal.Web/obj"
      - "tests/AipPortal.Tests/bin"
      - "tests/AipPortal.Tests/obj"
      - "frontend/node_modules"
      - "frontend/dist"
      - "frontend/.angular"
      - "src/AipPortal.Web/wwwroot"
      - "src/AipPortal.Web/data"
      - "aipsite-frontend"
