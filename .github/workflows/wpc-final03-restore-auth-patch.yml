name: WPC-Final03 Restore Authorization Patch

on:
  push:
    branches:
      - wpc-final03-security-no-go
    paths:
      - .github/workflows/wpc-final03-restore-auth-patch.yml

permissions:
  contents: write

concurrency:
  group: wpc-final03-restore-auth-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: wpc-final03-security-no-go
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact restore authorization fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/AipPortal.Application/Projects/TaskCommandService.cs")
          text = path.read_text()
          old = '''        var allowed = requireOverride ? await taskAuthorization.CanOverrideTaskReview(actor, task.Id, cancellationToken) : requireReview ? await taskAuthorization.CanReviewTask(actor, task.Id, cancellationToken) : requireAssign ? await taskAuthorization.CanAssignTask(actor, task.Id, cancellationToken) : !mutate || await taskAuthorization.CanUpdateTask(actor, task.Id, cancellationToken);'''
          new = '''        // Restore is the only command that intentionally authorizes a soft-deleted
        // Task. Keep normal assignment/deletion authorization fail-closed for deleted
        // rows, while requiring both current operational contribution authority and
        // Project management authority before a deleted Task can be restored.
        var allowed = requireOverride
            ? await taskAuthorization.CanOverrideTaskReview(actor, task.Id, cancellationToken)
            : requireReview
                ? await taskAuthorization.CanReviewTask(actor, task.Id, cancellationToken)
                : requireAssign
                    ? includeDeleted
                        ? await projectAuthorization.CanContributeProject(actor, task.ProjectId, cancellationToken) &&
                          await projectAuthorization.CanManageProject(actor, task.ProjectId, cancellationToken)
                        : await taskAuthorization.CanAssignTask(actor, task.Id, cancellationToken)
                    : !mutate || await taskAuthorization.CanUpdateTask(actor, task.Id, cancellationToken);'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one authorization expression, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- src/AipPortal.Application/Projects/TaskCommandService.cs

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AipPortal.Application/Projects/TaskCommandService.cs
          git commit -m "Fix deleted Task restore authorization"
          git push origin HEAD:wpc-final03-security-no-go
