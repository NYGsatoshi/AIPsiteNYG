version: "1.0"

# Keep the profile on the documented recommended baseline. Do not enable every
# registered inspection group here; that makes Qodana inspect generated/build
# artifacts and produces noisy project-model cascades.
profile:
  name: qodana.recommended

# Runs inside the Qodana execution environment. The GitHub workflow also passes
# --solution AipPortal.slnx because that is the documented .NET solution
# selection mechanism for the Qodana CLI/action.
bootstrap: bash scripts/quality/qodana-bootstrap.sh

exclude:
  - name: All
    paths:
      - "bin"
      - "obj"
      - "node_modules"
      - "dist"
      - ".angular"
      - ".tmp"
      - ".qodana"
      - "**/bin/**"
      - "**/obj/**"
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/.angular/**"
      - "**/coverage/**"
      - "**/TestResults/**"
      - "**/test-results/**"
      - "**/playwright-report/**"
      - "**/.playwright/**"
      - "**/.qodana/**"
      - "**/storybook-static/**"
      - "src/AipPortal.Application/bin"
      - "src/AipPortal.Application/obj"
      - "src/AipPortal.Domain/bin"
      - "src/AipPortal.Domain/obj"
      - "src/AipPortal.Infrastructure/bin"
      - "src/AipPortal.Infrastructure/obj"
      - "src/AipPortal.Web/bin"
      - "src/AipPortal.Web/obj"
      - "tests/AipPortal.Tests/bin"
      - "tests/AipPortal.Tests/obj"
      - "frontend/node_modules"
      - "frontend/dist"
      - "frontend/.angular"
      - "src/AipPortal.Web/wwwroot"
      - "src/AipPortal.Web/data"
      - "aipsite-frontend"
