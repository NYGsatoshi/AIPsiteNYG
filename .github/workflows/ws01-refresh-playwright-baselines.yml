name: WS01 Refresh Playwright Baselines

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ws01-refresh-playwright-baselines
  cancel-in-progress: true

jobs:
  refresh:
    if: github.head_ref == 'workspace/v1-dashboard-projection' && github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, aipsite-ci, light]
    timeout-minutes: 30

    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: workspace/v1-dashboard-projection
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Create Playwright cache volumes
        shell: bash
        run: |
          docker volume create aipsite-playwright-npm-cache-node24-v1 >/dev/null
          docker volume create aipsite-playwright-angular-cache-node24-v1 >/dev/null

      - name: Refresh Linux screenshot baselines
        shell: bash
        run: npm run test:ui:angular:docker:update-snapshots

      - name: Verify only approved Workspace baselines changed
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          expected=(
            "tests/ui/__angular_snapshots__/linux/angular-smoke.spec.ts/desktop-shell-workspaces.png"
            "tests/ui/__angular_snapshots__/linux/angular-smoke.spec.ts/mobile-shell-workspaces-drawer.png"
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            echo "Unexpected files changed while refreshing screenshots." >&2
            exit 1
          fi

      - name: Commit refreshed baselines
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/ui/__angular_snapshots__/linux/angular-smoke.spec.ts/desktop-shell-workspaces.png \
            tests/ui/__angular_snapshots__/linux/angular-smoke.spec.ts/mobile-shell-workspaces-drawer.png
          git commit -m "test(ws01): refresh Workspace Playwright baselines"
          git push origin HEAD:workspace/v1-dashboard-projection

      - name: Repair workspace ownership
        if: always()
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"
