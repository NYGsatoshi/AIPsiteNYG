name: Issue336 EF Scaffold

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/issue336-ef-scaffold.yml"
  push:
    branches: ["feat/336-authoritative-folder-move"]
    paths:
      - ".github/workflows/issue336-ef-scaffold.yml"

permissions:
  contents: write

jobs:
  scaffold:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Scaffold folder migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=aipsite_issue336_scaffold;Username=postgres;Password=postgres"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/336-authoritative-folder-move
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore AipPortal.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Scaffold authoritative folder migration
        run: >-
          dotnet ef migrations add AddAuthoritativeFileFolders
          --project src/AipPortal.Infrastructure
          --startup-project src/AipPortal.Web
          --context AppDbContext
          --output-dir Persistence/Migrations

      - name: Commit generated EF artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AipPortal.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No migration artifacts were generated."
            exit 1
          fi
          git commit -m "feat(files): scaffold authoritative folder migration"
          git push origin HEAD:feat/336-authoritative-folder-move
