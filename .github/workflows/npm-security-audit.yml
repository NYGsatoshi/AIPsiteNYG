name: npm Security Audit

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Report Node toolchain
        run: |
          node --version
          npm --version

      - name: Verify npm supply-chain policy
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' lockfiles < <(
            find . -name package-lock.json \
              -not -path '*/node_modules/*' \
              -print0 | sort -z
          )

          if [ "${#lockfiles[@]}" -eq 0 ]; then
            echo "No package-lock.json files found." >&2
            exit 1
          fi

          for lockfile in "${lockfiles[@]}"; do
            package_dir="$(dirname "$lockfile")"
            node scripts/ci/verify-npm-lockfile.mjs "$package_dir"
          done

      - name: Audit npm dependency trees
        id: audit
        shell: bash
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_ALLOW_GIT: none
          NPM_CONFIG_ALLOW_REMOTE: none
        run: |
          set -uo pipefail
          report_dir="$GITHUB_WORKSPACE/artifacts/npm-audit"
          mkdir -p "$report_dir"

          mapfile -d '' lockfiles < <(
            find . -name package-lock.json \
              -not -path '*/node_modules/*' \
              -print0 | sort -z
          )

          audit_failed=0
          for lockfile in "${lockfiles[@]}"; do
            package_dir="$(dirname "$lockfile")"
            relative_dir="${package_dir#./}"
            if [ "$relative_dir" = "." ] || [ -z "$relative_dir" ]; then
              relative_dir="root"
            fi
            report_name="$(printf '%s' "$relative_dir" | tr '/ ' '__')"
            report_path="$report_dir/${report_name}.json"

            echo "::group::npm audit: $relative_dir"
            set +e
            npm --prefix "$package_dir" audit --package-lock-only --json > "$report_path"
            status=$?
            set -e

            node - "$relative_dir" "$report_path" <<'NODE'
          const fs = require('node:fs');
          const [scope, reportPath] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log(`scope=${scope}`);
          console.log(`counts=${JSON.stringify(counts)}`);

          for (const [name, entry] of Object.entries(report.vulnerabilities ?? {})) {
            const via = (entry.via ?? [])
              .map(item => typeof item === 'string' ? item : `${item.source ?? 'advisory'}:${item.title ?? item.url ?? 'unknown'}`)
              .join(', ');
            const fix = entry.fixAvailable === true
              ? 'available'
              : entry.fixAvailable === false
                ? 'unavailable'
                : JSON.stringify(entry.fixAvailable);
            console.log(`${entry.severity}\t${name}\trange=${entry.range}\tfix=${fix}\tvia=${via}`);
          }
          NODE

            if [ "$status" -ne 0 ]; then
              audit_failed=1
            fi
            echo "::endgroup::"
          done

          echo "vulnerabilities_found=$audit_failed" >> "$GITHUB_OUTPUT"

      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-reports
          path: artifacts/npm-audit/*.json
          if-no-files-found: warn

      - name: Report audit result
        if: steps.audit.outputs.vulnerabilities_found == '1'
        run: |
          echo "npm audit found vulnerable dependency trees."
          echo "This baseline workflow is report-only while remediation PRs are prepared."

  install-policy:
    name: npm install policy
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enforce root install policy
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Enforce frontend install policy
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Enforce legacy frontend install policy
        run: bash scripts/ci/npm-ci-retry.sh aipsite-frontend

  pr280-lockfile-artifact:
    name: PR 280 lockfile artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Regenerate legacy frontend lockfile
        working-directory: aipsite-frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Stage lockfiles for download
        run: |
          mkdir -p artifacts/pr280-lockfiles/frontend artifacts/pr280-lockfiles/aipsite-frontend
          cp frontend/package-lock.json artifacts/pr280-lockfiles/frontend/package-lock.json
          cp aipsite-frontend/package-lock.json artifacts/pr280-lockfiles/aipsite-frontend/package-lock.json

      - name: Upload regenerated lockfiles
        uses: actions/upload-artifact@v7
        with:
          name: pr280-lockfiles
          path: artifacts/pr280-lockfiles
          if-no-files-found: error
