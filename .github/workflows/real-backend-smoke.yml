name: Real Backend Browser Smoke

on:
  workflow_dispatch:

jobs:
  real-backend-browser-smoke:
    runs-on: self-hosted
    timeout-minutes: 35

    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch must test the commit selected by its ref, never
          # a residual self-hosted runner checkout.
          ref: ${{ github.sha }}
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install smoke runner dependencies
        run: npm ci

      - name: Run real-backend browser smoke
        env:
          SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
        shell: bash
        run: |
          test -n "${SYNCFUSION_LICENSE:-}" || {
            echo "SYNCFUSION_LICENSE is not configured." >&2
            exit 1
          }
          npm run test:ui:real-backend

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-backend-browser-smoke-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
