name: One-time verify image-size removal

on:
  push:
    branches:
      - fix/remove-image-size-transitive

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Run npm audits
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend audit --json > "$RUNNER_TEMP/frontend-audit.json" || true
          npm --prefix aipsite-frontend audit --json > "$RUNNER_TEMP/aipsite-frontend-audit.json" || true

      - name: Verify image-size findings are gone
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const reports = [
            ['frontend', path.join(process.env.RUNNER_TEMP, 'frontend-audit.json')],
            ['aipsite-frontend', path.join(process.env.RUNNER_TEMP, 'aipsite-frontend-audit.json')],
          ]
          for (const [name, file] of reports) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'))
            const vulnerabilities = report.vulnerabilities ?? {}
            if (vulnerabilities['image-size']) {
              throw new Error(`${name}: npm audit still reports image-size`)
            }
            const rows = Object.entries(vulnerabilities)
              .map(([pkg, value]) => ({
                package: pkg,
                severity: value.severity,
                via: (value.via ?? []).map(item => typeof item === 'string' ? `dependency:${item}` : `advisory:${item.source}`),
              }))
              .sort((a, b) => a.package.localeCompare(b.package))
            console.log(`${name} vulnerabilities:`)
            console.log(JSON.stringify(rows, null, 2))
          }
          NODE
