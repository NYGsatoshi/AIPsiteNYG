name: Patch PR 474 Angular smoke

on:
  push:
    branches:
      - feat/378-durable-publication

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/378-durable-publication
          fetch-depth: 0
          persist-credentials: true

      - name: Align Announcement smoke with durable draft workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('tests/ui/angular-smoke.spec.ts')
          text = path.read_text(encoding='utf-8')

          old_preview = """        (pathname === '/api/announcements' || pathname.endsWith('/read'))"""
          new_preview = """        (pathname === '/api/announcements' ||
                  pathname.startsWith('/api/announcement-drafts') ||
                  pathname.endsWith('/read'))"""
          if text.count(old_preview) != 1:
              raise RuntimeError(f'Expected one preview side-effect predicate, found {text.count(old_preview)}')
          text = text.replace(old_preview, new_preview, 1)

          old_wait_path = "new URL(response.url()).pathname === '/api/announcements'"
          if text.count(old_wait_path) != 3:
              raise RuntimeError(f'Expected three legacy publish waits, found {text.count(old_wait_path)}')
          text = text.replace(
              old_wait_path,
              "new URL(response.url()).pathname.endsWith('/publish')",
          )

          old_success = """    await expect(page.getByText('お知らせを公開しました。')).toBeVisible();"""
          new_success = """    await expect(page.getByText(/Publication queued/)).toBeVisible();"""
          if text.count(old_success) != 1:
              raise RuntimeError(f'Expected one legacy success assertion, found {text.count(old_success)}')
          text = text.replace(old_success, new_success, 1)

          old_auth_status = """    expect((await failedResponse).status()).toBe(400);
              await api.audienceRefreshRequested;"""
          new_auth_status = """    expect((await failedResponse).status()).toBe(403);
              await api.audienceRefreshRequested;"""
          if text.count(old_auth_status) != 1:
              raise RuntimeError(f'Expected one legacy audience status assertion, found {text.count(old_auth_status)}')
          text = text.replace(old_auth_status, new_auth_status, 1)

          start_marker = 'async function installAnnouncementEditorApi(\n'
          end_marker = 'async function installCanonicalProjectCreateActivationApi(\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = """async function installAnnouncementEditorApi(
            page: Page,
            options: AnnouncementEditorApiOptions = {}
          ): Promise<AnnouncementEditorApiHarness> {
            const workspaceId = '38000000-0000-4000-8000-000000000001';
            const draftId = '38000000-0000-4000-8000-000000000003';
            const publishRequests: Record<string, unknown>[] = [];
            let persistedDraft = {
              title: '',
              body: '',
              priority: 0,
              requiresReadConfirmation: false
            };
            let audienceRequestCount = 0;
            let releaseAudienceRefresh!: () => void;
            let notifyAudienceRefreshRequested!: () => void;
            const audienceRefreshGate = new Promise<void>((resolve) => {
              releaseAudienceRefresh = resolve;
            });
            const audienceRefreshRequested = new Promise<void>((resolve) => {
              notifyAudienceRefreshRequested = resolve;
            });

            const draftResponse = (status: 'Draft' | 'Scheduled', version: number) => ({
              id: draftId,
              version,
              status,
              workspaceId,
              groupId: null,
              channelId: null,
              title: persistedDraft.title,
              body: persistedDraft.body,
              priority: persistedDraft.priority === 2
                ? 'Critical'
                : persistedDraft.priority === 1
                  ? 'Important'
                  : 'Normal',
              isPinned: false,
              requiresReadConfirmation: persistedDraft.requiresReadConfirmation,
              ...(status === 'Scheduled'
                ? {
                    scheduledForUtc: '2026-08-24T10:00:00Z',
                    scheduleTimeZoneId: 'UTC',
                    scheduleLocalDateTime: '2026-08-24T10:00:00'
                  }
                : {})
            });

            await page.route('**/api/announcements', async (route) => {
              const request = route.request();
              if (request.method() === 'GET') {
                await route.fulfill({
                  status: 200,
                  contentType: 'application/json; charset=utf-8',
                  body: JSON.stringify({ items: [] })
                });
                return;
              }

              await route.fulfill({ status: 405 });
            });

            await page.route('**/api/announcement-drafts**', async (route) => {
              const request = route.request();
              const pathname = new URL(request.url()).pathname;

              if (pathname === '/api/announcement-drafts' && request.method() === 'POST') {
                const payload = request.postDataJSON() as { content?: Record<string, unknown> };
                const content = payload.content ?? {};
                persistedDraft = {
                  title: typeof content['title'] === 'string' ? content['title'] : '',
                  body: typeof content['body'] === 'string' ? content['body'] : '',
                  priority: typeof content['priority'] === 'number' ? content['priority'] : 0,
                  requiresReadConfirmation: content['requiresReadConfirmation'] === true
                };
                await route.fulfill({
                  status: 201,
                  contentType: 'application/json; charset=utf-8',
                  body: JSON.stringify(draftResponse('Draft', 1))
                });
                return;
              }

              if (
                pathname === `/api/announcement-drafts/${draftId}/publish` &&
                request.method() === 'POST'
              ) {
                publishRequests.push(request.postDataJSON() as Record<string, unknown>);
                if (publishRequests.length === 1) {
                  const audienceDenied = options.firstPublishFailure === 'audienceAuthorization';
                  await route.fulfill({
                    status: audienceDenied ? 403 : 503,
                    contentType: 'application/json; charset=utf-8',
                    body: JSON.stringify({
                      error: {
                        code: audienceDenied
                          ? 'ANNOUNCEMENT_DRAFT_AUDIENCE_DENIED'
                          : 'ANNOUNCEMENT_DRAFT_UNAVAILABLE',
                        message: audienceDenied
                          ? 'Announcement audience is not authorized.'
                          : 'internal upstream detail'
                      }
                    })
                  });
                  return;
                }

                await route.fulfill({
                  status: 200,
                  contentType: 'application/json; charset=utf-8',
                  body: JSON.stringify(draftResponse('Scheduled', 2))
                });
                return;
              }

              await route.fulfill({ status: 405 });
            });

            await page.route('**/api/announcements/audiences', async (route) => {
              audienceRequestCount += 1;
              if (audienceRequestCount > 1 && options.holdAudienceRefresh) {
                notifyAudienceRefreshRequested();
                await audienceRefreshGate;
                await route.fulfill({
                  status: 200,
                  contentType: 'application/json; charset=utf-8',
                  body: JSON.stringify([])
                });
                return;
              }

              await route.fulfill({
                status: 200,
                contentType: 'application/json; charset=utf-8',
                body: JSON.stringify([
                  {
                    key: 'workspace:' + workspaceId,
                    scopeType: 'workspace',
                    workspaceId,
                    groupId: null,
                    channelId: null,
                    displayName: 'Announcement evidence workspace',
                    estimatedRecipientCount: 24
                  }
                ])
              });
            });

            return {
              publishRequests,
              audienceRefreshRequested,
              releaseAudienceRefresh
            };
          }

          """

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git config user.name "OpenAI CI Automation"
          git config user.email "ci-automation@users.noreply.github.com"
          git add tests/ui/angular-smoke.spec.ts
          git rm .github/workflows/patch-pr474-angular-smoke.yml
          git commit -m "test(announcements): align smoke with durable publication"
          git push origin HEAD:feat/378-durable-publication
