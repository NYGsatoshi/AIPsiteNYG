<section class="announcement-list" aria-label="お知らせ一覧">
  <h2 #listHeading tabindex="-1" class="announcement-list__heading" data-testid="announcement-list-heading">
    お知らせ一覧
  </h2>
  @for (announcement of announcements; track announcement.id) {
    <button
      #announcementAction
      class="announcement-list__item"
      [class.announcement-list__item--selected]="announcement.id === selectedAnnouncementId"
      type="button"
      [attr.data-announcement-id]="announcement.id"
      (click)="announcementSelected.emit(announcement.id)"
      data-testid="announcement-list-item"
    >
      <span class="announcement-list__title" data-testid="announcement-list-title">{{ announcement.title }}</span>
      <span class="announcement-list__meta">
        <app-announcement-priority-badge [priority]="announcement.priority" />
        @if (announcement.publicationState === 'published' || announcement.publicationState === 'updated') {
          <span data-testid="announcement-list-published-at">{{ announcement.publishedAtLabel }}</span>
        }
        <app-announcement-audience-preview [audienceScope]="announcement.audienceScope" />
        <app-announcement-publication-status
          [state]="announcement.publicationState"
          [scheduledAtLabel]="announcement.scheduledAtLabel"
          [timeZoneLabel]="announcement.timeZoneLabel"
        />
      </span>
      <app-announcement-read-state [readState]="announcement.readState" />
    </button>
  }
</section>
