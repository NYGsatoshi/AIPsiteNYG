name: PR214 Update Angular Snapshots

on:
  push:
    branches:
      - frontend/v0.4-pr01-design-system-foundation

permissions:
  contents: write

jobs:
  update-snapshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: frontend/v0.4-pr01-design-system-foundation
          fetch-depth: 0

      - name: Generate Linux Playwright baselines
        run: npm run test:ui:angular:docker:update-snapshots

      - name: Commit generated baselines
        shell: bash
        run: |
          git add tests/ui/__angular_snapshots__/angular-smoke.spec.ts/*.png
          if git diff --cached --quiet; then
            echo "Snapshot baselines are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(ui): update v0.4 screenshot baselines"
          git push origin HEAD:frontend/v0.4-pr01-design-system-foundation
