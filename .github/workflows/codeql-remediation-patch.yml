name: CodeQL remediation patch

on:
  push:
    branches:
      - security/codeql-non-angular-remediation
    paths:
      - .github/workflows/codeql-remediation-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v7
        with:
          ref: security/codeql-non-angular-remediation
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Apply bounded CodeQL remediations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one patch target, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/AipPortal.Web/Middleware/CsrfProtectionMiddleware.cs',
              '            logger.LogWarning(ex, "Rejected unsafe request without a valid CSRF token: {Method} {Path}", context.Request.Method, context.Request.Path);',
              '''            var safeMethod = context.Request.Method
                  .Replace("\\r", string.Empty, StringComparison.Ordinal)
                  .Replace("\\n", string.Empty, StringComparison.Ordinal);
              var safePath = (context.Request.Path.Value ?? string.Empty)
                  .Replace("\\r", string.Empty, StringComparison.Ordinal)
                  .Replace("\\n", string.Empty, StringComparison.Ordinal);
              logger.LogWarning(
                  ex,
                  "Rejected unsafe request without a valid CSRF token: {Method} {Path}",
                  safeMethod,
                  safePath);''')

          replace_once(
              'src/AipPortal.Infrastructure/Persistence/FileFolderService.cs',
              '''    {
              if (request.ExpectedVersion < 0 || request.ExpectedDestinationVersion < 0)
              {
                  return Result<FileLocationResponse>.Failure("Invalid file move version.");
              }

              var authorized = await ResolveAuthorizedWorkspaceFileAsync(fileObjectId, requireContribution: true, cancellationToken);
              if (authorized is null)
              {
                  return Result<FileLocationResponse>.Failure("File not found.");
              }

              var workspaceId = authorized.Value.WorkspaceId;''',
              '''    {
              var authorized = await ResolveAuthorizedWorkspaceFileAsync(fileObjectId, requireContribution: true, cancellationToken);
              if (authorized is null)
              {
                  return Result<FileLocationResponse>.Failure("File not found.");
              }

              if (request.ExpectedVersion < 0 || request.ExpectedDestinationVersion < 0)
              {
                  return Result<FileLocationResponse>.Failure("Invalid file move version.");
              }

              var workspaceId = authorized.Value.WorkspaceId;''')

          replace_once(
              'src/AipPortal.Infrastructure/Persistence/DbArtifactReportRefinementService.cs',
              '''        if (request.ConfirmedProjectScopeVersion <= 0 ||
              (request.ConfirmedResearchPlanRevisionId.HasValue != request.ConfirmedResearchPlanRevisionNo.HasValue))
              return Validation<ArtifactReportRefinementResponse>();

          var context = await LoadContextAsync(projectId, baseArtifactVersionId, userId, cancellationToken);''',
              '''        var context = await LoadContextAsync(projectId, baseArtifactVersionId, userId, cancellationToken);''')

          replace_once(
              'src/AipPortal.Infrastructure/Persistence/DbArtifactReportRefinementService.cs',
              '''        var snapshot = await ReadScopeSnapshotAsync(context.Task.Id, cancellationToken);
          if (snapshot is null)
              return Failure<ArtifactReportRefinementResponse>("ReportRefinementUnavailable", "The report refinement scope is unavailable.");
          if (!MatchesConfirmation(snapshot, request))''',
              '''        var snapshot = await ReadScopeSnapshotAsync(context.Task.Id, cancellationToken);
          if (snapshot is null)
              return Failure<ArtifactReportRefinementResponse>("ReportRefinementUnavailable", "The report refinement scope is unavailable.");
          if (request.ConfirmedProjectScopeVersion <= 0 ||
              (request.ConfirmedResearchPlanRevisionId.HasValue != request.ConfirmedResearchPlanRevisionNo.HasValue))
              return Validation<ArtifactReportRefinementResponse>();
          if (!MatchesConfirmation(snapshot, request))''')

          replace_once(
              'src/AipPortal.Application/Files/IFileFolderService.cs',
              '''public sealed record FileMoveRequest(
              Guid? DestinationFolderId,
              long ExpectedVersion,
              long ExpectedDestinationVersion);''',
              '''public sealed record FileMoveRequest(
              Guid? DestinationFolderId,
              [property: System.ComponentModel.DataAnnotations.Range(typeof(long), "0", "9223372036854775807")] long ExpectedVersion,
              [property: System.ComponentModel.DataAnnotations.Range(typeof(long), "0", "9223372036854775807")] long ExpectedDestinationVersion);''')

          replace_once(
              'src/AipPortal.Application/Artifacts/ArtifactReportRefinementDtos.cs',
              '''    string? Feedback,
              long ConfirmedProjectScopeVersion,
              long? ConfirmedTaskOverrideVersion,''',
              '''    string? Feedback,
              [property: System.ComponentModel.DataAnnotations.Range(typeof(long), "1", "9223372036854775807")] long ConfirmedProjectScopeVersion,
              long? ConfirmedTaskOverrideVersion,''')

          replace_once(
              'src/AipPortal.Application/Projects/TaskCommandDtos.cs',
              'public sealed record TaskWatchRequest(long ExpectedVersion);',
              'public sealed record TaskWatchRequest([property: System.ComponentModel.DataAnnotations.Range(typeof(long), "0", "9223372036854775807")] long ExpectedVersion);')

          replace_once(
              'src/AipPortal.Application/TenantExports/TenantExportDtos.cs',
              'public sealed record TenantExportRequest(Guid? TenantId = null, TenantExportType ExportType = TenantExportType.Metadata);',
              'public sealed record TenantExportRequest(Guid? TenantId = null, [property: System.ComponentModel.DataAnnotations.AllowedValues(TenantExportType.Metadata)] TenantExportType ExportType = TenantExportType.Metadata);')

          replace_once(
              'frontend/scripts/sanitize-syncfusion-theme-css.node-test.mjs',
              '''  assert.equal(sanitized.includes('fonts.googleapis.com'), false);
          assert.equal(sanitized.includes('@import "./local-overrides.css";'), true);
          assert.equal(sanitized.includes('font-family: Roboto, sans-serif'), true);''',
              '''  assert.equal(
              sanitized,
              ['@import "./local-overrides.css";', '.e-control { font-family: Roboto, sans-serif; }'].join('\\n')
            );''')
          PY

      - name: Validate lightweight security regressions
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/ci/required_check_parent.py \
            scripts/ci/verify-mvp-a-final-checks.py
          node --test frontend/scripts/sanitize-syncfusion-theme-css.node-test.mjs
          git diff --check

      - name: Restore and build
        shell: bash
        run: |
          dotnet restore AipPortal.slnx --disable-parallel --disable-build-servers --verbosity minimal
          dotnet build AipPortal.slnx --configuration Release --no-restore --disable-build-servers -m:1

      - name: Commit remediation and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/codeql-remediation-patch.yml
          git diff --check
          git config user.name "Hirota Satoshi"
          git config user.email "202610880@edu.nishiyamato.ed.jp"
          git add \
            src/AipPortal.Web/Middleware/CsrfProtectionMiddleware.cs \
            src/AipPortal.Infrastructure/Persistence/FileFolderService.cs \
            src/AipPortal.Infrastructure/Persistence/DbArtifactReportRefinementService.cs \
            src/AipPortal.Application/Files/IFileFolderService.cs \
            src/AipPortal.Application/Artifacts/ArtifactReportRefinementDtos.cs \
            src/AipPortal.Application/Projects/TaskCommandDtos.cs \
            src/AipPortal.Application/TenantExports/TenantExportDtos.cs \
            frontend/scripts/sanitize-syncfusion-theme-css.node-test.mjs \
            .github/workflows/codeql-remediation-patch.yml
          git commit -m "fix(security): harden CodeQL input and logging boundaries"
          git push origin HEAD:security/codeql-non-angular-remediation
