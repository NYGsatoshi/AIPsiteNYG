name: Real Backend My Tasks Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/real-backend-my-tasks.yml"
      - "Dockerfile"
      - "Dockerfile.playwright"
      - "docker-compose.real-backend-smoke.yml"
      - "package.json"
      - "package-lock.json"
      - "global.json"
      - "scripts/ci/build-playwright-grep.mjs"
      - "scripts/ci/verify-playwright-required-tests.mjs"
      - "scripts/ci/real-backend-my-tasks-required-tests.txt"
      - "tests/ui/real-backend-smoke.spec.ts"
      - "tests/ui/run-real-backend-my-tasks.mjs"
      - "tests/ui/run-real-backend-smoke-compose.mjs"
      - "tests/ui/run-real-backend-playwright.mjs"
      - "tests/ui/real-backend-smoke-compose-helpers.mjs"
      - "src/AipPortal.Application/Planning/**"
      - "src/AipPortal.Application/Common/Interfaces/IPlanningRepository.cs"
      - "src/AipPortal.Application/Common/Interfaces/IOrganizationRepositories.cs"
      - "src/AipPortal.Application/Workspaces/**"
      - "src/AipPortal.Application/Realtime/**"
      - "src/AipPortal.Infrastructure/Persistence/PlanningRepository.cs"
      - "src/AipPortal.Infrastructure/Persistence/ProjectReadScope.cs"
      - "src/AipPortal.Infrastructure/Persistence/OrganizationRepositories.cs"
      - "src/AipPortal.Infrastructure/Persistence/CurrentAuthorizationTargetResolver.cs"
      - "src/AipPortal.Infrastructure/Persistence/AppDbContextSeed.cs"
      - "src/AipPortal.Web/Controllers/PlanningController.cs"
      - "src/AipPortal.Web/Controllers/WorkspacesController.cs"
      - "src/AipPortal.Web/Realtime/**"
      - "frontend/src/app/features/projects/my-tasks.facade.ts"
      - "frontend/src/app/features/projects/my-tasks.facade.spec.ts"
      - "frontend/src/app/features/projects/my-tasks-page/**"
      - "frontend/src/app/features/projects/projects.api.ts"
      - "frontend/src/app/core/realtime/**"

permissions:
  contents: read

jobs:
  real-backend-my-tasks-acceptance:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - codebuild-NYGsatoshi-${{ github.run_id }}-${{ github.run_attempt }}
      - real-backend-my-tasks-acceptance
    timeout-minutes: 45
    concurrency:
      group: real-backend-my-tasks-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install smoke runner dependencies
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Run required My Tasks real-backend acceptance
        env:
          SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
        shell: bash
        run: |
          test -n "${SYNCFUSION_LICENSE:-}" || {
            echo "SYNCFUSION_LICENSE is not configured." >&2
            exit 1
          }
          node tests/ui/run-real-backend-my-tasks.mjs

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-backend-my-tasks-acceptance-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Report runner resources on failure
        if: failure()
        shell: bash
        run: |
          df -h || true
          df -i || true
          free -h || true
          docker system df || true
