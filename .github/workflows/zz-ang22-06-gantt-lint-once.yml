name: ANG22-06 Gantt lint normalization (one-shot)

on:
  push:
    branches:
      - chore/ang22-06-third-party-compatibility
    paths:
      - .github/workflows/zz-ang22-06-gantt-lint-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout compatibility branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize Gantt vendor error assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/ui/angular-smoke.spec.ts')
          text = path.read_text(encoding='utf-8')
          before = "await expect(page.getByTestId('aip-gantt-vendor-error')).toHaveCount(0);"
          after = "await expect(page.getByTestId('aip-gantt-vendor-error')).not.toBeVisible();"
          count = text.count(before)
          if count != 1:
              raise SystemExit(f'Expected one ANG22-06 Gantt assertion, found {count}.')
          path.write_text(text.replace(before, after, 1), encoding='utf-8')
          PY

          git diff --check

      - name: Commit lint-clean browser compatibility evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/ui/angular-smoke.spec.ts
          git commit -m 'test(angular): keep Gantt vendor assertion lint-clean'
          git push origin HEAD:chore/ang22-06-third-party-compatibility
