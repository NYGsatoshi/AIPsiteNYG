jobs:
  - job: SecurityScan
    displayName: Secret and container security
    dependsOn: DetectChanges
    condition: and(succeeded(), eq(dependencies.DetectChanges.outputs['changes.primary'], 'true'))
    timeoutInMinutes: 60
    variables:
      IMAGE_NAME: 'aipsite-nyg-ci:$(Build.SourceVersion)-$(Build.BuildId)'
      DOCKER_BUILDKIT: '1'
      BUILDKIT_PROGRESS: plain
      runContainerSecurity: $[ dependencies.DetectChanges.outputs['changes.containerSecurity'] ]
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: false

      - bash: |
          set -euo pipefail
          mkdir -p artifacts/security
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect --no-git --source /repo --redact --verbose \
            --report-format json --report-path /repo/artifacts/security/gitleaks-report.json
          status=$?
          set -e
          test -f artifacts/security/gitleaks-report.json || printf '[]\n' > artifacts/security/gitleaks-report.json
          cat artifacts/security/gitleaks-report.json
          exit "$status"
        displayName: Gitleaks secret scan

      - bash: |
          set -euo pipefail
          export POSTGRES_DB=aip_portal
          export POSTGRES_USER=aip_portal
          export POSTGRES_PASSWORD=ci_dummy_password
          export DB_PASSWORD=ci_dummy_password
          export LOCAL_ADMIN_PASSWORD=ci_dummy_local_admin_password
          docker compose -f docker-compose.db.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.playwright.yml config --quiet
          docker compose -p aipsite-real-backend-smoke-ci-config -f docker-compose.real-backend-smoke.yml config --quiet
          docker compose config --quiet
          docker compose -f docker-compose.local.yml config --quiet
          docker compose -f docker-compose.onprem.yml config --quiet
          docker compose -p deploy -f deploy/sakura/docker-compose.yml config --quiet
        displayName: Validate Docker Compose configs
        condition: and(succeededOrFailed(), eq(variables['runContainerSecurity'], 'true'))

      - bash: |
          set -euo pipefail
          test -n "${SYNCFUSION_LICENSE:-}" || {
            echo "SYNCFUSION_LICENSE must be configured as a secret Azure Pipeline variable." >&2
            exit 1
          }
          license_file="$(mktemp)"
          trap 'rm -f "$license_file"' EXIT
          chmod 600 "$license_file"
          printf '%s' "$SYNCFUSION_LICENSE" > "$license_file"
          for attempt in 1 2; do
            set +e
            docker build --pull --progress=plain \
              --secret id=syncfusion_license,src="$license_file" \
              --tag "$IMAGE_NAME" .
            status=$?
            set -e
            [ "$status" -eq 0 ] && exit 0
            [ "$attempt" -eq 2 ] && exit "$status"
            docker system df || true
            sleep 15
          done
        displayName: Build production Docker image
        condition: and(succeededOrFailed(), eq(variables['runContainerSecurity'], 'true'))
        env:
          SYNCFUSION_LICENSE: $(SYNCFUSION_LICENSE)

      - bash: |
          set -euo pipefail
          docker image inspect "$IMAGE_NAME" >/dev/null
          docker run --rm --entrypoint sh "$IMAGE_NAME" -c '
            test ! -e /run/secrets &&
            test ! -e /app/.env &&
            ! env | grep -q "^SYNCFUSION_LICENSE=" &&
            ! find /app -type f \( -name ".env" -o -name ".env.*" -o -name "syncfusion-license.txt" \) -print -quit | grep -q .
          '
        displayName: Verify runtime image excludes license material
        condition: and(succeededOrFailed(), eq(variables['runContainerSecurity'], 'true'))

      - bash: |
          set -euo pipefail
          mkdir -p artifacts/security
          docker image inspect "$IMAGE_NAME" >/dev/null
          set +e
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/repo" \
            aquasec/trivy:0.65.0 \
            image --scanners vuln --vuln-type os,library \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table --output /repo/artifacts/security/trivy-image-report.txt \
            "$IMAGE_NAME"
          status=$?
          set -e
          test -f artifacts/security/trivy-image-report.txt && cat artifacts/security/trivy-image-report.txt
          exit "$status"
        displayName: Trivy image scan
        condition: and(succeededOrFailed(), eq(variables['runContainerSecurity'], 'true'))

      - task: PublishPipelineArtifact@1
        displayName: Publish security reports
        condition: always()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/artifacts/security'
          artifact: security-ci-artifacts
          publishLocation: pipeline

      - bash: docker image rm --force "$IMAGE_NAME" || true
        displayName: Remove per-run Docker image
        condition: always()

  - job: NpmSecurity
    displayName: npm supply-chain audit
    dependsOn: DetectChanges
    condition: and(succeeded(), eq(dependencies.DetectChanges.outputs['changes.npmSecurity'], 'true'))
    timeoutInMinutes: 35
    variables:
      NPM_CONFIG_CACHE: $(Pipeline.Workspace)/.npm
      runLegacyInstall: $[ dependencies.DetectChanges.outputs['changes.npmLegacy'] ]
    steps:
      - checkout: self
        persistCredentials: false
      - task: NodeTool@0
        displayName: Install Node.js 24
        inputs:
          versionSpec: '24.x'
      - task: Cache@2
        displayName: Restore npm download cache
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json | frontend/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(NPM_CONFIG_CACHE)

      - bash: |
          set -euo pipefail
          mkdir -p artifacts/npm-audit
          mapfile -d '' lockfiles < <(find . -name package-lock.json -not -path '*/node_modules/*' -print0 | sort -z)
          [ "${#lockfiles[@]}" -gt 0 ] || { echo "No package-lock.json files found." >&2; exit 1; }
          for lockfile in "${lockfiles[@]}"; do
            node scripts/ci/verify-npm-lockfile.mjs "$(dirname "$lockfile")"
          done
        displayName: Verify npm supply-chain policy

      - bash: |
          set -uo pipefail
          report_dir="$BUILD_SOURCESDIRECTORY/artifacts/npm-audit"
          mkdir -p "$report_dir"
          mapfile -d '' lockfiles < <(find . -name package-lock.json -not -path '*/node_modules/*' -print0 | sort -z)
          for lockfile in "${lockfiles[@]}"; do
            package_dir="$(dirname "$lockfile")"
            relative_dir="${package_dir#./}"
            if [ "$relative_dir" = "." ] || [ -z "$relative_dir" ]; then
              relative_dir="root"
            fi
            report_name="$(printf '%s' "$relative_dir" | tr '/ ' '__')"
            report_path="$report_dir/${report_name}.json"
            set +e
            npm --prefix "$package_dir" audit --package-lock-only --json > "$report_path"
            set -e
            node - "$relative_dir" "$report_path" <<'NODE'
          const fs = require('node:fs');
          const [scope, reportPath] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          console.log(`scope=${scope}`);
          console.log(`counts=${JSON.stringify(report.metadata?.vulnerabilities ?? {})}`);
          for (const [name, entry] of Object.entries(report.vulnerabilities ?? {})) {
            const via = (entry.via ?? []).map(item => typeof item === 'string' ? item : `${item.source ?? 'advisory'}:${item.title ?? item.url ?? 'unknown'}`).join(', ');
            const fix = entry.fixAvailable === true ? 'available' : entry.fixAvailable === false ? 'unavailable' : JSON.stringify(entry.fixAvailable);
            console.log(`${entry.severity}\t${name}\trange=${entry.range}\tfix=${fix}\tvia=${via}`);
          }
          NODE
          done
        displayName: Audit npm dependency trees
        condition: succeededOrFailed()
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_ALLOW_GIT: none
          NPM_CONFIG_ALLOW_REMOTE: none

      - bash: node scripts/ci/check-npm-audit-baseline.mjs artifacts/npm-audit scripts/ci/npm-audit-baseline.json
        displayName: Enforce npm High/Critical baseline
        condition: succeededOrFailed()

      - bash: bash scripts/ci/npm-ci-retry.sh aipsite-frontend
        displayName: Enforce legacy frontend install policy
        condition: and(succeededOrFailed(), eq(variables['runLegacyInstall'], 'true'))

      - task: PublishPipelineArtifact@1
        displayName: Publish npm audit reports
        condition: always()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/artifacts/npm-audit'
          artifact: npm-audit-reports
          publishLocation: pipeline

  - job: QodanaInventory
    displayName: Qodana Community .NET inventory
    dependsOn: DetectChanges
    condition: and(succeeded(), eq(dependencies.DetectChanges.outputs['changes.qodana'], 'true'))
    timeoutInMinutes: 60
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: false
      - bash: |
          set -euo pipefail
          mkdir -p artifacts/qodana
          set +e
          docker run --rm \
            -v "$PWD:/data/project" \
            -v "$PWD/artifacts/qodana:/data/results" \
            -e QODANA_FRONTEND_REQUIRED=false \
            -e QODANA_SKIP_FRONTEND_BOOTSTRAP=true \
            jetbrains/qodana-cdnet:2026.1-eap-privileged \
            --solution AipPortal.slnx \
            --configuration Release
          status=$?
          set -e
          echo "$status" > artifacts/qodana/exit-code.txt
          exit "$status"
        displayName: Run Qodana Community .NET inventory
        continueOnError: true
      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/artifacts/qodana'
          artifact: qodana-inventory
          publishLocation: pipeline
        displayName: Publish Qodana inventory
