name: External PR approval evaluator

on:
  workflow_run:
    workflows: ["External PR review signal"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-evaluate
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: external-pr-approval-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: External PR approval evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate authoritative PR review state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PR_NUMBER: ${{ inputs.pr_number || '' }}
        run: |
          set -euo pipefail

          # This workflow is trusted default-branch code. Resolve governance values
          # from the canonical default-branch policy, never from an untrusted PR head.
          default_branch="$(gh api "repos/$REPOSITORY" --jq '.default_branch')"
          policy_json="$(
            gh api \
              --method GET \
              -H 'Accept: application/vnd.github.raw+json' \
              "repos/$REPOSITORY/contents/governance/policy.json" \
              -f "ref=$default_branch"
          )"

          status_selector='[
            .controls[]
            | select(.id == "GOV-CHECKS-001" and .family == "required-status-checks")
            | .expected.required[]
            | select(
                .kind == "commit-status"
                and .workflow == ".github/workflows/external-pr-approval-evaluator.yml"
                and .job == "evaluate"
              )
          ]'
          status_count="$(jq -r "$status_selector | length" <<<"$policy_json")"
          if [[ "$status_count" != "1" ]]; then
            echo "Governance policy must define exactly one commit-status for this evaluator; found $status_count." >&2
            exit 1
          fi
          status_context="$(jq -r "$status_selector | .[0].context" <<<"$policy_json")"
          if [[ -z "$status_context" || "$status_context" == "null" ]]; then
            echo "Governance policy returned an empty status context." >&2
            exit 1
          fi

          reviewer_selector='[
            .controls[]
            | select(.id == "GOV-REVIEW-001" and .family == "pr-review-codeowners")
            | .expected.external_pr_approval_reviewer
          ]'
          reviewer_count="$(jq -r "$reviewer_selector | length" <<<"$policy_json")"
          if [[ "$reviewer_count" != "1" ]]; then
            echo "Governance policy must define exactly one external PR approval reviewer; found $reviewer_count." >&2
            exit 1
          fi
          reviewer="$(jq -r "$reviewer_selector | .[0]" <<<"$policy_json")"
          if [[ ! "$reviewer" =~ ^@[A-Za-z0-9-]+$ ]]; then
            echo "Governance policy external reviewer is invalid: $reviewer" >&2
            exit 1
          fi
          owner_login="${reviewer#@}"

          pr_number=""
          case "$EVENT_NAME" in
            workflow_run)
              pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
              if [[ -z "$pr_number" ]]; then
                signal_sha="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
                if [[ -n "$signal_sha" ]]; then
                  pr_number="$(
                    gh api "repos/$REPOSITORY/commits/$signal_sha/pulls?per_page=100" \
                      --jq '.[0].number // empty'
                  )"
                fi
              fi
              ;;
            workflow_dispatch)
              pr_number="$MANUAL_PR_NUMBER"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          if [[ -z "$pr_number" ]]; then
            echo "No pull request could be resolved from this event; nothing to evaluate."
            exit 0
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          pr_state="$(jq -r '.state' <<<"$pr_json")"
          if [[ "$pr_state" != "open" ]]; then
            echo "PR #$pr_number is not open; nothing to evaluate."
            exit 0
          fi

          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          status_state="failure"
          description="External PR requires current-head approval by $owner_login."

          if [[ "$author" == "$owner_login" ]]; then
            status_state="success"
            description="Owner-authored PR; additional external-author approval is not required."
          else
            reviews_file="$RUNNER_TEMP/pr-reviews.json"
            gh api --paginate --slurp \
              "repos/$REPOSITORY/pulls/$pr_number/reviews?per_page=100" \
              > "$reviews_file"

            latest_state="$(
              jq -r \
                --arg reviewer "$owner_login" \
                --arg head "$head_sha" '
                  [
                    flatten[]
                    | select(
                        .user.login == $reviewer
                        and .commit_id == $head
                        and (
                          .state == "APPROVED"
                          or .state == "CHANGES_REQUESTED"
                          or .state == "DISMISSED"
                        )
                      )
                  ]
                  | sort_by(.submitted_at // "")
                  | last
                  | .state // "NONE"
                ' "$reviews_file"
            )"

            if [[ "$latest_state" == "APPROVED" ]]; then
              status_state="success"
              description="Current head approved by $owner_login."
            else
              description="External PR needs current-head approval by $owner_login (state: $latest_state)."
            fi
          fi

          gh api \
            --method POST \
            "repos/$REPOSITORY/statuses/$head_sha" \
            -f state="$status_state" \
            -f context="$status_context" \
            -f description="$description" \
            -f target_url="$target_url" \
            >/dev/null

          echo "PR #$pr_number author=$author head=$head_sha context=$status_context result=$status_state"
