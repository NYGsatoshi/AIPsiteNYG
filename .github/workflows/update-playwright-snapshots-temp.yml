name: Temporary Playwright snapshot refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/update-playwright-snapshots-temp.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/playwright-messages-snapshots'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout snapshot branch
        uses: actions/checkout@v4
        with:
          ref: fix/playwright-messages-snapshots
          fetch-depth: 0

      - name: Download verified Playwright artifact copy
        run: |
          set -euo pipefail
          curl --fail --location \
            --output /tmp/playwright-artifact.zip \
            'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-2a54-7206-8e7e-d5963f69bdd7/raw?se=2026-07-10T05:20:15Z&sp=r&sv=2026-02-06&sr=b&scid=67978d88-ecdc-5029-a16e-9fd4ae212f5f&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-10T03:17:43Z&ske=2026-07-12T03:17:43Z&sks=b&skv=2026-02-06&sig=1lN668TZG9Nw7uXgwv2HZGLQNm5D0sP8yOxp0ohBKcg%3D'
          mkdir -p /tmp/playwright-artifact
          unzip -q /tmp/playwright-artifact.zip -d /tmp/playwright-artifact

      - name: Install checksum-verified screenshots as baselines
        run: |
          set -euo pipefail
          desktop_source="/tmp/playwright-artifact/test-results/angular-smoke-MVP-A-P0-Ang-4dbb7-lar-P0-screenshot-baselines-chromium-desktop/desktop-shell-workspaces-actual.png"
          mobile_source="/tmp/playwright-artifact/test-results/angular-smoke-MVP-A-P0-Ang-4dbb7-lar-P0-screenshot-baselines-chromium-mobile/mobile-shell-workspaces-drawer-actual.png"
          snapshot_dir="tests/ui/__angular_snapshots__/linux/angular-smoke.spec.ts"

          test -f "${desktop_source}"
          test -f "${mobile_source}"
          echo "f3235b447ace42c79245f5b815e3dce0eb9e1335fa0b6956ade032939c41e72b  ${desktop_source}" | sha256sum --check --strict
          echo "def912a97cfdab46af179f665aa3c680f864dc5317ba57ede26fa2e63b1aa203  ${mobile_source}" | sha256sum --check --strict

          install -m 0644 "${desktop_source}" "${snapshot_dir}/desktop-shell-workspaces.png"
          install -m 0644 "${mobile_source}" "${snapshot_dir}/mobile-shell-workspaces-drawer.png"

      - name: Commit refreshed baselines and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/update-playwright-snapshots-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/__angular_snapshots__/linux/angular-smoke.spec.ts/desktop-shell-workspaces.png \
                  tests/ui/__angular_snapshots__/linux/angular-smoke.spec.ts/mobile-shell-workspaces-drawer.png \
                  .github/workflows/update-playwright-snapshots-temp.yml
          git commit -m "test(ui): refresh Messages navigation snapshots"
          git push origin HEAD:fix/playwright-messages-snapshots
