name: Repair PR 219 frontend lockfile

on:
  push:
    branches:
      - frontend/v0.4-pr04-input-dialog-uploader-files
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.number == 219)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: frontend/v0.4-pr04-input-dialog-uploader-files
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Repair lockfile in a clean Linux dependency context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/node_modules
          npm --prefix frontend install --package-lock-only --include=optional --ignore-scripts --no-audit --no-fund
          npm --prefix frontend ci --include=optional --no-audit --no-fund

      - name: Verify lockfile remains stable
        shell: bash
        run: |
          set -euo pipefail
          cp frontend/package-lock.json /tmp/package-lock.before.json
          npm --prefix frontend install --package-lock-only --include=optional --ignore-scripts --no-audit --no-fund
          cmp /tmp/package-lock.before.json frontend/package-lock.json

      - name: Commit repaired dependency state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Lockfile was already stable; nothing to commit."
            exit 0
          fi
          git commit -m "fix(frontend): regenerate portable npm lockfile"
          git push origin HEAD:frontend/v0.4-pr04-input-dialog-uploader-files
