name: Publicization Readiness

on:
  pull_request:
    paths:
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".gitignore"
      - ".github/workflows/**"
      - "docs/PUBLICIZATION_*.md"
      - "frontend/package.json"
      - "scripts/ci/audit-publicization-readiness.mjs"
  push:
    branches: ["main"]
    paths:
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".gitignore"
      - ".github/workflows/**"
      - "docs/PUBLICIZATION_*.md"
      - "frontend/package.json"
      - "scripts/ci/audit-publicization-readiness.mjs"
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail when any PR-triggered self-hosted job lacks an explicit same-repository trust guard"
        required: true
        type: boolean
        default: true

concurrency:
  group: publicization-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Publicization readiness audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify checkout is not shallow
        shell: bash
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::Publicization audit requires complete Git history."
            exit 1
          fi

      - name: Run advisory audit
        if: github.event_name != 'workflow_dispatch' || inputs.strict != true
        run: node scripts/ci/audit-publicization-readiness.mjs

      - name: Run strict audit
        if: github.event_name == 'workflow_dispatch' && inputs.strict == true
        run: node scripts/ci/audit-publicization-readiness.mjs --strict

      - name: State full-history limitation
        shell: bash
        run: |
          {
            echo
            echo "## Mandatory external gate"
            echo
            echo "This workflow validates repository policy, tracked paths, high-confidence current-tree secret markers, and PR/self-hosted workflow boundaries."
            echo
            echo "It does not replace the repository's full-history Gitleaks scan or the manual review of Actions logs, artifacts, issues, releases, packages, and external systems required by docs/PUBLICIZATION_RUNBOOK.md."
          } >> "$GITHUB_STEP_SUMMARY"
