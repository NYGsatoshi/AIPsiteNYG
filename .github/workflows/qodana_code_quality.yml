name: Qodana Deep Analysis

# Qodana policy execution is intentionally kept out of this PR-mutable caller.
# The reusable gate is pinned to an immutable commit so an external PR cannot
# edit or remove its restore, scan, or SARIF-guard steps.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 18 * * 0"

concurrency:
  group: qodana-deep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana-dotnet-community:
    name: Qodana Gate
    permissions:
      contents: read
    uses: NYGsatoshi/AIPsiteNYG/.github/workflows/qodana_trusted_gate.yml@2495eb077b4c0cd0316f41a7aa4742b34ad5c4b0
