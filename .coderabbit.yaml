# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ja-JP"
early_access: false

tone_instructions: >-
  簡潔かつ技術的にレビューし、実害のある問題を優先する。既存CIで機械的に検出できる軽微な指摘は抑制する。

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  review_details: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    ignore_usernames:
      - "dependabot[bot]"
      - "github-actions[bot]"

  path_filters:
    - "!src/AipPortal.Web/wwwroot/**"
    - "!frontend/dist/**"
    - "!**/node_modules/**"
    - "!**/package-lock.json"
    - "!**/*.Designer.cs"

knowledge_base:
  code_guidelines:
    enabled: true

chat:
  auto_reply: true
