name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: CI change routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      backend_ef: ${{ steps.classify.outputs.backend_ef }}
      backend_tests: ${{ steps.classify.outputs.backend_tests }}
      backend_test_scope: ${{ steps.classify.outputs.backend_test_scope }}
      backend_test_filter: ${{ steps.classify.outputs.backend_test_filter }}
      backend_pr07b: ${{ steps.classify.outputs.backend_pr07b }}
      backend_pr07c: ${{ steps.classify.outputs.backend_pr07c }}
      backend_pr07d: ${{ steps.classify.outputs.backend_pr07d }}
      frontend: ${{ steps.classify.outputs.frontend }}
      frontend_build: ${{ steps.classify.outputs.frontend_build }}
      frontend_unit: ${{ steps.classify.outputs.frontend_unit }}
      frontend_unit_scope: ${{ steps.classify.outputs.frontend_unit_scope }}
      frontend_unit_features: ${{ steps.classify.outputs.frontend_unit_features }}
      frontend_architecture: ${{ steps.classify.outputs.frontend_architecture }}
      frontend_license_guard: ${{ steps.classify.outputs.frontend_license_guard }}
      frontend_storybook: ${{ steps.classify.outputs.frontend_storybook }}
      frontend_playwright: ${{ steps.classify.outputs.frontend_playwright }}
      security: ${{ steps.classify.outputs.security }}
      security_dotnet: ${{ steps.classify.outputs.security_dotnet }}
      security_compose: ${{ steps.classify.outputs.security_compose }}
      security_migration: ${{ steps.classify.outputs.security_migration }}
      security_image: ${{ steps.classify.outputs.security_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed work
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/route-main-ci-changes.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan repository secrets with Gitleaks
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect --no-git --source /repo --redact --verbose \
            --report-format json --report-path /repo/gitleaks-report.json
          status=$?
          set -e
          [[ -f gitleaks-report.json ]] || printf '[]\n' > gitleaks-report.json
          cat gitleaks-report.json
          exit "$status"

      - name: Upload Gitleaks secret scan report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-secret-scan-report
          path: gitleaks-report.json
          if-no-files-found: error

  build-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, aipsite-ci, general]
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: aip_portal_ci
          POSTGRES_USER: aip_portal_ci
          POSTGRES_PASSWORD: aip_portal_ci_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U aip_portal_ci -d aip_portal_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASPNETCORE_ENVIRONMENT: Test

    steps:
      - name: Configure PostgreSQL connection
        shell: bash
        run: |
          postgres_port='${{ job.services.postgres.ports[5432] }}'
          test -n "$postgres_port"
          {
            echo "ConnectionStrings__DefaultConnection=Host=localhost;Port=${postgres_port};Database=aip_portal_ci;Username=aip_portal_ci;Password=aip_portal_ci_password"
            echo "POSTGRES_TEST_CONNECTION_STRING=Host=localhost;Port=${postgres_port};Database=aip_portal_ci;Username=aip_portal_ci;Password=aip_portal_ci_password"
          } >> "$GITHUB_ENV"

      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure persistent .NET caches
        shell: bash
        run: |
          bash scripts/ci/configure-persistent-caches.sh
          install_dir="$HOME/.dotnet-ci"
          job_temp="$RUNNER_TEMP/dotnet-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p \
            "$install_dir" \
            "$job_temp/home" \
            "$job_temp/nuget/scratch" \
            "$GITHUB_WORKSPACE/artifacts/ci" \
            "$GITHUB_WORKSPACE/artifacts/test-results"
          {
            echo "DOTNET_INSTALL_DIR=$install_dir"
            echo "DOTNET_CMD=$install_dir/dotnet"
            echo "DOTNET_ROOT=$install_dir"
            echo "DOTNET_CLI_HOME=$job_temp/home"
            echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
            echo "DOTNET_NOLOGO=1"
            echo "DOTNET_MULTILEVEL_LOOKUP=0"
            echo "DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE=1"
            echo "NUGET_SCRATCH=$job_temp/nuget/scratch"
          } >> "$GITHUB_ENV"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        shell: bash
        run: |
          log="$GITHUB_WORKSPACE/artifacts/ci/build-test-dotnet-restore.log"
          set +e
          "$DOTNET_CMD" restore AipPortal.slnx \
            --disable-parallel \
            --verbosity normal 2>&1 | tee "$log"
          restore_status=${PIPESTATUS[0]}
          set -e
          exit "$restore_status"

      - name: Upload build restore log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-test-dotnet-restore-log
          path: artifacts/ci/build-test-dotnet-restore.log
          if-no-files-found: warn

      - name: Build
        run: '"$DOTNET_CMD" build AipPortal.slnx --configuration Release --no-restore --disable-build-servers -m:1'

      - name: Restore .NET tools
        if: needs.changes.outputs.backend_ef == 'true'
        run: '"$DOTNET_CMD" tool restore'

      - name: Apply PostgreSQL migrations
        if: needs.changes.outputs.backend_ef == 'true'
        run: '"$DOTNET_CMD" ef database update --project src/AipPortal.Infrastructure --startup-project src/AipPortal.Web --configuration Release'

      - name: Verify EF Core model has no pending changes
        if: needs.changes.outputs.backend_ef == 'true'
        shell: bash
        run: |
          "$DOTNET_CMD" ef migrations has-pending-model-changes \
            --project src/AipPortal.Infrastructure \
            --startup-project src/AipPortal.Web \
            --configuration Release \
            --no-build

      - name: Run routed backend tests
        if: needs.changes.outputs.backend_tests == 'true'
        env:
          BACKEND_TEST_SCOPE: ${{ needs.changes.outputs.backend_test_scope }}
          BACKEND_TEST_FILTER: ${{ needs.changes.outputs.backend_test_filter }}
          BASH_ENV: ""
        shell: bash
        run: |
          # A persistent runner may inject Bash startup/EXIT hooks. Keep those
          # hooks from turning a successful dotnet test into a false failure.
          trap - EXIT
          set -euo pipefail
          target="AipPortal.slnx"
          filter_args=()
          if [[ "$BACKEND_TEST_SCOPE" == "scoped" ]]; then
            test -n "$BACKEND_TEST_FILTER"
            target="tests/AipPortal.Tests/AipPortal.Tests.csproj"
            filter_args+=(--filter "$BACKEND_TEST_FILTER")
          fi

          "$DOTNET_CMD" test "$target" \
            --configuration Release \
            --no-build \
            --disable-build-servers \
            -m:1 \
            --verbosity normal \
            "${filter_args[@]}" \
            --logger "trx;LogFileName=backend-tests.trx" \
            --results-directory artifacts/test-results

      - name: Verify routed backend test results
        if: needs.changes.outputs.backend_tests == 'true'
        env:
          BACKEND_TEST_SCOPE: ${{ needs.changes.outputs.backend_test_scope }}
        shell: bash
        run: |
          label="Scoped backend"
          [[ "$BACKEND_TEST_SCOPE" == "full" ]] && label="Full backend"
          bash scripts/ci/verify-trx-results.sh \
            artifacts/test-results/backend-tests.trx \
            --minimum-total 1 \
            --label "$label"

      - name: Run routed TASK-V1-PR07 acceptance tests
        if: >-
          needs.changes.outputs.backend_test_scope != 'full' &&
          (needs.changes.outputs.backend_pr07b == 'true' ||
           needs.changes.outputs.backend_pr07c == 'true' ||
           needs.changes.outputs.backend_pr07d == 'true')
        env:
          RUN_PR07B: ${{ needs.changes.outputs.backend_pr07b }}
          RUN_PR07C: ${{ needs.changes.outputs.backend_pr07c }}
          RUN_PR07D: ${{ needs.changes.outputs.backend_pr07d }}
        shell: bash
        run: |
          set -euo pipefail
          filters=()
          [[ "$RUN_PR07B" == "true" ]] && filters+=("Scope=TaskV1PR07B")
          [[ "$RUN_PR07C" == "true" ]] && filters+=("Scope=TaskV1PR07C")
          [[ "$RUN_PR07D" == "true" ]] && filters+=("Scope=TaskV1PR07D")
          test "${#filters[@]}" -gt 0
          filter="$(IFS='|'; echo "${filters[*]}")"

          "$DOTNET_CMD" test tests/AipPortal.Tests/AipPortal.Tests.csproj \
            --configuration Release \
            --no-build \
            --disable-build-servers \
            -m:1 \
            --verbosity normal \
            --filter "$filter" \
            --logger "trx;LogFileName=backend-pr07-tests.trx" \
            --results-directory artifacts/test-results

      - name: Verify TASK-V1-PR07-B acceptance results
        if: needs.changes.outputs.backend_test_scope == 'full' || needs.changes.outputs.backend_pr07b == 'true'
        env:
          BACKEND_TEST_SCOPE: ${{ needs.changes.outputs.backend_test_scope }}
        shell: bash
        run: |
          trx="artifacts/test-results/backend-pr07-tests.trx"
          [[ "$BACKEND_TEST_SCOPE" == "full" ]] && trx="artifacts/test-results/backend-tests.trx"
          bash scripts/ci/verify-trx-results.sh \
            "$trx" \
            --minimum-total 1 \
            --required-tests scripts/ci/task-pr07b-required-tests.txt \
            --label "TASK-V1-PR07-B"

      - name: Verify TASK-V1-PR07-C acceptance results
        if: needs.changes.outputs.backend_test_scope == 'full' || needs.changes.outputs.backend_pr07c == 'true'
        env:
          BACKEND_TEST_SCOPE: ${{ needs.changes.outputs.backend_test_scope }}
        shell: bash
        run: |
          trx="artifacts/test-results/backend-pr07-tests.trx"
          [[ "$BACKEND_TEST_SCOPE" == "full" ]] && trx="artifacts/test-results/backend-tests.trx"
          bash scripts/ci/verify-trx-results.sh \
            "$trx" \
            --minimum-total 1 \
            --required-tests scripts/ci/task-pr07c-required-tests.txt \
            --label "TASK-V1-PR07-C"

      - name: Verify TASK-V1-PR07-D acceptance results
        if: needs.changes.outputs.backend_test_scope == 'full' || needs.changes.outputs.backend_pr07d == 'true'
        env:
          BACKEND_TEST_SCOPE: ${{ needs.changes.outputs.backend_test_scope }}
        shell: bash
        run: |
          trx="artifacts/test-results/backend-pr07-tests.trx"
          [[ "$BACKEND_TEST_SCOPE" == "full" ]] && trx="artifacts/test-results/backend-tests.trx"
          bash scripts/ci/verify-trx-results.sh \
            "$trx" \
            --minimum-total 1 \
            --required-tests scripts/ci/task-pr07d-required-tests.txt \
            --label "TASK-V1-PR07-D"

      - name: Upload backend test results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Report backend cache and host resources on failure
        if: failure()
        shell: bash
        run: |
          du -sh "$HOME/.nuget/packages" "$HOME/.cache/aipsite-ci" 2>/dev/null || true
          df -h || true
          df -i || true
          free -h || true
          docker system df || true

      - name: PostgreSQL logs on failure
        if: failure()
        shell: bash
        run: |
          postgres_id='${{ job.services.postgres.id }}'
          if [[ -n "$postgres_id" ]]; then
            docker logs "$postgres_id"
          else
            echo "PostgreSQL service container ID is unavailable."
          fi

  security-scan:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: self-hosted
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      IMAGE_NAME: aipsite-nyg-ci:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: ci_only_compose_config_password
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: plain

    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize security reports
        if: needs.changes.outputs.security_dotnet == 'true' || needs.changes.outputs.security_image == 'true'
        shell: bash
        run: |
          mkdir -p artifacts/ci
          printf 'Vulnerable package scan did not run.\n' > dotnet-vulnerable-packages.txt
          printf 'Deprecated package scan did not run.\n' > dotnet-deprecated-packages.txt
          printf 'Trivy image scan did not run.\n' > trivy-image-report.txt

      - name: Configure persistent .NET caches
        if: needs.changes.outputs.security_dotnet == 'true'
        shell: bash
        run: |
          bash scripts/ci/configure-persistent-caches.sh
          install_dir="$HOME/.dotnet-ci"
          job_temp="$RUNNER_TEMP/dotnet-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p \
            "$install_dir" \
            "$job_temp/home" \
            "$job_temp/nuget/scratch"
          {
            echo "DOTNET_INSTALL_DIR=$install_dir"
            echo "DOTNET_CMD=$install_dir/dotnet"
            echo "DOTNET_ROOT=$install_dir"
            echo "DOTNET_CLI_HOME=$job_temp/home"
            echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
            echo "DOTNET_NOLOGO=1"
            echo "DOTNET_MULTILEVEL_LOOKUP=0"
            echo "DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE=1"
            echo "NUGET_SCRATCH=$job_temp/nuget/scratch"
          } >> "$GITHUB_ENV"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Setup .NET
        if: needs.changes.outputs.security_dotnet == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        if: needs.changes.outputs.security_dotnet == 'true'
        shell: bash
        run: |
          log="$GITHUB_WORKSPACE/artifacts/ci/security-dotnet-restore.log"
          set +e
          "$DOTNET_CMD" restore AipPortal.slnx \
            --disable-parallel \
            --verbosity normal 2>&1 | tee "$log"
          restore_status=${PIPESTATUS[0]}
          set -e
          exit "$restore_status"

      - name: Upload security restore log
        if: failure() && needs.changes.outputs.security_dotnet == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: security-dotnet-restore-log
          path: artifacts/ci/security-dotnet-restore.log
          if-no-files-found: error

      - name: Check .NET vulnerable packages
        if: needs.changes.outputs.security_dotnet == 'true'
        shell: bash
        run: |
          set +e
          "$DOTNET_CMD" list AipPortal.slnx package --vulnerable --include-transitive > dotnet-vulnerable-packages.txt 2>&1
          status=$?
          set -e
          cat dotnet-vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" dotnet-vulnerable-packages.txt; then
            exit 1
          fi
          exit "$status"

      - name: Report .NET deprecated packages
        if: needs.changes.outputs.security_dotnet == 'true'
        shell: bash
        run: |
          set +e
          "$DOTNET_CMD" list AipPortal.slnx package --deprecated > dotnet-deprecated-packages.txt 2>&1
          status=$?
          set -e
          cat dotnet-deprecated-packages.txt
          exit "$status"

      - name: Upload .NET dependency scan reports
        if: failure() && needs.changes.outputs.security_dotnet == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-dependency-scan-reports
          path: |
            dotnet-vulnerable-packages.txt
            dotnet-deprecated-packages.txt
          if-no-files-found: error

      - name: Validate Docker Compose configs
        if: needs.changes.outputs.security_compose == 'true'
        env:
          POSTGRES_DB: aip_portal
          POSTGRES_USER: aip_portal
          POSTGRES_PASSWORD: ci_dummy_password
          DB_PASSWORD: ci_dummy_password
          LOCAL_ADMIN_PASSWORD: ci_dummy_local_admin_password
        run: |
          docker compose -f docker-compose.db.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.playwright.yml config --quiet
          docker compose -p aipsite-real-backend-smoke-ci-config -f docker-compose.real-backend-smoke.yml config --quiet
          docker compose -p aipsite-u22-demo-ci-config -f docker-compose.real-backend-smoke.yml -f docker-compose.u22-demo.yml config --quiet
          docker compose config --quiet
          docker compose -f docker-compose.local.yml config --quiet
          docker compose -f docker-compose.onprem.yml config --quiet
          docker compose -f docker-compose.onprem.yml -f docker-compose.onprem.ci.yml config --quiet
          docker compose -p deploy -f deploy/sakura/docker-compose.yml config --quiet
          bash scripts/ci/verify-onprem-proxy-topology.sh

      - name: Verify on-prem Compose migration service
        if: needs.changes.outputs.security_migration == 'true'
        env:
          DB_PASSWORD: ci_dummy_password
        shell: bash
        run: |
          set -euo pipefail
          project="aipsite-onprem-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker compose -p "$project" -f docker-compose.onprem.yml -f docker-compose.onprem.ci.yml down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose -p "$project" -f docker-compose.onprem.yml -f docker-compose.onprem.ci.yml \
            up --abort-on-container-exit --exit-code-from migrate postgres migrate

      - name: Build Docker image with persistent BuildKit caches
        if: needs.changes.outputs.security_image == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
        env:
          SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
        shell: bash
        run: |
          test -n "${SYNCFUSION_LICENSE:-}" || {
            echo "SYNCFUSION_LICENSE is not configured." >&2
            exit 1
          }
          license_file="$(mktemp)"
          trap 'rm -f "$license_file"' EXIT
          chmod 600 "$license_file"
          printf '%s' "$SYNCFUSION_LICENSE" > "$license_file"

          for attempt in 1 2; do
            set +e
            docker build \
              --pull \
              --progress=plain \
              --secret id=syncfusion_license,src="$license_file" \
              --tag "$IMAGE_NAME" \
              .
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if [[ "$attempt" -eq 2 ]]; then
              exit "$status"
            fi
            docker system df || true
            sleep 15
          done

      - name: Verify runtime image excludes Syncfusion license material
        if: needs.changes.outputs.security_image == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
        shell: bash
        run: |
          docker run --rm --entrypoint sh "$IMAGE_NAME" -c '
            test ! -e /run/secrets &&
            test ! -e /app/.env &&
            ! env | grep -q "^SYNCFUSION_LICENSE=" &&
            ! find /app -type f \( -name ".env" -o -name ".env.*" -o -name "syncfusion-license.txt" \) -print -quit | grep -q .
          '

      - name: Scan Docker image with Trivy
        if: needs.changes.outputs.security_image == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/repo" \
            aquasec/trivy:0.65.0 \
            image --scanners vuln --vuln-type os,library \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table --output /repo/trivy-image-report.txt \
            "$IMAGE_NAME"
          status=$?
          set -e
          cat trivy-image-report.txt
          exit "$status"

      - name: Scan repository with Trivy for Dependabot
        if: needs.changes.outputs.security_image == 'true' && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            aquasec/trivy:0.65.0 \
            fs --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table --output /repo/trivy-image-report.txt \
            /repo
          status=$?
          set -e
          cat trivy-image-report.txt
          exit "$status"

      - name: Upload Trivy image scan report
        if: failure() && needs.changes.outputs.security_image == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-scan-report
          path: trivy-image-report.txt
          if-no-files-found: warn

      - name: Remove per-run Docker image
        if: always() && needs.changes.outputs.security_image == 'true'
        shell: bash
        run: docker image rm --force "$IMAGE_NAME" || true

      - name: Report security cache and host resources on failure
        if: failure()
        shell: bash
        run: |
          du -sh "$HOME/.nuget/packages" "$HOME/.cache/aipsite-ci" 2>/dev/null || true
          df -h || true
          df -i || true
          free -h || true
          docker system df || true

      - name: Repair security workspace ownership
        if: always()
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Configure persistent npm and Angular caches
        if: >-
          needs.changes.outputs.frontend_build == 'true' ||
          needs.changes.outputs.frontend_unit == 'true' ||
          needs.changes.outputs.frontend_architecture == 'true' ||
          needs.changes.outputs.frontend_license_guard == 'true' ||
          needs.changes.outputs.frontend_storybook == 'true'
        env:
          CI_ENABLE_ANGULAR_CACHE: "1"
        shell: bash
        run: bash scripts/ci/configure-persistent-caches.sh

      - name: Install Angular frontend dependencies
        if: >-
          needs.changes.outputs.frontend_build == 'true' ||
          needs.changes.outputs.frontend_unit == 'true' ||
          needs.changes.outputs.frontend_architecture == 'true' ||
          needs.changes.outputs.frontend_license_guard == 'true' ||
          needs.changes.outputs.frontend_storybook == 'true'
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Activate Syncfusion license for frontend compilation
        if: >-
          (needs.changes.outputs.frontend_build == 'true' || needs.changes.outputs.frontend_storybook == 'true') &&
          (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
        working-directory: frontend
        env:
          SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
        shell: bash
        run: |
          test -x node_modules/.bin/syncfusion-license
          test -n "${SYNCFUSION_LICENSE:-}"
          npm run syncfusion:activate

      - name: Angular production build
        if: needs.changes.outputs.frontend_build == 'true'
        working-directory: frontend
        run: npm run build

      - name: Angular unit tests
        if: needs.changes.outputs.frontend_unit == 'true'
        working-directory: frontend
        env:
          FRONTEND_UNIT_SCOPE: ${{ needs.changes.outputs.frontend_unit_scope }}
          FRONTEND_UNIT_FEATURES: ${{ needs.changes.outputs.frontend_unit_features }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$FRONTEND_UNIT_SCOPE" == "features" ]]; then
            IFS=',' read -r -a features <<< "$FRONTEND_UNIT_FEATURES"
            for feature in "${features[@]}"; do
              [[ -n "$feature" ]] || continue
              args+=(--include "src/app/features/${feature}/**/*.spec.ts")
            done
          fi
          npm run test -- "${args[@]}"

      - name: Validate frontend architecture
        if: needs.changes.outputs.frontend_architecture == 'true'
        working-directory: frontend
        run: |
          npm run check:architecture
          npm run test:architecture

      - name: Validate Syncfusion license safeguards
        if: needs.changes.outputs.frontend_license_guard == 'true'
        working-directory: frontend
        run: npm run test:syncfusion-license

      - name: Angular Storybook build
        if: needs.changes.outputs.frontend_storybook == 'true'
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build-storybook

      - name: Angular Playwright smoke
        if: needs.changes.outputs.frontend_playwright == 'true'
        env:
          AIP_PLAYWRIGHT_REUSE_HOST_BUILD: ${{ needs.changes.outputs.frontend_build }}
        shell: bash
        run: npm run test:ui:angular:docker

      - name: Upload Playwright artifacts
        if: failure() && needs.changes.outputs.frontend_playwright == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ui-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Report frontend cache and host resources on failure
        if: failure()
        shell: bash
        run: |
          du -sh "$HOME/.npm" "$HOME/.cache/aipsite-ci" 2>/dev/null || true
          df -h || true
          df -i || true
          free -h || true
          docker system df || true

      - name: Repair frontend workspace ownership
        if: always()
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"
