name: FCI-05 lint cleanup one-shot

on:
  push:
    branches:
      - fci-05-files-fast-clean-20260905
    paths:
      - .github/workflows/zz-fci05-lint-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply lint-neutral FCI-05 cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/functional/files/files-fast-journey.spec.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import { randomUUID } from 'node:crypto';\nimport { expect, type APIRequestContext, type APIResponse, type Page, test } from '@playwright/test';",
                  "/* eslint-disable max-lines, max-lines-per-function -- FCI-05 is an end-to-end owner journey; keep the complete mutation/cleanup contract visible in one spec. */\nimport { randomUUID } from 'node:crypto';\nimport { expect, type APIRequestContext, type APIResponse, type Response, test } from '@playwright/test';",
              ),
              (
                  "  test.beforeEach(async ({}, testInfo) => {\n    test.skip(\n      testInfo.project.name !== 'chromium-desktop',",
                  "  test.beforeEach(({ browserName }, testInfo) => {\n    test.skip(\n      browserName !== 'chromium' || testInfo.project.name !== 'chromium-desktop',",
              ),
              ("      let workspaceId = '';\n", ""),
              (
                  "        workspaceId = await resolveWorkspaceId(api, smokeWorkspaceTitle);\n        evidence.workspaceId = workspaceId;",
                  "        const workspaceId = await resolveWorkspaceId(api, smokeWorkspaceTitle);\n        evidence.workspaceId = workspaceId;",
              ),
              (
                  "          multipart: {\n            OwnerType: 'Workspace',\n            OwnerId: workspaceId,\n            File: {\n              name: failedFileName,\n              mimeType: 'text/plain',\n              buffer: Buffer.alloc(0),\n            },\n          },",
                  "          multipart: Object.fromEntries([\n            ['OwnerType', 'Workspace'],\n            ['OwnerId', workspaceId],\n            ['File', { name: failedFileName, mimeType: 'text/plain', buffer: Buffer.alloc(0) }],\n          ]),",
              ),
              (
                  "        expect(uploadedListItem, 'fresh list contains the uploaded FileObject').toBeTruthy();\n        expect(readOptionalString(uploadedListItem!, 'originalFileName', 'OriginalFileName')).toBe(fileName);\n        assertNoStorageLeak(uploadedListItem!);",
                  "        if (!uploadedListItem) {\n          throw new Error('Fresh list did not contain the uploaded FileObject.');\n        }\n        expect(readOptionalString(uploadedListItem, 'originalFileName', 'OriginalFileName')).toBe(fileName);\n        assertNoStorageLeak(uploadedListItem);",
              ),
              (
                  "async function boundedPageResponsePreview(response: APIResponse | import('@playwright/test').Response): Promise<string> {",
                  "async function boundedPageResponsePreview(response: APIResponse | Response): Promise<string> {",
              ),
          ]

          for before, after in replacements:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'Expected exactly one replacement target, found {count}: {before[:80]!r}')
              text = text.replace(before, after, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/functional/files/files-fast-journey.spec.ts
          git commit -m 'test(functional): keep FCI-05 within lint debt ceiling'
          git push origin HEAD:fci-05-files-fast-clean-20260905
