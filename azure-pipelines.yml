# Temporary Azure Pipelines CI for AIPsiteNYG.
# The regular GitHub Actions CI is intentionally disabled while this pipeline is in use.
# Required secret in Azure Pipelines: SYNCFUSION_LICENSE

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    exclude:
      - '**/*.md'
      - 'docs/**'

pr:
  autoCancel: true
  branches:
    include:
      - main
  paths:
    exclude:
      - '**/*.md'
      - 'docs/**'

pool:
  vmImage: ubuntu-latest

resources:
  containers:
    - container: postgres
      image: postgres:18-alpine
      env:
        POSTGRES_DB: aip_portal_ci
        POSTGRES_USER: aip_portal_ci
        POSTGRES_PASSWORD: aip_portal_ci_password
      ports:
        - 5432:5432
      options: >-
        --health-cmd "pg_isready -U aip_portal_ci -d aip_portal_ci"
        --health-interval 10s
        --health-timeout 5s
        --health-retries 5

jobs:
  - job: BuildTest
    displayName: Backend build and test
    timeoutInMinutes: 60
    services:
      postgres: postgres
    variables:
      ASPNETCORE_ENVIRONMENT: Test
      ConnectionStrings__DefaultConnection: 'Host=localhost;Port=5432;Database=aip_portal_ci;Username=aip_portal_ci;Password=aip_portal_ci_password'
      POSTGRES_TEST_CONNECTION_STRING: 'Host=localhost;Port=5432;Database=aip_portal_ci;Username=aip_portal_ci;Password=aip_portal_ci_password'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: '1'

    steps:
      - checkout: self
        persistCredentials: false

      - task: UseDotNet@2
        displayName: Install .NET SDK from global.json
        inputs:
          packageType: sdk
          useGlobalJson: true
          workingDirectory: '$(Build.SourcesDirectory)'

      - bash: |
          set -euo pipefail
          postgres_id="$(docker ps --filter 'ancestor=postgres:18-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_id"
          for attempt in $(seq 1 30); do
            if docker exec "$postgres_id" pg_isready -U aip_portal_ci -d aip_portal_ci; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$postgres_id" || true
          exit 1
        displayName: Wait for PostgreSQL

      - bash: |
          set -euo pipefail
          mkdir -p \
            artifacts/ci \
            artifacts/test-results \
            artifacts/task-pr07b-test-results \
            artifacts/task-pr07c-test-results \
            artifacts/task-pr07d-test-results
          log="artifacts/ci/build-test-dotnet-restore.log"
          set +e
          dotnet restore AipPortal.slnx \
            --disable-parallel \
            --verbosity normal 2>&1 | tee "$log"
          restore_status=${PIPESTATUS[0]}
          set -e
          exit "$restore_status"
        displayName: Restore

      - bash: |
          dotnet build AipPortal.slnx \
            --configuration Release \
            --no-restore \
            --disable-build-servers \
            -m:1
        displayName: Build

      - bash: dotnet tool restore
        displayName: Restore .NET tools

      - bash: |
          dotnet ef database update \
            --project src/AipPortal.Infrastructure \
            --startup-project src/AipPortal.Web \
            --configuration Release
        displayName: Apply PostgreSQL migrations

      - bash: |
          dotnet ef migrations has-pending-model-changes \
            --project src/AipPortal.Infrastructure \
            --startup-project src/AipPortal.Web \
            --configuration Release \
            --no-build
        displayName: Verify EF Core model has no pending changes

      - bash: |
          dotnet test AipPortal.slnx \
            --configuration Release \
            --no-build \
            --disable-build-servers \
            -m:1 \
            --verbosity normal \
            --logger "trx;LogFileName=backend-tests.trx" \
            --results-directory artifacts/test-results
        displayName: Full backend tests

      - bash: |
          bash scripts/ci/verify-trx-results.sh \
            artifacts/test-results/backend-tests.trx \
            --minimum-total 1 \
            --label "Full backend"
        displayName: Verify full backend test results

      - bash: |
          dotnet test \
            tests/AipPortal.Tests/AipPortal.Tests.csproj \
            --configuration Release \
            --no-build \
            --disable-build-servers \
            -m:1 \
            --verbosity normal \
            --filter "Scope=TaskV1PR07B" \
            --logger "trx;LogFileName=task-pr07b-acceptance.trx" \
            --results-directory artifacts/task-pr07b-test-results
          bash scripts/ci/verify-trx-results.sh \
            artifacts/task-pr07b-test-results/task-pr07b-acceptance.trx \
            --minimum-total 1 \
            --required-tests scripts/ci/task-pr07b-required-tests.txt \
            --label "TASK-V1-PR07-B"
        displayName: TASK-V1-PR07-B acceptance

      - bash: |
          dotnet test \
            tests/AipPortal.Tests/AipPortal.Tests.csproj \
            --configuration Release \
            --no-build \
            --disable-build-servers \
            -m:1 \
            --verbosity normal \
            --filter "Scope=TaskV1PR07C" \
            --logger "trx;LogFileName=task-pr07c-acceptance.trx" \
            --results-directory artifacts/task-pr07c-test-results
          bash scripts/ci/verify-trx-results.sh \
            artifacts/task-pr07c-test-results/task-pr07c-acceptance.trx \
            --minimum-total 1 \
            --required-tests scripts/ci/task-pr07c-required-tests.txt \
            --label "TASK-V1-PR07-C"
        displayName: TASK-V1-PR07-C acceptance

      - bash: |
          dotnet test \
            tests/AipPortal.Tests/AipPortal.Tests.csproj \
            --configuration Release \
            --no-build \
            --disable-build-servers \
            -m:1 \
            --verbosity normal \
            --filter "Scope=TaskV1PR07D" \
            --logger "trx;LogFileName=task-pr07d-acceptance.trx" \
            --results-directory artifacts/task-pr07d-test-results
          bash scripts/ci/verify-trx-results.sh \
            artifacts/task-pr07d-test-results/task-pr07d-acceptance.trx \
            --minimum-total 1 \
            --required-tests scripts/ci/task-pr07d-required-tests.txt \
            --label "TASK-V1-PR07-D"
        displayName: TASK-V1-PR07-D acceptance

      - task: PublishTestResults@2
        displayName: Publish backend test results
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: 'artifacts/**/*.trx'
          searchFolder: '$(Build.SourcesDirectory)'
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: false

      - task: PublishPipelineArtifact@1
        displayName: Publish backend CI artifacts
        condition: always()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/artifacts'
          artifact: backend-ci-artifacts
          publishLocation: pipeline

      - bash: |
          df -h || true
          free -h || true
          docker system df || true
          postgres_id="$(docker ps --filter 'ancestor=postgres:18-alpine' --format '{{.ID}}' | head -n 1)"
          if [ -n "$postgres_id" ]; then
            docker logs "$postgres_id" || true
          fi
        displayName: Report backend resources on failure
        condition: failed()

  - job: SecurityScan
    displayName: Security and container scan
    timeoutInMinutes: 60
    variables:
      IMAGE_NAME: 'aipsite-nyg-ci:$(Build.SourceVersion)-$(Build.BuildId)'
      POSTGRES_PASSWORD: ci_only_compose_config_password
      DOCKER_BUILDKIT: '1'
      BUILDKIT_PROGRESS: plain
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: '1'

    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: false

      - bash: |
          set -euo pipefail
          mkdir -p artifacts/security artifacts/ci
          printf 'Vulnerable package scan did not run.\n' > artifacts/security/dotnet-vulnerable-packages.txt
          printf 'Deprecated package scan did not run.\n' > artifacts/security/dotnet-deprecated-packages.txt
          printf 'Trivy image scan did not run.\n' > artifacts/security/trivy-image-report.txt

          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect --no-git --source /repo --redact --verbose \
            --report-format json --report-path /repo/artifacts/security/gitleaks-report.json
          status=$?
          set -e
          test -f artifacts/security/gitleaks-report.json || printf '[]\n' > artifacts/security/gitleaks-report.json
          cat artifacts/security/gitleaks-report.json
          exit "$status"
        displayName: Gitleaks secret scan

      - task: UseDotNet@2
        displayName: Install .NET SDK from global.json
        inputs:
          packageType: sdk
          useGlobalJson: true
          workingDirectory: '$(Build.SourcesDirectory)'

      - bash: |
          set -euo pipefail
          log="artifacts/ci/security-dotnet-restore.log"
          set +e
          dotnet restore AipPortal.slnx \
            --disable-parallel \
            --verbosity normal 2>&1 | tee "$log"
          restore_status=${PIPESTATUS[0]}
          set -e
          exit "$restore_status"
        displayName: Restore for security scan

      - bash: |
          set -euo pipefail
          set +e
          dotnet list AipPortal.slnx package --vulnerable --include-transitive \
            > artifacts/security/dotnet-vulnerable-packages.txt 2>&1
          status=$?
          set -e
          cat artifacts/security/dotnet-vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" artifacts/security/dotnet-vulnerable-packages.txt; then
            exit 1
          fi
          exit "$status"
        displayName: Check .NET vulnerable packages

      - bash: |
          set -euo pipefail
          set +e
          dotnet list AipPortal.slnx package --deprecated \
            > artifacts/security/dotnet-deprecated-packages.txt 2>&1
          status=$?
          set -e
          cat artifacts/security/dotnet-deprecated-packages.txt
          exit "$status"
        displayName: Report .NET deprecated packages

      - bash: |
          set -euo pipefail
          export POSTGRES_DB=aip_portal
          export POSTGRES_USER=aip_portal
          export POSTGRES_PASSWORD=ci_dummy_password
          export DB_PASSWORD=ci_dummy_password
          export LOCAL_ADMIN_PASSWORD=ci_dummy_local_admin_password

          docker compose -f docker-compose.db.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.playwright.yml config --quiet
          docker compose -p aipsite-real-backend-smoke-ci-config -f docker-compose.real-backend-smoke.yml config --quiet
          docker compose config --quiet
          docker compose -f docker-compose.local.yml config --quiet
          docker compose -f docker-compose.onprem.yml config --quiet
          docker compose -p deploy -f deploy/sakura/docker-compose.yml config --quiet
        displayName: Validate Docker Compose configs

      - bash: |
          set -euo pipefail
          if [ -z "${SYNCFUSION_LICENSE:-}" ]; then
            echo "SYNCFUSION_LICENSE must be configured as a secret Azure Pipeline variable." >&2
            exit 1
          fi

          license_file="$(mktemp)"
          trap 'rm -f "$license_file"' EXIT
          chmod 600 "$license_file"
          printf '%s' "$SYNCFUSION_LICENSE" > "$license_file"

          for attempt in 1 2; do
            set +e
            docker build \
              --pull \
              --progress=plain \
              --secret id=syncfusion_license,src="$license_file" \
              --tag "$IMAGE_NAME" \
              .
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit "$status"
            fi
            docker system df || true
            sleep 15
          done
        displayName: Build Docker image
        env:
          SYNCFUSION_LICENSE: $(SYNCFUSION_LICENSE)

      - bash: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE_NAME" -c '
            test ! -e /run/secrets &&
            test ! -e /app/.env &&
            ! env | grep -q "^SYNCFUSION_LICENSE=" &&
            ! find /app -type f \( -name ".env" -o -name ".env.*" -o -name "syncfusion-license.txt" \) -print -quit | grep -q .
          '
        displayName: Verify runtime image excludes license material

      - bash: |
          set -euo pipefail
          set +e
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/repo" \
            aquasec/trivy:0.65.0 \
            image --scanners vuln --vuln-type os,library \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table --output /repo/artifacts/security/trivy-image-report.txt \
            "$IMAGE_NAME"
          status=$?
          set -e
          cat artifacts/security/trivy-image-report.txt
          exit "$status"
        displayName: Trivy image scan

      - task: PublishPipelineArtifact@1
        displayName: Publish security reports
        condition: always()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/artifacts'
          artifact: security-ci-artifacts
          publishLocation: pipeline

      - bash: |
          docker image rm --force "$IMAGE_NAME" || true
        displayName: Remove per-run Docker image
        condition: always()

      - bash: |
          df -h || true
          free -h || true
          docker system df || true
        displayName: Report security resources on failure
        condition: failed()

  - job: FrontendTest
    displayName: Angular and Playwright tests
    dependsOn:
      - BuildTest
      - SecurityScan
    condition: succeeded()
    timeoutInMinutes: 60
    variables:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - checkout: self
        persistCredentials: false

      - task: NodeTool@0
        displayName: Install Node.js 24
        inputs:
          versionSpec: '24.x'

      - bash: bash scripts/ci/npm-ci-retry.sh .
        displayName: Install repository Playwright dependencies

      - bash: bash scripts/ci/npm-ci-retry.sh frontend
        displayName: Install Angular frontend dependencies

      - bash: npm run build
        workingDirectory: frontend
        displayName: Angular production build

      - bash: |
          set -euo pipefail
          if [ -z "${SYNCFUSION_LICENSE:-}" ]; then
            echo "SYNCFUSION_LICENSE must be configured as a secret Azure Pipeline variable." >&2
            exit 1
          fi
          test -x node_modules/.bin/syncfusion-license
          npm run build:licensed
        workingDirectory: frontend
        displayName: Validate licensed frontend build
        env:
          SYNCFUSION_LICENSE: $(SYNCFUSION_LICENSE)

      - bash: npm run test
        workingDirectory: frontend
        displayName: Angular unit tests

      - bash: |
          npm run check:architecture
          npm run test:architecture
          npm run test:syncfusion-license
        workingDirectory: frontend
        displayName: Validate frontend architecture and license safeguards

      - bash: npm run build-storybook
        workingDirectory: frontend
        displayName: Angular Storybook build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - bash: |
          mkdir -p playwright-report test-results
          npm run test:ui:angular:docker
        displayName: Angular Playwright smoke

      - task: PublishPipelineArtifact@1
        displayName: Publish Playwright report
        condition: failed()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/playwright-report'
          artifact: playwright-report
          publishLocation: pipeline

      - task: PublishPipelineArtifact@1
        displayName: Publish Playwright test results
        condition: failed()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/test-results'
          artifact: playwright-test-results
          publishLocation: pipeline

      - bash: |
          df -h || true
          free -h || true
          docker system df || true
        displayName: Report frontend resources on failure
        condition: failed()
