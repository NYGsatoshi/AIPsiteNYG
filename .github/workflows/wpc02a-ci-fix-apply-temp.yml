name: WPC-02A CI regression fix apply temporary

on:
  push:
    branches:
      - wpc-02a-visibility-provenance-archive

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'WPC-02A: apply bounded regression patch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: wpc-02a-visibility-provenance-archive
          fetch-depth: 0
      - name: Apply patch script
        run: python tools/wpc02a_ci_fix_temp.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "WPC-02A: fix full-suite CI regressions"
          git push origin HEAD:wpc-02a-visibility-provenance-archive
