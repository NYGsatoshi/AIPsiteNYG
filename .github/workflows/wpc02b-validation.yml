name: WPC-02B validation

on:
  push:
    branches:
      - wpc-02b-capabilitygrant-workspace-general
    paths:
      - .github/workflows/wpc02b-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wpc-02b-capabilitygrant-workspace-general
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Restore
        run: |
          dotnet restore AipPortal.slnx
          dotnet tool restore
      - name: Build
        run: dotnet build AipPortal.slnx --no-restore --configuration Release
      - name: WPC-02B PostgreSQL acceptance
        run: >-
          dotnet test tests/AipPortal.Tests/AipPortal.Tests.csproj
          --no-restore
          --configuration Release
          --filter "Scope=WPC02B"
          --logger "console;verbosity=normal"
      - name: EF model consistency
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/AipPortal.Infrastructure/AipPortal.Infrastructure.csproj
          --startup-project src/AipPortal.Web/AipPortal.Web.csproj
          --context AppDbContext
          --configuration Release
          --no-build
