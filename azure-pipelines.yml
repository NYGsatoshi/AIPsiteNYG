# Temporary Azure Pipelines CI for AIPsiteNYG.
# Automatic GitHub Actions workflows that require self-hosted runners are
# preserved as *.yml.disabled while this pipeline is in use.
# Required Azure secret variable: SYNCFUSION_LICENSE
#
# The Azure jobs are path-scoped and deliberately reuse authoritative test
# results instead of re-running the same acceptance scopes multiple times.

trigger:
  batch: true
  branches:
    include:
      - main

pr:
  autoCancel: true
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

resources:
  containers:
    - container: postgres
      image: postgres:18-alpine
      env:
        POSTGRES_DB: aip_portal_ci
        POSTGRES_USER: aip_portal_ci
        POSTGRES_PASSWORD: aip_portal_ci_password
      ports:
        - 5432:5432
      options: >-
        --health-cmd "pg_isready -U aip_portal_ci -d aip_portal_ci"
        --health-interval 10s
        --health-timeout 5s
        --health-retries 5

jobs:
  - template: ci/azure/core-jobs.yml
  - template: ci/azure/security-jobs.yml
  - template: ci/azure/frontend-jobs.yml
