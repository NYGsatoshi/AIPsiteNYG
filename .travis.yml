os: linux
dist: noble
language: node_js
node_js:
  - "24"

services:
  - docker

cache:
  directories:
    - $HOME/.nuget/packages
    - $HOME/.npm

env:
  global:
    - DOTNET_CLI_TELEMETRY_OPTOUT=1
    - DOTNET_NOLOGO=1
    - DOTNET_MULTILEVEL_LOOKUP=0
    - DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE=1
    - POSTGRES_DB=aip_portal_ci
    - POSTGRES_USER=aip_portal_ci
    - POSTGRES_PASSWORD=aip_portal_ci_password
    - POSTGRES_DEV_HOST_PORT=5433
    - ConnectionStrings__DefaultConnection=Host=localhost;Port=5433;Database=aip_portal_ci;Username=aip_portal_ci;Password=aip_portal_ci_password
    - POSTGRES_TEST_CONNECTION_STRING=Host=localhost;Port=5433;Database=aip_portal_ci;Username=aip_portal_ci;Password=aip_portal_ci_password

before_install:
  - curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
  - bash /tmp/dotnet-install.sh --version 10.0.302 --install-dir "$HOME/.dotnet"
  - export DOTNET_ROOT="$HOME/.dotnet"
  - export PATH="$HOME/.dotnet:$PATH"
  - npm install --global npm@11.17.0
  - dotnet --version
  - node --version
  - npm --version
  - docker --version
  - docker compose version

install: skip

before_script:
  - docker compose -f docker-compose.db.yml up -d
  - bash scripts/ci/wait-for-travis-postgres.sh

script:
  - bash scripts/ci/run-travis-core.sh

after_script:
  - docker compose -f docker-compose.db.yml down -v
