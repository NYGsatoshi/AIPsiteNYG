name: Mobile Compatibility

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/mobile-compatibility.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'scripts/ci/compat-critical.contract.json'
      - 'scripts/ci/compat-critical-contract.mjs'
      - 'scripts/ci/run-compat-critical.mjs'
      - 'scripts/ci/verify-compat-critical.mjs'
      - 'scripts/ci/npm-ci-retry.sh'
      - 'tests/ui/angular-smoke.spec.ts'
      - 'tests/ui/mobile-compatibility.spec.ts'
      - 'tests/ui/serve-static.mjs'
      - 'frontend/**'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/mobile-compatibility.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'scripts/ci/compat-critical.contract.json'
      - 'scripts/ci/compat-critical-contract.mjs'
      - 'scripts/ci/run-compat-critical.mjs'
      - 'scripts/ci/verify-compat-critical.mjs'
      - 'scripts/ci/npm-ci-retry.sh'
      - 'tests/ui/angular-smoke.spec.ts'
      - 'tests/ui/mobile-compatibility.spec.ts'
      - 'tests/ui/serve-static.mjs'
      - 'frontend/**'

concurrency:
  group: mobile-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-compatibility:
    name: mobile-${{ matrix.project }} (retries=0)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-mobile
            browser: chromium
          - project: webkit-mobile
            browser: webkit
          - project: narrow-320
            browser: chromium

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Clean-install compatibility dependencies
        shell: bash
        run: |
          bash scripts/ci/npm-ci-retry.sh .
          bash scripts/ci/npm-ci-retry.sh frontend

      - name: Install ${{ matrix.browser }} runtime
        run: npx playwright install --with-deps "${{ matrix.browser }}"

      - name: Run mobile compatibility profile
        env:
          CI: 'true'
        run: >-
          npm run test:ui:compat-critical --
          --profile mobile --
          --project=${{ matrix.project }}

      - name: Summarize mobile compatibility cell
        if: always()
        shell: bash
        run: |
          {
            echo "### Mobile compatibility"
            echo
            echo "- Project: \`${{ matrix.project }}\`"
            echo "- Browser runtime: \`${{ matrix.browser }}\`"
            echo "- Canonical profile: \`mobile\`"
            echo "- Playwright retries: \`0\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profile-specific artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-compatibility-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
