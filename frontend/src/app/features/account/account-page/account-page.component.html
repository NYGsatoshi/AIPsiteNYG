@let accountPage = page();

<section class="account-page" data-testid="account-page">
  <header class="account-page__header">
    <div>
      <p class="account-page__eyebrow">アカウント</p>
      <h1>{{ accountPage.title }}</h1>
    </div>
  </header>

  @if (accountPage.status === 'loading') {
    <app-inline-loading label="アカウント情報を読み込み中" />
  } @else if (accountPage.status === 'error') {
    <app-empty-state title="読み込めませんでした" [message]="accountPage.message ?? 'アカウント情報を読み込めませんでした。'" />
  } @else if (accountPage.status === 'permissionDenied') {
    <app-permission-denied [title]="accountPage.message ?? 'アカウント情報を表示する権限がありません。'" />
  } @else {
    <div class="account-page__grid">
      <div class="account-page__main">
        @if (accountPage.profile) {
          <app-account-profile-panel [profile]="accountPage.profile" />
        }
        <app-password-panel [result]="passwordResult()" (passwordChange)="changePassword($event)" />
      </div>
      <aside class="account-page__aside">
        @if (accountPage.accountStatus) {
          <app-account-status-panel [status]="accountPage.accountStatus" />
        }
        <app-session-list [sessions]="accountPage.sessions" />
      </aside>
    </div>
  }
</section>
