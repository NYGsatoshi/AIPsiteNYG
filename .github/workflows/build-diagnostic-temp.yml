name: Temporary Build Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/build-diagnostic-temp.yml"

permissions:
  contents: read

jobs:
  build-diagnostic:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Configure .NET
        shell: bash
        run: |
          bash scripts/ci/configure-persistent-caches.sh
          install_dir="$HOME/.dotnet-ci"
          job_temp="$RUNNER_TEMP/dotnet-build-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$install_dir" "$job_temp/home" "$job_temp/nuget/scratch" "$GITHUB_WORKSPACE/artifacts/build-diagnostic"
          {
            echo "DOTNET_INSTALL_DIR=$install_dir"
            echo "DOTNET_CMD=$install_dir/dotnet"
            echo "DOTNET_ROOT=$install_dir"
            echo "DOTNET_CLI_HOME=$job_temp/home"
            echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
            echo "DOTNET_NOLOGO=1"
            echo "DOTNET_MULTILEVEL_LOOKUP=0"
            echo "NUGET_SCRATCH=$job_temp/nuget/scratch"
          } >> "$GITHUB_ENV"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        shell: bash
        run: '"$DOTNET_CMD" restore AipPortal.slnx --disable-parallel'

      - name: Build and capture log
        shell: bash
        run: |
          log="$GITHUB_WORKSPACE/artifacts/build-diagnostic/build.log"
          set +e
          "$DOTNET_CMD" build AipPortal.slnx --configuration Release --no-restore --disable-build-servers -m:1 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > "$GITHUB_WORKSPACE/artifacts/build-diagnostic/status.txt"
          exit "$status"

      - name: Upload build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostic
          path: artifacts/build-diagnostic
          if-no-files-found: error
          retention-days: 1
