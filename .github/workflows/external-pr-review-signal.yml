name: External PR review signal

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  signal:
    name: External PR review signal
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit review-change signal
        shell: bash
        run: |
          echo "Review state changed for PR #${{ github.event.pull_request.number }}."
          echo "The trusted default-branch evaluator will re-read the authoritative review state."
