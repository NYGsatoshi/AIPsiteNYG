name: Apply PR Sonar remediations

on:
  push:
    branches:
      - feat/sec06-zap-authenticated-dast-578
    paths:
      - .github/workflows/diagnose-sonar-pr720.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Apply exact Sonar fixes
        run: |
          set -euo pipefail
          python3 - <<'PYTHON_SCRIPT'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          operation_path = Path("src/AipPortal.Web/OpenApi/SecurityOpenApiOperationTransformer.cs")
          operation = operation_path.read_text(encoding="utf-8")
          operation = replace_once(
              operation,
              "foreach (var property in RequiredProperties(parameter.ParameterType))",
              "foreach (var propertyName in RequiredProperties(parameter.ParameterType).Select(property => property.Name))",
              "operation property loop",
          )
          operation = replace_once(
              operation,
              "ContainsKey(property.Name)",
              "ContainsKey(propertyName)",
              "operation property lookup",
          )
          operation = replace_once(
              operation,
              "Add(property.Name)",
              "Add(propertyName)",
              "operation required property add",
          )
          if "using System.Linq;\n" not in operation:
              operation = replace_once(
                  operation,
                  "using System.ComponentModel.DataAnnotations;\n",
                  "using System.ComponentModel.DataAnnotations;\nusing System.Linq;\n",
                  "operation using insertion",
              )
          operation_path.write_text(operation, encoding="utf-8")

          test_path = Path("scripts/security/test-zap-contract.sh")
          test = test_path.read_text(encoding="utf-8")
          image_literal = "'zaproxy/zap-stable:2.17.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'"
          image_count = test.count(image_literal)
          if image_count != 6:
              raise SystemExit(f"scanner image literal: expected 6 occurrences, found {image_count}")
          test = test.replace(image_literal, '"$TEST_SCANNER_IMAGE"')
          addon_marker = "addon_sha=\"$(printf 'immutable-addon-inventory' | sha256sum | awk '{print $1}')\"\n"
          test = replace_once(
              test,
              addon_marker,
              addon_marker + "readonly TEST_SCANNER_IMAGE=" + image_literal + "\n",
              "test scanner image constant insertion",
          )
          test_path.write_text(test, encoding="utf-8")

          runner_path = Path("scripts/security/zap-runner.sh")
          runner = runner_path.read_text(encoding="utf-8")
          awk_literal = "awk '{print $1}'"
          awk_count = runner.count(awk_literal)
          if awk_count != 4:
              raise SystemExit(f"SHA extraction literal: expected 4 occurrences, found {awk_count}")
          runner = runner.replace(awk_literal, "cut -d ' ' -f1")

          runner = replace_once(
              runner,
              '    security_zap_fail "authoritative SEC-01 OpenAPI artifact failed re-verification" || return 1\n}\n\nsecurity_zap_roles() {',
              '    security_zap_fail "authoritative SEC-01 OpenAPI artifact failed re-verification" || return 1\n  return 0\n}\n\nsecurity_zap_roles() {',
              "require-contract return",
          )
          runner = replace_once(
              runner,
              "' \"$network\" || return 1\n}\n\nsecurity_zap_target_regex() {",
              "' \"$network\" || return 1\n  return 0\n}\n\nsecurity_zap_target_regex() {",
              "internal-network return",
          )
          runner = replace_once(
              runner,
              '    python3 - "$jar" <<\'PY\'\n',
              '    python3 - "$jar" <<\'PY\' || return 1\n',
              "forbidden-values Python guard",
          )
          runner = replace_once(
              runner,
              'print(json.dumps(sorted(value for value in values if value), separators=(",", ":")))\nPY\n}\n\nsecurity_zap_redact_stream() {',
              'print(json.dumps(sorted(value for value in values if value), separators=(",", ":")))\nPY\n  return 0\n}\n\nsecurity_zap_redact_stream() {',
              "forbidden-values return",
          )
          runner_path.write_text(runner, encoding="utf-8")
          PYTHON_SCRIPT

          bash -n scripts/security/test-zap-contract.sh
          bash -n scripts/security/zap-runner.sh
          git diff --check
          git diff -- src/AipPortal.Web/OpenApi/SecurityOpenApiOperationTransformer.cs scripts/security/test-zap-contract.sh scripts/security/zap-runner.sh

      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AipPortal.Web/OpenApi/SecurityOpenApiOperationTransformer.cs scripts/security/test-zap-contract.sh scripts/security/zap-runner.sh
          git commit -m "fix remaining Sonar findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
