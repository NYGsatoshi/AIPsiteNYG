<section class="announcement-list" aria-label="お知らせ一覧">
  @for (announcement of announcements; track announcement.id) {
    <button
      class="announcement-list__item"
      [class.announcement-list__item--selected]="announcement.id === selectedAnnouncementId"
      type="button"
      (click)="announcementSelected.emit(announcement.id)"
      data-testid="announcement-list-item"
    >
      <span class="announcement-list__title" data-testid="announcement-list-title">{{ announcement.title }}</span>
      <span class="announcement-list__meta">
        <span>{{ priorityLabels[announcement.priority] }}</span>
        <app-announcement-audience-preview [audienceScope]="announcement.audienceScope" />
        <span>{{ announcement.publicationState === 'draft' ? '下書き' : '公開' }}</span>
        <span>{{ announcement.publishedAtLabel }}</span>
      </span>
      <app-announcement-read-state [readState]="announcement.readState" />
    </button>
  }
</section>
