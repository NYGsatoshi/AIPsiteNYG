name: ANG22-08 final protected acceptance dispatch (one-shot)

on:
  push:
    branches:
      - chore/ang22-08-dispatch-acceptance
    paths:
      - .github/workflows/zz-ang22-08-final-dispatch-all.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify final candidate and dispatch protected acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 5975efd2c2aab941d678f618b2e1532735a29180
        run: |
          set -euo pipefail
          candidate_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/integration/angular-22-migration" --jq '.object.sha')"
          test "$candidate_sha" = "$EXPECTED_SHA"
          gh workflow run licensed-real-backend-acceptance.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref integration/angular-22-migration \
            -f suite=all
          echo "Dispatched final protected acceptance for ${candidate_sha}."
