name: Performance contract

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: performance-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: performance-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate helper syntax
        run: |
          python3 -m py_compile \
            scripts/ci/verify-performance-contract.py \
            scripts/ci/verify-performance-environment.py \
            scripts/performance/common.py \
            scripts/performance/preflight.py \
            scripts/performance/warmup.py \
            scripts/performance/collect-environment.py \
            scripts/performance/verify-samples.py \
            tests/ci/test_performance_contract.py \
            tests/ci/test_performance_environment.py
          bash -n scripts/performance/with-environment.sh

      - name: Test performance contract validators
        run: |
          python3 -m unittest discover -s tests/ci -p 'test_performance_contract.py'
          python3 -m unittest discover -s tests/ci -p 'test_performance_environment.py'

      - name: Validate versioned performance contract
        run: python3 scripts/ci/verify-performance-contract.py

      - name: Validate deterministic performance environment contract
        run: python3 scripts/ci/verify-performance-environment.py
