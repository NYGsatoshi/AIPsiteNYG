name: Issue336 Frontend Verify

on:
  push:
    branches: ["feat/336-authoritative-folder-move"]
    paths:
      - ".github/workflows/issue336-frontend-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Build and unit test Files frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/336-authoritative-folder-move

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Angular frontend dependencies
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Angular production build
        working-directory: frontend
        run: npm run build

      - name: Angular unit tests
        working-directory: frontend
        run: npm run test
