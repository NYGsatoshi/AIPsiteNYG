name: Diagnose remaining Sonar annotations

on:
  push:
    branches:
      - feat/sec06-zap-authenticated-dast-578
    paths:
      - .github/workflows/diagnose-sonar-pr720.yml

permissions:
  contents: read
  checks: read

jobs:
  annotations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read SonarCloud annotations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHECK_RUN_ID: "101928956883"
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/check-runs/${CHECK_RUN_ID}/annotations?per_page=100")"
          printf '%s\n' "$response" | jq -r '.[] | [.path, (.start_line|tostring), (.end_line|tostring), .annotation_level, .title, .message] | @tsv'
