name: NuGet Dependency Submission

# TEMPORARY CONTEST MODE: dependency submission is metadata publication, not a
# merge-safety gate. Keep it available manually while runner capacity is scarce.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuget-dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit-nuget:
    name: submit-nuget
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Prove runner routing
        shell: bash
        run: |
          set -euo pipefail
          echo "runner.name=${RUNNER_NAME}"
          echo "runner.os=${RUNNER_OS}"
          echo "runner.arch=${RUNNER_ARCH}"
          echo "runner.environment=${RUNNER_ENVIRONMENT}"
          if [[ "${RUNNER_ENVIRONMENT}" != "github-hosted" ]]; then
            echo "Unexpected runner environment: ${RUNNER_ENVIRONMENT}" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Submit NuGet dependency snapshot
        uses: advanced-security/component-detection-dependency-submission-action@b282c67b1008fde9b60da4bdfcd8849613e293b2 # v0.1.6
        with:
          filePath: '.'
          detectorsCategories: NuGet
          correlator: nuget-github-hosted
