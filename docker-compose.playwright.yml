# Optional CI-parity runner for local Angular screenshot verification.
# Do not approve Windows/macOS host-native screenshot baselines; use this Linux runner or GitHub Actions.
services:
  angular-playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    working_dir: /work
    environment:
      CI: "true"
      PLAYWRIGHT_SKIP_BUILD: "1"
      NPM_CI_ATTEMPTS: "2"
    volumes:
      - .:/work
      - playwright-root-node-modules:/work/node_modules
      - playwright-frontend-node-modules:/work/frontend/node_modules
      - playwright-npm-cache:/root/.npm
      - playwright-angular-cache:/work/frontend/.angular/cache
    command: >
      bash -lc "bash scripts/ci/npm-ci-retry.sh . &&
      bash scripts/ci/npm-ci-retry.sh frontend &&
      npm --prefix frontend run build &&
      npm run test:ui:angular"

volumes:
  playwright-root-node-modules:
  playwright-frontend-node-modules:
  playwright-npm-cache:
    external: true
    name: ${PLAYWRIGHT_NPM_CACHE_VOLUME:-aipsite-playwright-npm-cache-node24-v1}
  playwright-angular-cache:
    external: true
    name: ${PLAYWRIGHT_ANGULAR_CACHE_VOLUME:-aipsite-playwright-angular-cache-node24-v1}
