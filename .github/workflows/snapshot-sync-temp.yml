name: Temporary EF Snapshot Commit

on:
  pull_request:
    paths:
      - ".github/workflows/snapshot-sync-temp.yml"

permissions:
  contents: write

jobs:
  commit-snapshot:
    runs-on: self-hosted
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: aip_portal_snapshot
          POSTGRES_USER: aip_portal_snapshot
          POSTGRES_PASSWORD: aip_portal_snapshot
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U aip_portal_snapshot -d aip_portal_snapshot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Configure PostgreSQL connection
        shell: bash
        run: |
          postgres_port='${{ job.services.postgres.ports[5432] }}'
          test -n "$postgres_port"
          echo "ConnectionStrings__DefaultConnection=Host=localhost;Port=${postgres_port};Database=aip_portal_snapshot;Username=aip_portal_snapshot;Password=aip_portal_snapshot" >> "$GITHUB_ENV"

      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: task/v1-pr03c-task-detail-ui
          fetch-depth: 0

      - name: Configure persistent .NET caches
        shell: bash
        run: |
          bash scripts/ci/configure-persistent-caches.sh
          install_dir="$HOME/.dotnet-ci"
          job_temp="$RUNNER_TEMP/dotnet-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$install_dir" "$job_temp/home" "$job_temp/nuget/scratch"
          {
            echo "DOTNET_INSTALL_DIR=$install_dir"
            echo "DOTNET_CMD=$install_dir/dotnet"
            echo "DOTNET_ROOT=$install_dir"
            echo "DOTNET_CLI_HOME=$job_temp/home"
            echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
            echo "DOTNET_NOLOGO=1"
            echo "DOTNET_MULTILEVEL_LOOKUP=0"
            echo "NUGET_SCRATCH=$job_temp/nuget/scratch"
          } >> "$GITHUB_ENV"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        shell: bash
        run: |
          "$DOTNET_CMD" restore AipPortal.slnx --disable-parallel
          "$DOTNET_CMD" tool restore

      - name: Generate and commit model snapshot
        shell: bash
        run: |
          "$DOTNET_CMD" ef migrations add __SnapshotSync \
            --project src/AipPortal.Infrastructure \
            --startup-project src/AipPortal.Web \
            --configuration Release \
            --output-dir Persistence/Migrations
          find src/AipPortal.Infrastructure/Persistence/Migrations \
            -maxdepth 1 -type f -name '*__SnapshotSync*.cs' -delete
          git rm .github/workflows/snapshot-sync-temp.yml
          git add src/AipPortal.Infrastructure/Persistence/Migrations/AppDbContextModelSnapshot.cs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): sync EF model snapshot"
          git push origin HEAD:task/v1-pr03c-task-detail-ui
