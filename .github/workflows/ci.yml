name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request: # Required checks: intentionally unfiltered.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: CI change routing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce public-workflow trust boundary
        run: python3 scripts/ci/check-publication-readiness.py

      - name: Enforce required PR check topology
        run: python3 scripts/ci/check-required-pr-checks.py

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: aip_portal_ci
          POSTGRES_USER: aip_portal_ci
          POSTGRES_PASSWORD: aip_portal_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aip_portal_ci -d aip_portal_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASPNETCORE_ENVIRONMENT: Test
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "1"
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=aip_portal_ci;Username=aip_portal_ci;Password=aip_portal_ci_password
      POSTGRES_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=aip_portal_ci;Username=aip_portal_ci;Password=aip_portal_ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AipPortal.slnx --disable-parallel --verbosity normal

      - name: Build
        run: dotnet build AipPortal.slnx --configuration Release --no-restore --disable-build-servers -m:1

      - name: Verify deterministic OpenAPI 3.1 generation
        shell: bash
        env:
          # Build-time contract generation must be read-only. Point database
          # access at an unreachable port so any accidental startup query fails.
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=1;Database=sec01_openapi;Username=unused;Password=unused;Timeout=1;Command Timeout=1
          Tenancy__AppMode: SaaS
          Tenancy__SeedOnStartup: "false"
          UiShell__SeedOnStartup: "false"
          BrowserSmokeSeed__Enabled: "false"
          AIP_BROWSER_SMOKE_SEED_ENABLED: "false"
          DemoDataset__Enabled: "false"
          AIP_DEMO_DATASET_ENABLED: "false"
          AIP_SEED_ADMIN_ENABLED: "false"
          AIP_BOOTSTRAP_ADMIN_EMAIL: ""
          BootstrapAdmin__Email: ""
        run: |
          set -euo pipefail
          spec="artifacts/openapi/aipportal-openapi.json"
          first="${RUNNER_TEMP}/aipportal-openapi.first.json"

          generate_openapi() {
            dotnet build src/AipPortal.Web/AipPortal.Web.csproj \
              --configuration Release \
              --no-restore \
              --no-incremental \
              --disable-build-servers \
              -m:1 \
              -p:GenerateSecurityOpenApiContract=true
          }

          rm -f "$spec"
          generate_openapi
          python3 scripts/ci/verify-openapi.py "$spec"
          cp "$spec" "$first"

          rm "$spec"
          generate_openapi
          python3 scripts/ci/verify-openapi.py "$spec"
          if ! cmp --silent "$first" "$spec"; then
            echo "SEC-01 OpenAPI output is not deterministic across repeated builds." >&2
            diff -u "$first" "$spec" || true
            exit 1
          fi

      - name: Upload OpenAPI 3.1 contract
        uses: actions/upload-artifact@v7
        with:
          name: openapi-3.1-contract
          path: artifacts/openapi/aipportal-openapi.json
          if-no-files-found: error
          retention-days: 7

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Apply PostgreSQL migrations
        run: dotnet ef database update --project src/AipPortal.Infrastructure --startup-project src/AipPortal.Web --configuration Release --no-build

      - name: Reject pending EF Core model changes
        run: dotnet ef migrations has-pending-model-changes --project src/AipPortal.Infrastructure --startup-project src/AipPortal.Web --configuration Release --no-build

      - name: Test
        run: >-
          dotnet test AipPortal.slnx
          --configuration Release
          --no-build
          --disable-build-servers
          -m:1
          --verbosity normal
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory artifacts/test-results

      - name: Upload backend results on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 7

  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Validate MVP-A CI helper syntax
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/ci/verify-mvp-a-required-a11y-tests.py \
            scripts/ci/verify-mvp-a-final-checks.py
          bash -n scripts/ci/mvp-a-authz-boundary-acceptance.sh
          bash -n scripts/ci/run-mvp-a-authz-boundary-acceptance.sh
          python3 - <<'PY'
          from pathlib import Path

          source = Path("scripts/ci/mvp-a-authz-boundary-acceptance.sh").read_text(encoding="utf-8")
          start_marker = "node --input-type=module <<'NODE'\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.rindex("\nNODE\n")
          Path("/tmp/mvp-a-authz-boundary-acceptance.mjs").write_text(
              source[start:end], encoding="utf-8"
          )
          PY
          node --check /tmp/mvp-a-authz-boundary-acceptance.mjs

      - name: Verify MVP-A accessibility coverage contract
        run: python3 scripts/ci/verify-mvp-a-required-a11y-tests.py

      - name: Install UI runner dependencies
        run: npm ci

      - name: Install Angular dependencies
        run: npm --prefix frontend ci

      - name: Build Angular production bundle without repository secrets
        run: npm --prefix frontend run build

      - name: Run Angular unit tests
        run: npm --prefix frontend test

      - name: Validate frontend architecture
        run: |
          npm --prefix frontend run check:architecture
          npm --prefix frontend run test:architecture
          npm --prefix frontend run test:syncfusion-license

      - name: Build Storybook
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm --prefix frontend run build-storybook

      - name: Run Angular Playwright smoke in Docker
        run: npm run test:ui:angular:docker

      - name: Upload browser artifacts on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ui-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      POSTGRES_DB: aip_portal
      POSTGRES_USER: aip_portal
      POSTGRES_PASSWORD: ci_dummy_password
      DB_PASSWORD: ci_dummy_password
      LOCAL_ADMIN_PASSWORD: ci_dummy_local_admin_password
      AIP_SECURITY_CI_PASSWORD: ci_dummy_security_fixture_password

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AipPortal.slnx --disable-parallel --verbosity normal

      - name: Reject vulnerable NuGet packages
        shell: bash
        run: |
          set +e
          dotnet list AipPortal.slnx package --vulnerable --include-transitive > dotnet-vulnerable-packages.txt 2>&1
          status=$?
          set -e
          cat dotnet-vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" dotnet-vulnerable-packages.txt; then
            exit 1
          fi
          exit "$status"

      - name: Validate Compose files
        shell: bash
        run: |
          docker compose -f docker-compose.db.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.playwright.yml config --quiet
          docker compose -p aipsite-real-backend-smoke-ci-config -f docker-compose.real-backend-smoke.yml config --quiet
          docker compose -p aipsite-security-ci-config -f docker-compose.real-backend-smoke.yml -f docker-compose.security.yml config --format json | python3 scripts/ci/verify-security-compose.py
          docker compose -p aipsite-u22-demo-ci-config -f docker-compose.real-backend-smoke.yml -f docker-compose.u22-demo.yml config --quiet
          docker compose config --quiet
          docker compose -f docker-compose.local.yml config --quiet
          docker compose -f docker-compose.onprem.yml config --quiet
          docker compose -f docker-compose.onprem.yml -f docker-compose.onprem.ci.yml config --quiet
          docker compose -p deploy -f deploy/sakura/docker-compose.yml config --quiet
          bash scripts/ci/verify-onprem-proxy-topology.sh

      - name: Scan repository filesystem with Trivy
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            aquasec/trivy:0.65.0 \
            fs --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table --output /repo/trivy-filesystem-report.txt \
            /repo
          status=$?
          set -e
          cat trivy-filesystem-report.txt
          exit "$status"

      - name: Scan full reachable Git history with Gitleaks
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --redact --verbose \
            --report-format json \
            --report-path /repo/gitleaks-report.json
          status=$?
          set -e
          [[ -f gitleaks-report.json ]] || printf '[]\n' > gitleaks-report.json
          exit "$status"

      - name: Upload security reports on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-reports
          path: |
            dotnet-vulnerable-packages.txt
            trivy-filesystem-report.txt
            gitleaks-report.json
          if-no-files-found: warn
          retention-days: 7
