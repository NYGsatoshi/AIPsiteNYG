name: MBJ-02 Invite Onboarding Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/mbj02-invite-onboarding.yml"
      - "docker-compose.mbj02-invite.yml"
      - "docker-compose.real-backend-smoke.yml"
      - "Dockerfile"
      - "Dockerfile.playwright"
      - "AipPortal.slnx"
      - "global.json"
      - "Directory.Build.*"
      - "Directory.Packages.*"
      - "NuGet.config"
      - "package.json"
      - "package-lock.json"
      - "frontend/**"
      - "src/**"
      - "scripts/ci/run-mbj02-invite-acceptance.sh"
      - "scripts/ci/verify-npm-lockfile.mjs"
      - "tests/ui/mbj02-invite-acceptance.mjs"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mbj02-invite-onboarding.yml"
      - "docker-compose.mbj02-invite.yml"
      - "docker-compose.real-backend-smoke.yml"
      - "Dockerfile"
      - "Dockerfile.playwright"
      - "AipPortal.slnx"
      - "global.json"
      - "Directory.Build.*"
      - "Directory.Packages.*"
      - "NuGet.config"
      - "package.json"
      - "package-lock.json"
      - "frontend/**"
      - "src/**"
      - "scripts/ci/run-mbj02-invite-acceptance.sh"
      - "scripts/ci/verify-npm-lockfile.mjs"
      - "tests/ui/mbj02-invite-acceptance.mjs"

permissions:
  contents: read

jobs:
  mbj02-invite-onboarding:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 45
    concurrency:
      group: mbj02-invite-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate acceptance runner syntax
        shell: bash
        run: |
          bash -n scripts/ci/run-mbj02-invite-acceptance.sh
          node --check tests/ui/mbj02-invite-acceptance.mjs

      - name: Run MBJ-02 administrator invite onboarding acceptance
        env:
          SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
        shell: bash
        run: |
          test -n "${SYNCFUSION_LICENSE:-}" || {
            echo "SYNCFUSION_LICENSE is not configured." >&2
            exit 1
          }
          bash scripts/ci/run-mbj02-invite-acceptance.sh

      - name: Upload MBJ-02 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mbj02-invite-onboarding-evidence
          path: test-results/mbj02-*
          if-no-files-found: ignore

      - name: Report runner resources on failure
        if: failure()
        shell: bash
        run: |
          df -h || true
          df -i || true
          free -h || true
          docker system df || true
