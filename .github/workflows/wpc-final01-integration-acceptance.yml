name: WPC-Final01 Canonical Completion

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/wpc-final01-integration-acceptance.yml"
      - "scripts/ci/verify-wpc-final01-results.sh"
      - "scripts/ci/wpc02a-required-tests.txt"
      - "scripts/ci/wpc02b-required-tests.txt"
      - "scripts/ci/wpc02c-required-tests.txt"
      - "scripts/ci/wpc02d-required-tests.txt"
      - "scripts/ci/wpc02e-required-tests.txt"
      - "scripts/ci/wpc02f-required-tests.txt"
      - "scripts/ci/wpc-final01-required-tests.txt"
      - "src/**"
      - "tests/AipPortal.Tests/**"
      - "frontend/src/app/shared/right-panel/**"
      - "frontend/src/app/features/artifacts/**"
      - "frontend/src/app/app.routes.ts"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "AipPortal.slnx"
      - "Directory.Build.*"
      - "Directory.Packages.*"
      - "global.json"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/wpc-final01-integration-acceptance.yml"
      - "scripts/ci/verify-wpc-final01-results.sh"
      - "scripts/ci/wpc02a-required-tests.txt"
      - "scripts/ci/wpc02b-required-tests.txt"
      - "scripts/ci/wpc02c-required-tests.txt"
      - "scripts/ci/wpc02d-required-tests.txt"
      - "scripts/ci/wpc02e-required-tests.txt"
      - "scripts/ci/wpc02f-required-tests.txt"
      - "scripts/ci/wpc-final01-required-tests.txt"
      - "src/**"
      - "tests/AipPortal.Tests/**"
      - "frontend/src/app/shared/right-panel/**"
      - "frontend/src/app/features/artifacts/**"
      - "frontend/src/app/app.routes.ts"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "AipPortal.slnx"
      - "Directory.Build.*"
      - "Directory.Packages.*"
      - "global.json"

concurrency:
  group: wpc-final01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fixture-repair:
    name: One-shot Final01 fixture repair
    if: github.event_name == 'pull_request' && github.head_ref == 'wpc-final03-security-no-go'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout PR branch with write credentials
        uses: actions/checkout@v7
        with:
          ref: wpc-final03-security-no-go
          fetch-depth: 0
          persist-credentials: true

      - name: Patch non-operational Final01 fixture graph
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/AipPortal.Tests/PostgreSql/WpcFinal01CanonicalCompletionPostgreSqlTests.cs")
          text = path.read_text()
          old = '''        var task = new TaskItem
        {
            TenantId = authority.TenantId,
            WorkspaceId = authority.WorkspaceId,
            ProjectId = project.Id,
            Title = $"Final01 Task {suffix}",
            Status = TaskItemStatus.NotStarted,
            Priority = TaskPriority.Medium,
            VersionNo = 1,
            CreatedByUserId = authority.OwnerUserId
        };
        var notification = new Notification
        {
            TenantId = authority.TenantId,
            UserId = authority.ReaderUserId,
            NotificationType = NotificationType.TaskAssigned,
            Title = "Task assigned",
            RelatedEntityType = "Task",
            RelatedEntityId = task.Id,
            CreatedAt = Now,
            StateVersion = 1
        };
        db.AddRange(task, notification);
        await db.SaveChangesAsync();

        return new ProjectGraph(
            authority.TenantId,
            authority.TenantSlug,
            authority.WorkspaceId,
            project.Id,
            task.Id,
            notification.Id,
            general?.Id ?? Guid.Empty,
            authority.OwnerUserId,
            authority.ReaderUserId,
            authority.CandidateUserId);'''
          new = '''        var taskId = Guid.Empty;
        var taskNotificationId = Guid.Empty;
        var operationalProject =
            activationState == ProjectActivationState.Activated &&
            status is ProjectStatus.Active or ProjectStatus.Review;
        if (operationalProject)
        {
            var task = new TaskItem
            {
                TenantId = authority.TenantId,
                WorkspaceId = authority.WorkspaceId,
                ProjectId = project.Id,
                Title = $"Final01 Task {suffix}",
                Status = TaskItemStatus.NotStarted,
                Priority = TaskPriority.Medium,
                VersionNo = 1,
                CreatedByUserId = authority.OwnerUserId
            };
            var notification = new Notification
            {
                TenantId = authority.TenantId,
                UserId = authority.ReaderUserId,
                NotificationType = NotificationType.TaskAssigned,
                Title = "Task assigned",
                RelatedEntityType = "Task",
                RelatedEntityId = task.Id,
                CreatedAt = Now,
                StateVersion = 1
            };
            db.AddRange(task, notification);
            taskId = task.Id;
            taskNotificationId = notification.Id;
        }
        await db.SaveChangesAsync();

        return new ProjectGraph(
            authority.TenantId,
            authority.TenantSlug,
            authority.WorkspaceId,
            project.Id,
            taskId,
            taskNotificationId,
            general?.Id ?? Guid.Empty,
            authority.OwnerUserId,
            authority.ReaderUserId,
            authority.CandidateUserId);'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one Final01 task fixture block, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit fixture repair and remove temporary workflow changes
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/wpc-final01-integration-acceptance.yml
          git rm -f .github/workflows/wpc-final01-fixture-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/AipPortal.Tests/PostgreSql/WpcFinal01CanonicalCompletionPostgreSqlTests.cs \
            .github/workflows/wpc-final01-integration-acceptance.yml
          git commit -m "fix: align Final01 fixtures with operational child fence"
          git push origin HEAD:wpc-final03-security-no-go

  canonical-completion:
    name: WPC-Final01 / PostgreSQL 18 + Angular
    runs-on: self-hosted
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: aip_portal_wpc_final01
          POSTGRES_USER: aip_portal_wpc_final01
          POSTGRES_PASSWORD: aip_portal_wpc_final01_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U aip_portal_wpc_final01 -d aip_portal_wpc_final01"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASPNETCORE_ENVIRONMENT: Test
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Configure PostgreSQL connection
        shell: bash
        run: |
          postgres_port='${{ job.services.postgres.ports[5432] }}'
          test -n "$postgres_port"
          {
            echo "ConnectionStrings__DefaultConnection=Host=localhost;Port=${postgres_port};Database=aip_portal_wpc_final01;Username=aip_portal_wpc_final01;Password=aip_portal_wpc_final01_password"
            echo "POSTGRES_TEST_CONNECTION_STRING=Host=localhost;Port=${postgres_port};Database=aip_portal_wpc_final01;Username=aip_portal_wpc_final01;Password=aip_portal_wpc_final01_password"
          } >> "$GITHUB_ENV"

      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure persistent .NET caches
        shell: bash
        run: |
          bash scripts/ci/configure-persistent-caches.sh
          install_dir="$HOME/.dotnet-ci"
          job_temp="$RUNNER_TEMP/dotnet-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p \
            "$install_dir" \
            "$job_temp/home" \
            "$job_temp/nuget/scratch" \
            "$GITHUB_WORKSPACE/artifacts/wpc-final01/backend" \
            "$GITHUB_WORKSPACE/artifacts/wpc-final01/frontend"
          {
            echo "DOTNET_INSTALL_DIR=$install_dir"
            echo "DOTNET_CMD=$install_dir/dotnet"
            echo "DOTNET_ROOT=$install_dir"
            echo "DOTNET_CLI_HOME=$job_temp/home"
            echo "DOTNET_MULTILEVEL_LOOKUP=0"
            echo "DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE=1"
            echo "NUGET_SCRATCH=$job_temp/nuget/scratch"
          } >> "$GITHUB_ENV"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        shell: bash
        run: |
          log="$GITHUB_WORKSPACE/artifacts/wpc-final01/backend/dotnet-restore.log"
          set +e
          "$DOTNET_CMD" restore AipPortal.slnx \
            --disable-parallel \
            --disable-build-servers \
            --verbosity normal 2>&1 | tee "$log"
          restore_status=${PIPESTATUS[0]}
          set -e
          exit "$restore_status"

      - name: Build
        run: >-
          "$DOTNET_CMD" build AipPortal.slnx
          --configuration Release
          --no-restore
          --disable-build-servers
          -m:1

      - name: Restore .NET tools
        run: '"$DOTNET_CMD" tool restore'

      - name: Apply PostgreSQL migrations
        run: >-
          "$DOTNET_CMD" ef database update
          --project src/AipPortal.Infrastructure
          --startup-project src/AipPortal.Web
          --configuration Release

      - name: Verify EF Core model has no pending changes
        run: >-
          "$DOTNET_CMD" ef migrations has-pending-model-changes
          --project src/AipPortal.Infrastructure
          --startup-project src/AipPortal.Web
          --configuration Release
          --no-build

      - name: Run WPC-Final01 backend acceptance
        shell: bash
        run: |
          "$DOTNET_CMD" test \
            tests/AipPortal.Tests/AipPortal.Tests.csproj \
            --configuration Release \
            --no-build \
            --disable-build-servers \
            -m:1 \
            --verbosity normal \
            --filter "Scope=WPC02A|Scope=WPC02B|Scope=WPC02C|Scope=WPC02D|Scope=WPC02E|Scope=WPC02F|Scope=WPCFINAL01|FullyQualifiedName~Wpc02AWorkspaceAuthorizationTests|FullyQualifiedName~CanonicalRedactionServiceTests" \
            --logger "trx;LogFileName=wpc-final01-acceptance.trx" \
            --results-directory artifacts/wpc-final01/backend

      - name: Verify WPC-DEC-026 through WPC-DEC-034 evidence
        shell: bash
        run: |
          bash scripts/ci/verify-wpc-final01-results.sh \
            artifacts/wpc-final01/backend/wpc-final01-acceptance.trx

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Configure persistent npm and Angular caches
        env:
          CI_ENABLE_ANGULAR_CACHE: "1"
        shell: bash
        run: bash scripts/ci/configure-persistent-caches.sh

      - name: Install Angular frontend dependencies
        shell: bash
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Run WPC-Final01 frontend acceptance
        shell: bash
        run: |
          set -o pipefail
          test -f frontend/src/app/shared/right-panel/wpc-02f-notification-navigation.spec.ts
          npm --prefix frontend run test 2>&1 | \
            tee artifacts/wpc-final01/frontend/angular-unit-tests.log

      - name: Upload WPC-Final01 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wpc-final01-canonical-completion-evidence
          path: artifacts/wpc-final01
          if-no-files-found: warn
          retention-days: 30

      - name: PostgreSQL logs on failure
        if: failure()
        shell: bash
        run: |
          postgres_id='${{ job.services.postgres.id }}'
          if [[ -n "$postgres_id" ]]; then
            docker logs "$postgres_id"
          else
            echo "PostgreSQL service container ID is unavailable."
          fi

      - name: Report host resources on failure
        if: failure()
        shell: bash
        run: |
          du -sh "$HOME/.nuget/packages" "$HOME/.npm" "$HOME/.cache/aipsite-ci" 2>/dev/null || true
          df -h || true
          df -i || true
          free -h || true
          docker system df || true

      - name: Repair final workspace ownership
        if: always()
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"
