name: Code Quality

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  qodana-dotnet-community:
    name: Qodana Community / .NET
    runs-on: self-hosted
    timeout-minutes: 120

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      QODANA_FRONTEND_REQUIRED: "false"
      QODANA_RESULTS_DIR: ${{ runner.temp }}/qodana/results-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Configure persistent .NET caches
        shell: bash
        run: bash scripts/ci/configure-persistent-caches.sh

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run all registered Qodana Community inspections
        uses: JetBrains/qodana-action@v2026.1
        with:
          args: |
            --image jetbrains/qodana-cdnet:2026.1-eap-privileged
            --solution AipPortal.slnx
            --configuration Release
          pr-mode: false
          results-dir: ${{ env.QODANA_RESULTS_DIR }}
          use-caches: false
          post-pr-comment: true
          use-annotations: true
          upload-result: true
          push-fixes: none

      - name: Repair Qodana workspace ownership
        if: always()
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Set up Node.js for project-model guard
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Guard Qodana project model
        if: always()
        env:
          QODANA_PROJECT_MODEL_SUMMARY_PATH: ${{ runner.temp }}/qodana/project-model-summary.json
        shell: bash
        run: |
          sarif="${QODANA_RESULTS_DIR}/qodana.sarif.json"
          if [[ ! -f "$sarif" ]]; then
            echo "::warning::Qodana SARIF was not produced; skipping the secondary project-model guard."
            exit 0
          fi
          node scripts/quality/check-qodana-project-model.mjs "$sarif"

      - name: Upload Qodana project-model summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qodana-project-model-summary
          path: ${{ runner.temp }}/qodana/project-model-summary.json
          if-no-files-found: ignore

  frontend-quality:
    name: Angular / TypeScript / JavaScript / HTML / SCSS / CSS
    runs-on: self-hosted
    needs: qodana-dotnet-community
    timeout-minutes: 90
    concurrency:
      group: aipsite-self-hosted-frontend-heavy
      cancel-in-progress: false

    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure persistent npm and Angular caches
        env:
          CI_ENABLE_ANGULAR_CACHE: "1"
        shell: bash
        run: bash scripts/ci/configure-persistent-caches.sh

      - name: Report Node toolchain
        run: |
          node --version
          npm --version

      - name: Install repository test dependencies
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Install Angular dependencies
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Install inspection toolchain
        shell: bash
        run: |
          for attempt in 1 2; do
            set +e
            npm --prefix tools/frontend-inspections install --prefer-offline --ignore-scripts --no-audit --no-fund
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if [[ "$attempt" -eq 2 ]]; then
              exit "$status"
            fi
            df -h || true
            df -i || true
            free -h || true
            sleep 10
          done

      - name: Run complete frontend inspection inventory
        shell: bash
        run: |
          mkdir -p artifacts/frontend-inspections
          printf '{"status":"inspection-started","workflow":"code-quality"}\n' > artifacts/frontend-inspections/ci-manifest.json
          npm run lint:frontend

      - name: Upload frontend inspection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-inspection-reports
          path: artifacts/frontend-inspections
          if-no-files-found: warn
          retention-days: 14

      - name: Validate TypeScript types
        working-directory: frontend
        run: ./node_modules/.bin/tsc --noEmit --project tsconfig.app.json

      - name: Validate Angular templates and styles
        run: npm --prefix frontend run build

      - name: Run Angular unit tests
        run: npm --prefix frontend test

      - name: Report cache and host resources on failure
        if: failure()
        shell: bash
        run: |
          du -sh "$HOME/.npm" "$HOME/.nuget/packages" "$HOME/.cache/aipsite-ci" 2>/dev/null || true
          df -h || true
          df -i || true
          free -h || true
          docker system df || true
