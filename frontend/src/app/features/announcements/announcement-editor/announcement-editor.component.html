<form class="announcement-editor" [formGroup]="form" data-testid="announcement-editor">
  <header>
    <p>下書き</p>
    <h2>新しいお知らせ</h2>
  </header>

  <label>
    <span>タイトル</span>
    <input type="text" formControlName="title" data-testid="announcement-editor-title" />
  </label>

  <label>
    <span>本文</span>
    <textarea rows="7" formControlName="body" data-testid="announcement-editor-body"></textarea>
  </label>

  <div class="announcement-editor__row">
    <label>
      <span>優先度</span>
      <select formControlName="priority" data-testid="announcement-editor-priority" aria-describedby="announcement-priority-help">
        @for (priority of priorityOptions; track priority) {
          <option [value]="priority">{{ priorityLabels[priority] }}</option>
        }
      </select>
      <small id="announcement-priority-help">
        CRITICAL は障害・セキュリティ・期限付き必須対応など、直ちに確認が必要な場合に限定してください。
      </small>
    </label>

    <label>
      <span>対象</span>
      <select formControlName="audienceScope" data-testid="announcement-editor-audience">
        @for (audience of audienceOptions; track audience) {
          <option [value]="audience">{{ audienceLabels[audience] }}</option>
        }
      </select>
    </label>
  </div>

  <label class="announcement-editor__check">
    <input type="checkbox" formControlName="requiresReadConfirmation" />
    <span>既読確認</span>
  </label>

  <div class="announcement-editor__actions">
    <button type="button">下書き保存</button>
    <button type="button" class="announcement-editor__primary">公開</button>
  </div>
</form>
