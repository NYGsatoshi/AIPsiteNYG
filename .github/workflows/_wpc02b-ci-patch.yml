name: Apply WPC-02B CI wiring

on:
  push:
    branches:
      - wpc-02b-capabilitygrant-workspace-general

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: wpc-02b-capabilitygrant-workspace-general
          fetch-depth: 0

      - name: Patch canonical CI workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()

          old_dirs = '''            "$GITHUB_WORKSPACE/artifacts/task-pr07c-test-results" \\
            "$GITHUB_WORKSPACE/artifacts/task-pr07d-test-results"'''
          new_dirs = '''            "$GITHUB_WORKSPACE/artifacts/task-pr07c-test-results" \\
            "$GITHUB_WORKSPACE/artifacts/task-pr07d-test-results" \\
            "$GITHUB_WORKSPACE/artifacts/wpc02b-test-results"'''
          if text.count(old_dirs) != 1:
              raise SystemExit(f'expected exactly one artifact directory anchor, found {text.count(old_dirs)}')
          text = text.replace(old_dirs, new_dirs, 1)

          anchor = '''      - name: Run TASK-V1-PR07-B acceptance tests
'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected exactly one TASK-V1-PR07-B anchor, found {text.count(anchor)}')

          wpc02b = '''      - name: Run WPC-02B PostgreSQL acceptance tests
        shell: bash
        run: |
          "$DOTNET_CMD" test \\
            tests/AipPortal.Tests/AipPortal.Tests.csproj \\
            --configuration Release \\
            --no-build \\
            --disable-build-servers \\
            -m:1 \\
            --verbosity normal \\
            --filter "Scope=WPC02B" \\
            --logger "trx;LogFileName=wpc02b-acceptance.trx" \\
            --results-directory artifacts/wpc02b-test-results

      - name: Verify WPC-02B acceptance results
        shell: bash
        run: |
          bash scripts/ci/verify-trx-results.sh \\
            artifacts/wpc02b-test-results/wpc02b-acceptance.trx \\
            --minimum-total 4 \\
            --required-tests scripts/ci/wpc02b-required-tests.txt \\
            --label "WPC-02B PostgreSQL"

      - name: Upload WPC-02B acceptance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wpc02b-acceptance-test-results
          path: artifacts/wpc02b-test-results
          if-no-files-found: error

'''
          text = text.replace(anchor, wpc02b + anchor, 1)
          path.write_text(text)
          PY

          rm .github/workflows/_wpc02b-ci-patch.yml

          git diff --check
          git diff -- .github/workflows/ci.yml
          git status --short

      - name: Commit CI wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/_wpc02b-ci-patch.yml
          git commit -m "CI: wire WPC-02B required acceptance"
          git push origin HEAD:wpc-02b-capabilitygrant-workspace-general
