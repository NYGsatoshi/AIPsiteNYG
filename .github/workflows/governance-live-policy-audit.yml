name: Governance live policy audit

on:
  push:
    branches: ["main"]
  branch_protection_rule:
    types: [created, edited, deleted]
  schedule:
    - cron: "17 * * * *" # hourly fallback; ruleset edits do not provide a reliable PR-local signal
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-live-policy-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    name: governance-live-policy-audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Reconcile trusted default-branch policy with live GitHub state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/$REPOSITORY" --jq '.default_branch')"
          target_sha="$(gh api "repos/$REPOSITORY/branches/$default_branch" --jq '.commit.sha')"
          trusted_base="$RUNNER_TEMP/evaluate-governance-live-policy.py"
          trusted_evaluator="$RUNNER_TEMP/evaluate-governance-live-policy-ext.py"
          trusted_fetcher="$RUNNER_TEMP/fetch-governance-live-state.sh"
          trusted_policy="$RUNNER_TEMP/governance-policy.json"
          live_state_file="$RUNNER_TEMP/governance-live-state.json"
          report_file="$RUNNER_TEMP/governance-live-policy-report.json"

          gh api --method GET -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPOSITORY/contents/scripts/ci/evaluate-governance-live-policy.py" \
            -f "ref=$default_branch" > "$trusted_base"
          gh api --method GET -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPOSITORY/contents/scripts/ci/evaluate-governance-live-policy-ext.py" \
            -f "ref=$default_branch" > "$trusted_evaluator"
          gh api --method GET -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPOSITORY/contents/scripts/ci/fetch-governance-live-state.sh" \
            -f "ref=$default_branch" > "$trusted_fetcher"
          gh api --method GET -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPOSITORY/contents/governance/policy.json" \
            -f "ref=$default_branch" > "$trusted_policy"

          chmod 700 "$trusted_fetcher"
          "$trusted_fetcher" "$REPOSITORY" "$live_state_file"

          set +e
          python3 "$trusted_evaluator" \
            --policy "$trusted_policy" \
            --live-state "$live_state_file" \
            --target-sha "$target_sha" \
            --output "$report_file"
          result=$?
          set -e

          if [[ ! -f "$report_file" ]]; then
            echo "GOV-02 evaluator did not produce its machine-readable report." >&2
            exit 1
          fi

          report_status="$(jq -r '.status // "FAIL"' "$report_file")"
          snapshot_hash="$(jq -r '.snapshot_sha256 // "unavailable"' "$report_file")"
          finding_count="$(jq -r '.findings | length' "$report_file")"
          classic_observable="$(jq -r '.snapshot.classic_branch_protection.observable // false' "$report_file")"
          classic_configured="$(jq -r '.snapshot.classic_branch_protection.configured // "unknown"' "$report_file")"

          {
            echo "### Governance live-policy audit"
            echo
            echo "- target default-branch SHA: \`$target_sha\`"
            echo "- result: \`$report_status\`"
            echo "- normalized snapshot SHA-256: \`$snapshot_hash\`"
            echo "- findings: \`$finding_count\`"
            echo "- classic branch protection observable: \`$classic_observable\`"
            echo "- classic branch protection configured: \`$classic_configured\`"
            echo
            echo '```json'
            jq '{status, controls, findings, observations}' "$report_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$result" -ne 0 || "$report_status" != "PASS" ]]; then
            echo "Governance live-policy drift or unknown state detected." >&2
            exit 1
          fi
