name: MBJ-03 Session Lifecycle Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/mbj03-session-lifecycle.yml"
      - "docker-compose.mbj03-session.yml"
      - "docker-compose.real-backend-smoke.yml"
      - "Dockerfile"
      - "Dockerfile.playwright"
      - "AipPortal.slnx"
      - "global.json"
      - "Directory.Build.*"
      - "Directory.Packages.*"
      - "NuGet.config"
      - "package.json"
      - "package-lock.json"
      - "src/**/*.csproj"
      - "src/AipPortal.Application/Admin/**"
      - "src/AipPortal.Application/Auth/**"
      - "src/AipPortal.Application/Common/**"
      - "src/AipPortal.Application/DependencyInjection.cs"
      - "src/AipPortal.Application/Realtime/**"
      - "src/AipPortal.Application/Security/**"
      - "src/AipPortal.Application/Tenancy/**"
      - "src/AipPortal.Application/Workspaces/**"
      - "src/AipPortal.Domain/Common/**"
      - "src/AipPortal.Domain/Entities/IdentityEntities.cs"
      - "src/AipPortal.Domain/Entities/ProductionEntities.cs"
      - "src/AipPortal.Domain/Enums/**"
      - "src/AipPortal.Infrastructure/DependencyInjection.cs"
      - "src/AipPortal.Infrastructure/Persistence/**"
      - "src/AipPortal.Infrastructure/Security/**"
      - "src/AipPortal.Web/Controllers/AdminController.cs"
      - "src/AipPortal.Web/Controllers/AuthController.cs"
      - "src/AipPortal.Web/Controllers/InvitesController.cs"
      - "src/AipPortal.Web/Controllers/SecurityController.cs"
      - "src/AipPortal.Web/Hubs/**"
      - "src/AipPortal.Web/Program.cs"
      - "src/AipPortal.Web/Security/**"
      - "src/AipPortal.Web/Tenancy/**"
      - "src/AipPortal.Web/appsettings*.json"
      - "scripts/ci/route-acceptance-changes.sh"
      - "scripts/ci/run-mbj03-session-acceptance.sh"
      - "scripts/ci/verify-npm-lockfile.mjs"
      - "tests/ui/mbj03-session-acceptance.mjs"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mbj03-session-lifecycle.yml"
      - "docker-compose.mbj03-session.yml"
      - "docker-compose.real-backend-smoke.yml"
      - "Dockerfile"
      - "Dockerfile.playwright"
      - "AipPortal.slnx"
      - "global.json"
      - "Directory.Build.*"
      - "Directory.Packages.*"
      - "NuGet.config"
      - "package.json"
      - "package-lock.json"
      - "src/**/*.csproj"
      - "src/AipPortal.Application/Admin/**"
      - "src/AipPortal.Application/Auth/**"
      - "src/AipPortal.Application/Common/**"
      - "src/AipPortal.Application/DependencyInjection.cs"
      - "src/AipPortal.Application/Realtime/**"
      - "src/AipPortal.Application/Security/**"
      - "src/AipPortal.Application/Tenancy/**"
      - "src/AipPortal.Application/Workspaces/**"
      - "src/AipPortal.Domain/Common/**"
      - "src/AipPortal.Domain/Entities/IdentityEntities.cs"
      - "src/AipPortal.Domain/Entities/ProductionEntities.cs"
      - "src/AipPortal.Domain/Enums/**"
      - "src/AipPortal.Infrastructure/DependencyInjection.cs"
      - "src/AipPortal.Infrastructure/Persistence/**"
      - "src/AipPortal.Infrastructure/Security/**"
      - "src/AipPortal.Web/Controllers/AdminController.cs"
      - "src/AipPortal.Web/Controllers/AuthController.cs"
      - "src/AipPortal.Web/Controllers/InvitesController.cs"
      - "src/AipPortal.Web/Controllers/SecurityController.cs"
      - "src/AipPortal.Web/Hubs/**"
      - "src/AipPortal.Web/Program.cs"
      - "src/AipPortal.Web/Security/**"
      - "src/AipPortal.Web/Tenancy/**"
      - "src/AipPortal.Web/appsettings*.json"
      - "scripts/ci/route-acceptance-changes.sh"
      - "scripts/ci/run-mbj03-session-acceptance.sh"
      - "scripts/ci/verify-npm-lockfile.mjs"
      - "tests/ui/mbj03-session-acceptance.mjs"

permissions:
  contents: read

jobs:
  changes:
    name: MBJ-03 change routing
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      run: ${{ steps.route.outputs.run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Route MBJ-03 acceptance by changed content
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/route-acceptance-changes.sh mbj03

  mbj03-session-lifecycle:
    needs: changes
    if: needs.changes.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 45
    concurrency:
      group: mbj03-session-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate acceptance runner syntax
        shell: bash
        run: |
          bash -n scripts/ci/run-mbj03-session-acceptance.sh
          node --check tests/ui/mbj03-session-acceptance.mjs

      - name: Prune unused Docker networks
        shell: bash
        run: docker network prune --force

      - name: Run MBJ-03 session lifecycle acceptance
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
        shell: bash
        run: |
          test -n "${SYNCFUSION_LICENSE:-}" || {
            echo "SYNCFUSION_LICENSE is not configured." >&2
            exit 1
          }
          bash scripts/ci/run-mbj03-session-acceptance.sh

      - name: Validate Dependabot no-secret acceptance boundary
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        shell: bash
        run: |
          echo "Protected Syncfusion license is unavailable to Dependabot by design; licensed MBJ-03 acceptance is not executed in this trust context."
          docker compose -p aipsite-dependabot-mbj03 -f docker-compose.real-backend-smoke.yml config --quiet

      - name: Upload MBJ-03 evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mbj03-session-lifecycle-evidence
          path: test-results/mbj03-*
          if-no-files-found: ignore

      - name: Report runner resources on failure
        if: failure()
        shell: bash
        run: |
          df -h || true
          df -i || true
          free -h || true
          docker system df || true

      - name: Repair final workspace ownership
        if: always()
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"
