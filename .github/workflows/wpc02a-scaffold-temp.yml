name: WPC-02A EF scaffold temporary

on:
  push:
    branches:
      - wpc-02a-visibility-provenance-archive

permissions:
  contents: write

jobs:
  scaffold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AipPortal.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build AipPortal.slnx --configuration Release --no-restore

      - name: Scaffold WPC-02A migration
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=aip_portal_design;Username=postgres;Password=postgres
        run: >-
          dotnet ef migrations add Wpc02AProjectVisibilityAndActivationProvenance
          --project src/AipPortal.Infrastructure
          --startup-project src/AipPortal.Web
          --output-dir Persistence/Migrations
          --configuration Release
          --no-build

      - name: Apply LegacyUnknown migration semantics and Project projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          migrations = sorted(Path('src/AipPortal.Infrastructure/Persistence/Migrations').glob('*_Wpc02AProjectVisibilityAndActivationProvenance.cs'))
          migrations = [path for path in migrations if not path.name.endswith('.Designer.cs')]
          if len(migrations) != 1:
              raise SystemExit(f'expected exactly one WPC-02A migration, found {len(migrations)}')

          migration = migrations[0]
          text = migration.read_text(encoding='utf-8-sig')
          activation_pattern = re.compile(
              r'''            migrationBuilder\.AddColumn<string>\(\s*'''
              r'''name: "ActivationState",\s*'''
              r'''table: "projects",\s*'''
              r'''type: "character varying\(40\)",\s*'''
              r'''maxLength: 40,\s*'''
              r'''nullable: false,\s*'''
              r'''defaultValue: ""\);''',
              re.MULTILINE)
          safe_upgrade = '''            migrationBuilder.AddColumn<string>(
                name: "ActivationState",
                table: "projects",
                type: "character varying(40)",
                maxLength: 40,
                nullable: true);

            migrationBuilder.Sql(
                "UPDATE \\\"projects\\\" SET \\\"ActivationState\\\" = 'LegacyUnknown' WHERE \\\"ActivationState\\\" IS NULL;");

            migrationBuilder.AlterColumn<string>(
                name: "ActivationState",
                table: "projects",
                type: "character varying(40)",
                maxLength: 40,
                nullable: false,
                oldClrType: typeof(string),
                oldType: "character varying(40)",
                oldMaxLength: 40,
                oldNullable: true);'''
          text, replacements = activation_pattern.subn(safe_upgrade, text, count=1)
          if replacements != 1:
              raise SystemExit('unexpected ActivationState scaffold shape')
          migration.write_text(text, encoding='utf-8')

          service = Path('src/AipPortal.Application/Projects/ProjectService.cs')
          service_text = service.read_text(encoding='utf-8-sig')
          projection_pattern = re.compile(
              r'''(?P<indent>[ \t]*)project\.UpdatedAt,\s*'''
              r'''new ProjectUiPermissionResponse\(await taskAuthorization\.CanCreateTask\(userId, project\.Id, cancellationToken\)\)\);''')

          def projection_replacement(match):
              indent = match.group('indent')
              return (
                  f'{indent}project.UpdatedAt,\n'
                  f'{indent}new ProjectUiPermissionResponse(await taskAuthorization.CanCreateTask(userId, project.Id, cancellationToken)),\n'
                  f'{indent}project.Visibility,\n'
                  f'{indent}project.ActivationState,\n'
                  f'{indent}project.ActivatedAtUtc,\n'
                  f'{indent}project.ActivationVersion,\n'
                  f'{indent}project.SuspendedFromStatus,\n'
                  f'{indent}project.ArchivedFromStatus);')

          service_text, projection_replacements = projection_pattern.subn(projection_replacement, service_text, count=1)
          if projection_replacements != 1:
              raise SystemExit('unexpected ProjectResponse projection shape')
          service.write_text(service_text, encoding='utf-8')
          PY

      - name: Build generated migration
        run: dotnet build AipPortal.slnx --configuration Release --no-restore

      - name: Verify generated model is clean
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=aip_portal_design;Username=postgres;Password=postgres
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/AipPortal.Infrastructure
          --startup-project src/AipPortal.Web
          --configuration Release
          --no-build

      - name: Commit generated WPC-02A migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AipPortal.Infrastructure/Persistence/Migrations \
                  src/AipPortal.Application/Projects/ProjectService.cs
          git status --short
          git commit -m "WPC-02A: add visibility and provenance migration"
          git push origin HEAD:wpc-02a-visibility-provenance-archive
