name: WPC-Final01 Fixture Repair

on:
  push:
    branches:
      - wpc-final03-security-no-go
    paths:
      - .github/workflows/wpc-final01-fixture-repair.yml

# One-shot repair trigger: remove this workflow in the repair commit.
permissions:
  contents: write

concurrency:
  group: wpc-final01-fixture-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: wpc-final03-security-no-go
          fetch-depth: 0
          persist-credentials: true

      - name: Repair non-operational Final01 fixture graph
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/AipPortal.Tests/PostgreSql/WpcFinal01CanonicalCompletionPostgreSqlTests.cs")
          text = path.read_text()
          old = '''        var task = new TaskItem
        {
            TenantId = authority.TenantId,
            WorkspaceId = authority.WorkspaceId,
            ProjectId = project.Id,
            Title = $"Final01 Task {suffix}",
            Status = TaskItemStatus.NotStarted,
            Priority = TaskPriority.Medium,
            VersionNo = 1,
            CreatedByUserId = authority.OwnerUserId
        };
        var notification = new Notification
        {
            TenantId = authority.TenantId,
            UserId = authority.ReaderUserId,
            NotificationType = NotificationType.TaskAssigned,
            Title = "Task assigned",
            RelatedEntityType = "Task",
            RelatedEntityId = task.Id,
            CreatedAt = Now,
            StateVersion = 1
        };
        db.AddRange(task, notification);
        await db.SaveChangesAsync();

        return new ProjectGraph(
            authority.TenantId,
            authority.TenantSlug,
            authority.WorkspaceId,
            project.Id,
            task.Id,
            notification.Id,
            general?.Id ?? Guid.Empty,
            authority.OwnerUserId,
            authority.ReaderUserId,
            authority.CandidateUserId);'''
          new = '''        var taskId = Guid.Empty;
        var taskNotificationId = Guid.Empty;
        var operationalProject =
            activationState == ProjectActivationState.Activated &&
            status is ProjectStatus.Active or ProjectStatus.Review;
        if (operationalProject)
        {
            var task = new TaskItem
            {
                TenantId = authority.TenantId,
                WorkspaceId = authority.WorkspaceId,
                ProjectId = project.Id,
                Title = $"Final01 Task {suffix}",
                Status = TaskItemStatus.NotStarted,
                Priority = TaskPriority.Medium,
                VersionNo = 1,
                CreatedByUserId = authority.OwnerUserId
            };
            var notification = new Notification
            {
                TenantId = authority.TenantId,
                UserId = authority.ReaderUserId,
                NotificationType = NotificationType.TaskAssigned,
                Title = "Task assigned",
                RelatedEntityType = "Task",
                RelatedEntityId = task.Id,
                CreatedAt = Now,
                StateVersion = 1
            };
            db.AddRange(task, notification);
            taskId = task.Id;
            taskNotificationId = notification.Id;
        }
        await db.SaveChangesAsync();

        return new ProjectGraph(
            authority.TenantId,
            authority.TenantSlug,
            authority.WorkspaceId,
            project.Id,
            taskId,
            taskNotificationId,
            general?.Id ?? Guid.Empty,
            authority.OwnerUserId,
            authority.ReaderUserId,
            authority.CandidateUserId);'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one Final01 task fixture block, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- tests/AipPortal.Tests/PostgreSql/WpcFinal01CanonicalCompletionPostgreSqlTests.cs

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/AipPortal.Tests/PostgreSql/WpcFinal01CanonicalCompletionPostgreSqlTests.cs
          git rm .github/workflows/wpc-final01-fixture-repair.yml
          git commit -m "Fix Final01 fixtures for operational child fence"
          git push origin HEAD:wpc-final03-security-no-go
