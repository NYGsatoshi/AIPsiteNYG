name: Licensed Real Backend Acceptance

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Licensed acceptance suite to run
        required: true
        default: p0
        type: choice
        options:
          - p0
          - my-tasks
          - mbj01
          - mbj02
          - mbj03
          - all

concurrency:
  group: licensed-real-backend-${{ inputs.suite }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  licensed-real-backend:
    name: licensed-real-backend
    runs-on: ubuntu-latest
    environment: syncfusion-licensed-build
    timeout-minutes: 120

    env:
      SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify protected license input
        shell: bash
        run: |
          test -n "${SYNCFUSION_LICENSE:-}" || {
            echo "SYNCFUSION_LICENSE is not configured in the protected environment." >&2
            exit 1
          }

      - name: Install acceptance runner dependencies
        run: npm ci

      - name: Prune unused Docker networks
        run: docker network prune --force

      - name: Run P0 acceptance
        if: inputs.suite == 'p0' || inputs.suite == 'all'
        run: node tests/ui/run-real-backend-p0.mjs

      - name: Run My Tasks acceptance
        if: inputs.suite == 'my-tasks' || inputs.suite == 'all'
        run: node tests/ui/run-real-backend-my-tasks.mjs

      - name: Run MBJ-01 bootstrap acceptance
        if: inputs.suite == 'mbj01' || inputs.suite == 'all'
        run: bash scripts/ci/run-mbj01-bootstrap-acceptance.sh

      - name: Run MBJ-02 invite acceptance
        if: inputs.suite == 'mbj02' || inputs.suite == 'all'
        run: bash scripts/ci/run-mbj02-invite-acceptance.sh

      - name: Run MBJ-03 session acceptance
        if: inputs.suite == 'mbj03' || inputs.suite == 'all'
        run: bash scripts/ci/run-mbj03-session-acceptance.sh

      - name: Upload sanitized diagnostic artifacts on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: licensed-real-backend-${{ inputs.suite }}-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
