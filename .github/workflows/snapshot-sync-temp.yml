name: Temporary EF Snapshot Export

on:
  pull_request:
    paths:
      - ".github/workflows/snapshot-sync-temp.yml"
      - "src/AipPortal.Infrastructure/Persistence/Configurations/ProductionConfigurations.cs"
      - "src/AipPortal.Infrastructure/Persistence/Migrations/20260725050000_TaskV1WatchAndLabelConcurrency.cs"

permissions:
  contents: read

jobs:
  export-snapshot:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure persistent .NET caches
        shell: bash
        run: |
          bash scripts/ci/configure-persistent-caches.sh
          install_dir="$HOME/.dotnet-ci"
          job_temp="$RUNNER_TEMP/dotnet-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$install_dir" "$job_temp/home" "$job_temp/nuget/scratch"
          {
            echo "DOTNET_INSTALL_DIR=$install_dir"
            echo "DOTNET_CMD=$install_dir/dotnet"
            echo "DOTNET_ROOT=$install_dir"
            echo "DOTNET_CLI_HOME=$job_temp/home"
            echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
            echo "DOTNET_NOLOGO=1"
            echo "DOTNET_MULTILEVEL_LOOKUP=0"
            echo "NUGET_SCRATCH=$job_temp/nuget/scratch"
          } >> "$GITHUB_ENV"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        shell: bash
        run: |
          "$DOTNET_CMD" restore AipPortal.slnx --disable-parallel
          "$DOTNET_CMD" tool restore

      - name: Generate model snapshot
        shell: bash
        run: |
          "$DOTNET_CMD" ef migrations add __SnapshotSync \
            --project src/AipPortal.Infrastructure \
            --startup-project src/AipPortal.Web \
            --configuration Release \
            --output-dir Persistence/Migrations
          find src/AipPortal.Infrastructure/Persistence/Migrations \
            -maxdepth 1 -type f -name '*__SnapshotSync*.cs' -delete
          git diff --check
          test -f src/AipPortal.Infrastructure/Persistence/Migrations/AppDbContextModelSnapshot.cs

      - name: Upload generated snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ef-model-snapshot
          path: src/AipPortal.Infrastructure/Persistence/Migrations/AppDbContextModelSnapshot.cs
          if-no-files-found: error
          retention-days: 1
