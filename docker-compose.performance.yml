# PERF-02 isolated performance stack.
# Never deploy this Compose file as a production/school environment.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: aip_portal_performance
      POSTGRES_USER: aip_portal_performance
      POSTGRES_PASSWORD: aip_portal_performance_password
    volumes:
      - performance_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aip_portal_performance -d aip_portal_performance"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 3s

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0.302
    working_dir: /src
    restart: "no"
    volumes:
      - ./:/src
      - performance_nuget:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=aip_portal_performance;Username=aip_portal_performance;Password=aip_portal_performance_password
      NUGET_PACKAGES: /root/.nuget/packages
      Tenancy__SeedOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc "mkdir -p /src/src/AipPortal.Web/wwwroot &&
      dotnet tool restore &&
      dotnet restore src/AipPortal.Web/AipPortal.Web.csproj /p:RestoreFallbackFolders= &&
      dotnet ef database update --project src/AipPortal.Infrastructure --startup-project src/AipPortal.Web"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - syncfusion_license
    networks:
      default:
        aliases:
          - aip-performance
    ports:
      - "127.0.0.1:${AIP_PERFORMANCE_PORT:-18080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=aip_portal_performance;Username=aip_portal_performance;Password=aip_portal_performance_password
      DataProtection__KeysPath: /app/data/protection-keys

      Tenancy__AppMode: SaaS
      Tenancy__DefaultTenantSlug: perf-${AIP_PERFORMANCE_PROFILE:?AIP_PERFORMANCE_PROFILE must be small, medium, or large}
      Tenancy__TenantResolutionStrategy: HeaderForDevelopmentOnly
      Tenancy__AllowTenantSwitching: "true"
      Tenancy__AllowDevelopmentHeaderTenantResolution: "true"
      Tenancy__AllowDevelopmentHeaderInProduction: "false"
      Tenancy__DevelopmentTenantHeaderName: X-Tenant-Slug
      Tenancy__SeedOnStartup: "false"
      UiShell__SeedOnStartup: "false"

      AIP_BROWSER_SMOKE_SEED_ENABLED: "false"
      AIP_BROWSER_SMOKE_RESPONSE_GATE_ENABLED: "false"
      AIP_DEMO_DATASET_ENABLED: "false"
      AIP_SECURITY_CI_FIXTURE_ENABLED: "false"

      AIP_PERFORMANCE_CI_FIXTURE_ENABLED: "true"
      AIP_PERFORMANCE_PROFILE: ${AIP_PERFORMANCE_PROFILE:?AIP_PERFORMANCE_PROFILE must be small, medium, or large}
      AIP_PERFORMANCE_PASSWORD: ${AIP_PERFORMANCE_PASSWORD:?AIP_PERFORMANCE_PASSWORD is required}
      AIP_PERFORMANCE_DATASETS_PATH: /app/performance/datasets.json
      AIP_PERFORMANCE_FIXTURE_EVIDENCE_PATH: /app/performance-evidence/fixture.json

      FileStorage__Provider: LocalFileSystem
      FileStorage__RootPath: /app/storage/uploads
      Security__CookieSecurePolicy: SameAsRequest
      Security__RequireHttps: "false"
      Security__EnableHsts: "false"
      Security__EnableCsrfProtection: "true"
      Security__EnableRateLimiting: "false"
    volumes:
      - ./performance/datasets.json:/app/performance/datasets.json:ro
      - ${AIP_PERFORMANCE_EVIDENCE_DIR:?AIP_PERFORMANCE_EVIDENCE_DIR is required}:/app/performance-evidence
      - performance_uploads:/app/storage/uploads
      - performance_data_protection:/app/data/protection-keys
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health/ready >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 20s

  performance-browser:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    profiles: ["tooling"]
    working_dir: /work
    volumes:
      - ./:/work
    command: ["bash"]

volumes:
  performance_pgdata:
  performance_nuget:
  performance_uploads:
  performance_data_protection:

secrets:
  syncfusion_license:
    environment: SYNCFUSION_LICENSE
