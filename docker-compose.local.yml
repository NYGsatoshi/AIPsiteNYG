services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aip_portal}
      POSTGRES_USER: ${POSTGRES_USER:-aip_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aip_portal_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aip_local_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aip_portal} -d ${POSTGRES_DB:-aip_portal}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - ./:/src
      - aip_local_nuget:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aip_portal};Username=${POSTGRES_USER:-aip_portal};Password=${POSTGRES_PASSWORD:-aip_portal_password}
      NUGET_PACKAGES: /root/.nuget/packages
      Tenancy__SeedOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc "dotnet tool restore &&
      dotnet restore src/AipPortal.Web/AipPortal.Web.csproj /p:RestoreFallbackFolders= &&
      dotnet ef database update --project src/AipPortal.Infrastructure --startup-project src/AipPortal.Web"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aip_portal};Username=${POSTGRES_USER:-aip_portal};Password=${POSTGRES_PASSWORD:-aip_portal_password}
      Tenancy__AppMode: OnPremSingleTenant
      Tenancy__DefaultTenantSlug: default
      Tenancy__TenantResolutionStrategy: ConfigDefault
      Tenancy__AllowTenantSwitching: "false"
      Tenancy__SeedOnStartup: "true"
      FileStorage__Provider: LocalFileSystem
      FileStorage__RootPath: /app/storage/uploads
      FileStorage__MaxFileSizeBytes: ${FILE_STORAGE_MAX_FILE_SIZE_BYTES:-52428800}
      Security__CookieSecurePolicy: SameAsRequest
      Security__RequireHttps: "false"
      Security__EnableHsts: "false"
      Platform__EnablePlatformAdmin: "true"
      Platform__PlatformAdminSetupMode: "true"
      Platform__AllowTenantCreationFromAdmin: "true"
      LocalAdmin__SeedOnStartup: ${LOCAL_ADMIN_SEED_ON_STARTUP:-true}
      LocalAdmin__Email: ${LOCAL_ADMIN_EMAIL:-admin@example.com}
      LocalAdmin__Password: ${LOCAL_ADMIN_PASSWORD:?set LOCAL_ADMIN_PASSWORD}
      LocalAdmin__DisplayName: ${LOCAL_ADMIN_DISPLAY_NAME:-Local Admin}
    ports:
      - "${AIP_PORTAL_PORT:-8080}:8080"
    volumes:
      - aip_local_uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  aip_local_pgdata:
  aip_local_uploads:
  aip_local_nuget:
