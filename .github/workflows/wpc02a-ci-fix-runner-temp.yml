name: WPC-02A CI regression fix runner temporary

on:
  push:
    branches:
      - wpc-02a-visibility-provenance-archive

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: wpc-02a-visibility-provenance-archive
          fetch-depth: 0
      - name: Execute staged patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          staged = Path('.github/workflows/wpc02a-ci-fix-temp.yml').read_text()
          marker = '        run: |\n'
          start = staged.index(marker) + len(marker)
          end = staged.index('\n      - name: Commit regression fixes and remove temporary workflow', start)
          code = textwrap.dedent(staged[start:end])
          compile(code, '<wpc02a-ci-fix>', 'exec')
          exec(code, {})
          Path('.github/workflows/wpc02a-ci-fix-runner-temp.yml').unlink()
          PY
      - name: Commit bounded fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "WPC-02A: fix full-suite CI regressions"
          git push origin HEAD:wpc-02a-visibility-provenance-archive
