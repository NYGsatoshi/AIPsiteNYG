name: Publication Readiness

on:
  workflow_dispatch:
  pull_request: # Required check: intentionally unfiltered.
  push:
    branches: ["main"]

concurrency:
  group: publication-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publication-readiness:
    name: publication-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test publication and trust-boundary parsers
        run: |
          python3 -m py_compile \
            scripts/ci/required_check_contract.py \
            scripts/ci/check-required-pr-checks.py
          ruby scripts/ci/test-workflow-trust-boundaries-upper-bound.rb
          python3 scripts/ci/test-publication-readiness.py

      - name: Enforce publication safety, trust boundaries, and required-check topology
        run: |
          ruby scripts/ci/check-workflow-trust-boundaries-upper-bound.rb
          python3 scripts/ci/check-publication-readiness.py
          python3 scripts/ci/check-required-pr-checks.py

      - name: Scan full reachable Git history with Gitleaks
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --redact --verbose \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --report-format json \
            --report-path /repo/gitleaks-publication-report.json
          status=$?
          set -e
          [[ -f gitleaks-publication-report.json ]] || printf '[]\n' > gitleaks-publication-report.json
          exit "$status"

      - name: Upload redacted Gitleaks report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: publication-readiness-gitleaks-report
          path: gitleaks-publication-report.json
          if-no-files-found: ignore
          retention-days: 7
