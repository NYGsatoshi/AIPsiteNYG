name: PR 219 TypeScript diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typescript-diagnostic:
    if: github.event.pull_request.number == 219
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up npm
        run: npm install --global npm@11.17.0

      - name: Install Angular dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Capture TypeScript diagnostics
        id: tsc
        working-directory: frontend
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/tsc --noEmit --project tsconfig.app.json > ../pr219-typescript.log 2>&1
          status=$?
          cat ../pr219-typescript.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload TypeScript diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr219-typescript-diagnostics
          path: pr219-typescript.log
          if-no-files-found: error

      - name: Fail when TypeScript diagnostics exist
        if: steps.tsc.outputs.status != '0'
        run: exit 1
