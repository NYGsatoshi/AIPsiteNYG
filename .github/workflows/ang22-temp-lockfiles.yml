name: ANG22 temporary lockfile generation

on:
  pull_request:
    branches:
      - integration/angular-22-migration
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate-lockfiles:
    if: github.actor == 'NYGsatoshi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Remove Angular 21 lockfiles before regeneration
        run: rm -f frontend/package-lock.json aipsite-frontend/package-lock.json

      - name: Resolve frontend lockfile strictly
        shell: bash
        run: |
          set +e
          npm --prefix frontend install --package-lock-only --ignore-scripts --strict-peer-deps --no-audit --no-fund 2>&1 | tee /tmp/ang22-frontend-resolve.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            sed -n '1,240p' /tmp/ang22-frontend-resolve.log > ang22-peer-resolution-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ang22-peer-resolution-error.txt
            git commit -m 'ci(temp): capture Angular 22 peer resolution error'
            git push origin HEAD:${GITHUB_HEAD_REF}
            exit "$status"
          fi

      - name: Resolve secondary frontend lockfile strictly
        run: npm --prefix aipsite-frontend install --package-lock-only --ignore-scripts --strict-peer-deps --no-audit --no-fund

      - name: Verify clean frontend install
        run: npm --prefix frontend ci --ignore-scripts --strict-peer-deps --no-audit --no-fund

      - name: Verify clean secondary frontend install
        run: npm --prefix aipsite-frontend ci --ignore-scripts --strict-peer-deps --no-audit --no-fund

      - name: Commit generated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git add frontend/package-lock.json aipsite-frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(angular): regenerate Angular 22 lockfiles'
          git push origin HEAD:${GITHUB_HEAD_REF}
