name: WPC-Final03 Restore Authorization Patch

on:
  push:
    branches:
      - wpc-final03-security-no-go
    paths:
      - .github/workflows/wpc-final03-restore-auth-patch.yml

permissions:
  contents: write

concurrency:
  group: wpc-final03-restore-auth-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: [self-hosted, aipsiteci-pool]
    timeout-minutes: 10
    steps:
      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: wpc-final03-security-no-go
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact restore authorization fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          task_path = Path("src/AipPortal.Application/Projects/TaskCommandService.cs")
          task_text = task_path.read_text()
          task_old = '''        var allowed = requireOverride ? await taskAuthorization.CanOverrideTaskReview(actor, task.Id, cancellationToken) : requireReview ? await taskAuthorization.CanReviewTask(actor, task.Id, cancellationToken) : requireAssign ? await taskAuthorization.CanAssignTask(actor, task.Id, cancellationToken) : !mutate || await taskAuthorization.CanUpdateTask(actor, task.Id, cancellationToken);'''
          task_new = '''        // Restore is the only command that intentionally authorizes a soft-deleted
        // Task. Normal assignment/deletion authorization remains fail-closed for
        // deleted rows; Restore requires both current operational contribution
        // authority and current Project management authority.
        var allowed = requireOverride
            ? await taskAuthorization.CanOverrideTaskReview(actor, task.Id, cancellationToken)
            : requireReview
                ? await taskAuthorization.CanReviewTask(actor, task.Id, cancellationToken)
                : requireAssign
                    ? includeDeleted
                        ? await projectAuthorization.CanContributeProject(actor, task.ProjectId, cancellationToken) &&
                          await projectAuthorization.CanManageProject(actor, task.ProjectId, cancellationToken)
                        : await taskAuthorization.CanAssignTask(actor, task.Id, cancellationToken)
                    : !mutate || await taskAuthorization.CanUpdateTask(actor, task.Id, cancellationToken);'''
          task_count = task_text.count(task_old)
          if task_count != 1:
              raise SystemExit(f"expected exactly one TaskCommandService authorization expression, found {task_count}")
          task_path.write_text(task_text.replace(task_old, task_new, 1))

          auth_path = Path("src/AipPortal.Application/Projects/ProjectAuthorizationService.cs")
          auth_text = auth_path.read_text()
          auth_old = '''        // Deleted-row visibility is enforced by the command boundary. Restore is
        // the single command that intentionally opts into deleted Task loading,
        // and it must reuse the same current manager-level authorization as
        // assignment/delete without making historical attribution a capability.
        return task is not null &&
               await CanUseTaskMutationScopeAsync(userId, task.ProjectId, cancellationToken) &&
               await CanManageProject(userId, task.ProjectId, cancellationToken);'''
          auth_new = '''        // Assignment/delete/override authorization is a live-row capability.
        // Restore handles its soft-deleted exception explicitly at the command
        // boundary instead of widening this reusable authorization primitive.
        return task is not null &&
               !task.DeletedAt.HasValue &&
               await CanUseTaskMutationScopeAsync(userId, task.ProjectId, cancellationToken) &&
               await CanManageProject(userId, task.ProjectId, cancellationToken);'''
          auth_count = auth_text.count(auth_old)
          if auth_count != 1:
              raise SystemExit(f"expected exactly one ProjectAuthorizationService block, found {auth_count}")
          auth_path.write_text(auth_text.replace(auth_old, auth_new, 1))
          PY

          git diff --check
          git diff -- \
            src/AipPortal.Application/Projects/TaskCommandService.cs \
            src/AipPortal.Application/Projects/ProjectAuthorizationService.cs

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/AipPortal.Application/Projects/TaskCommandService.cs \
            src/AipPortal.Application/Projects/ProjectAuthorizationService.cs
          git commit -m "Harden deleted Task restore authorization"
          git push origin HEAD:wpc-final03-security-no-go
