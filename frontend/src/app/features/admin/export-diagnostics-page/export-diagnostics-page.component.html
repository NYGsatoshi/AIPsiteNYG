@let page = vm();

<section class="admin-page" data-testid="export-diagnostics-page">
  <header class="admin-page__header">
    <div>
      <p class="admin-page__eyebrow">{{ page.subtitle }}</p>
      <h1>{{ page.title }}</h1>
    </div>
  </header>

  <p class="admin-page__policy" data-testid="export-authorization-note">
    Export diagnostics are not implemented for MVP0. This route does not create requests, show local job history, or
    expose downloads.
  </p>

  <app-empty-state
    title="Not available in MVP0"
    [message]="page.message ?? 'Export diagnostics are disabled for this release.'"
  />
</section>
