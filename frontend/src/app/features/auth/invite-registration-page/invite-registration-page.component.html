@let vm = viewState();

<main class="invite-registration-page" data-testid="invite-registration-page">
  <section class="invite-registration-page__panel">
    <header class="invite-registration-page__header">
      <p>招待登録</p>
      <h1>アカウントを作成</h1>
    </header>

    <app-invite-token-state-panel [state]="vm" />

    @if (canShowForm() && vm.email) {
      <app-invite-registration-form
        [email]="vm.email"
        [submitDisabled]="vm.submitDisabled"
        (registerInvite)="submitRegistration($event)"
      />
    }
  </section>
</main>
