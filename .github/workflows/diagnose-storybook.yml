name: Diagnose Storybook

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.17.0

      - name: Install Angular dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Capture Storybook build log
        id: storybook
        shell: bash
        run: |
          set +e
          npm --prefix frontend run build-storybook > storybook-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Storybook diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: storybook-diagnostic-log
          path: storybook-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when Storybook failed
        shell: bash
        run: exit "${{ steps.storybook.outputs.status }}"
