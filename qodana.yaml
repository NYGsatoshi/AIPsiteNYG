version: "1.0"

# Qodana Community for .NET analyzes C#, ASP.NET Core and the .NET solution.
linter: qodana-cdnet

# Enable every inspection registered by the Community .NET linter. Generated,
# dependency and runtime paths remain excluded below so the full profile stays
# focused on first-party source and tests.
profile:
  base:
    name: qodana.recommended
  inspections:
    - group: "ALL"
      enabled: true

# Delegate to Bash because the bootstrap uses pipefail and prepares the complete
# .NET project model before inspections start.
bootstrap: bash scripts/quality/qodana-bootstrap.sh

exclude:
  - name: All
    paths:
      - "bin"
      - "obj"
      - "node_modules"
      - "dist"
      - ".angular"
      - ".tmp"
      - ".qodana"
      - "artifacts"
      - "**/bin/**"
      - "**/obj/**"
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/.angular/**"
      - "**/coverage/**"
      - "**/TestResults/**"
      - "**/test-results/**"
      - "**/playwright-report/**"
      - "**/.playwright/**"
      - "**/.qodana/**"
      - "**/storybook-static/**"
      - "**/artifacts/**"
      - "src/AipPortal.Application/bin"
      - "src/AipPortal.Application/obj"
      - "src/AipPortal.Domain/bin"
      - "src/AipPortal.Domain/obj"
      - "src/AipPortal.Infrastructure/bin"
      - "src/AipPortal.Infrastructure/obj"
      - "src/AipPortal.Web/bin"
      - "src/AipPortal.Web/obj"
      - "tests/AipPortal.Tests/bin"
      - "tests/AipPortal.Tests/obj"
      - "frontend/node_modules"
      - "frontend/dist"
      - "frontend/.angular"
      - "src/AipPortal.Web/wwwroot"
      - "src/AipPortal.Web/data"
      - "aipsite-frontend"
