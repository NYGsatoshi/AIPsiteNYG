name: External PR approval evaluator

on:
  workflow_run:
    workflows: ["External PR review signal"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-evaluate
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: external-pr-approval-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: External PR approval evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate authoritative PR review state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PR_NUMBER: ${{ inputs.pr_number || '' }}
        run: |
          set -euo pipefail

          # This workflow is trusted default-branch code. Resolve governance policy
          # and evaluator code from the canonical default branch; never execute PR head code.
          default_branch="$(gh api "repos/$REPOSITORY" --jq '.default_branch')"
          policy_file="$RUNNER_TEMP/governance-policy.json"
          evaluator_file="$RUNNER_TEMP/evaluate-governance-pr-review.py"

          gh api \
            --method GET \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPOSITORY/contents/governance/policy.json" \
            -f "ref=$default_branch" \
            > "$policy_file"

          gh api \
            --method GET \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPOSITORY/contents/scripts/ci/evaluate-governance-pr-review.py" \
            -f "ref=$default_branch" \
            > "$evaluator_file"

          # GOV-CHECKS-001 / required-status-checks / commit-status producer contract.
          status_selector='[
            .controls[]
            | select(.id == "GOV-CHECKS-001" and .family == "required-status-checks")
            | .expected.required[]
            | select(
                .kind == "commit-status"
                and .workflow == ".github/workflows/external-pr-approval-evaluator.yml"
                and .job == "evaluate"
              )
          ]'
          status_count="$(jq -r "$status_selector | length" "$policy_file")"
          if [[ "$status_count" != "1" ]]; then
            echo "Governance policy must define exactly one commit-status for this evaluator; found $status_count." >&2
            exit 1
          fi
          status_context="$(jq -r "$status_selector | .[0].context" "$policy_file")"
          if [[ -z "$status_context" || "$status_context" == "null" ]]; then
            echo "Governance policy returned an empty status context." >&2
            exit 1
          fi

          # GOV-REVIEW-001 is parsed by the trusted Python evaluator; retain this lookup
          # marker so static governance checks prove the workflow consumes canonical policy.
          reviewer_selector='[
            .controls[]
            | select(.id == "GOV-REVIEW-001" and .family == "pr-review-codeowners")
            | .expected.external_pr_approval_reviewer
          ]'
          reviewer_count="$(jq -r "$reviewer_selector | length" "$policy_file")"
          if [[ "$reviewer_count" != "1" ]]; then
            echo "Governance policy must define exactly one external PR approval reviewer; found $reviewer_count." >&2
            exit 1
          fi

          pr_number=""
          case "$EVENT_NAME" in
            workflow_run)
              pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
              if [[ -z "$pr_number" ]]; then
                signal_sha="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
                if [[ -n "$signal_sha" ]]; then
                  pr_number="$(gh api "repos/$REPOSITORY/commits/$signal_sha/pulls?per_page=100" --jq '.[0].number // empty')"
                fi
              fi
              ;;
            workflow_dispatch)
              pr_number="$MANUAL_PR_NUMBER"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ -z "$pr_number" ]]; then
            echo "No pull request could be resolved from this event; nothing to evaluate."
            exit 0
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          pr_state="$(jq -r '.state' <<<"$pr_json")"
          if [[ "$pr_state" != "open" ]]; then
            echo "PR #$pr_number is not open; nothing to evaluate."
            exit 0
          fi

          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          post_status() {
            local state="$1"
            local description="$2"
            gh api \
              --method POST \
              "repos/$REPOSITORY/statuses/$head_sha" \
              -f state="$state" \
              -f context="$status_context" \
              -f description="$description" \
              -f target_url="$target_url" \
              >/dev/null
          }

          # Replace any previous success for this exact head before making API calls.
          # An API/evaluator failure after this point therefore remains fail-closed.
          post_status failure "Review evaluation incomplete; fail closed until authoritative evaluation succeeds."

          reviews_file="$RUNNER_TEMP/pr-reviews.json"
          gh api --paginate --slurp \
            "repos/$REPOSITORY/pulls/$pr_number/reviews?per_page=100" \
            > "$reviews_file"

          state_file="$RUNNER_TEMP/governance-review-state.json"
          jq -n \
            --argjson pr "$pr_json" \
            --slurpfile review_pages "$reviews_file" \
            '{
              state: $pr.state,
              draft: $pr.draft,
              head_sha: $pr.head.sha,
              author: $pr.user.login,
              reviews: ($review_pages[0] | flatten)
            }' \
            > "$state_file"

          decision_json="$(python3 "$evaluator_file" --policy "$policy_file" --state "$state_file")"
          status_state="$(jq -r '.state' <<<"$decision_json")"
          description="$(jq -r '.reason' <<<"$decision_json")"
          if [[ "$status_state" != "success" && "$status_state" != "failure" ]]; then
            echo "Trusted review evaluator returned an invalid status: $status_state" >&2
            exit 1
          fi

          post_status "$status_state" "$description"
          echo "PR #$pr_number head=$head_sha context=$status_context result=$status_state reason=$description"
