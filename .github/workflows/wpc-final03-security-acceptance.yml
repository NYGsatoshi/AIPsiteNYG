name: WPC-Final03 Security Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "src/AipPortal.Application/Files/**"
      - "src/AipPortal.Application/Projects/**"
      - "src/AipPortal.Application/Security/Redaction/**"
      - "src/AipPortal.Application/Workspaces/**"
      - "src/AipPortal.Application/DependencyInjection.cs"
      - "src/AipPortal.Web/Controllers/WorkspacesController.cs"
      - "tests/AipPortal.Tests/**/WpcFinal03*.cs"
      - "scripts/ci/wpc-final03-required-tests.txt"
      - ".github/workflows/wpc-final03-security-acceptance.yml"
  push:
    branches: ["main"]
    paths:
      - "src/AipPortal.Application/Files/**"
      - "src/AipPortal.Application/Projects/**"
      - "src/AipPortal.Application/Security/Redaction/**"
      - "src/AipPortal.Application/Workspaces/**"
      - "src/AipPortal.Application/DependencyInjection.cs"
      - "src/AipPortal.Web/Controllers/WorkspacesController.cs"
      - "tests/AipPortal.Tests/**/WpcFinal03*.cs"
      - "scripts/ci/wpc-final03-required-tests.txt"
      - ".github/workflows/wpc-final03-security-acceptance.yml"

concurrency:
  group: wpc-final03-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    name: WPC-Final03 Security / PG18
    runs-on: self-hosted
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: aip_portal_wpc_final03
          POSTGRES_USER: aip_portal_wpc_final03
          POSTGRES_PASSWORD: aip_portal_wpc_final03_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U aip_portal_wpc_final03 -d aip_portal_wpc_final03"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASPNETCORE_ENVIRONMENT: Test
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Configure PostgreSQL connection
        shell: bash
        run: |
          postgres_port='${{ job.services.postgres.ports[5432] }}'
          test -n "$postgres_port"
          {
            echo "ConnectionStrings__DefaultConnection=Host=localhost;Port=${postgres_port};Database=aip_portal_wpc_final03;Username=aip_portal_wpc_final03;Password=aip_portal_wpc_final03_password"
            echo "POSTGRES_TEST_CONNECTION_STRING=Host=localhost;Port=${postgres_port};Database=aip_portal_wpc_final03;Username=aip_portal_wpc_final03;Password=aip_portal_wpc_final03_password"
          } >> "$GITHUB_ENV"

      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure user-local .NET install
        shell: bash
        run: |
          install_dir="$HOME/.dotnet-ci"
          job_temp="$RUNNER_TEMP/dotnet-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p \
            "$install_dir" \
            "$job_temp/home" \
            "$job_temp/nuget/scratch" \
            "$HOME/.nuget/packages"
          {
            echo "DOTNET_INSTALL_DIR=$install_dir"
            echo "DOTNET_ROOT=$install_dir"
            echo "DOTNET_MULTILEVEL_LOOKUP=0"
            echo "DOTNET_CLI_HOME=$job_temp/home"
            echo "DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE=1"
            echo "NUGET_PACKAGES=$HOME/.nuget/packages"
            echo "NUGET_SCRATCH=$job_temp/nuget/scratch"
          } >> "$GITHUB_ENV"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AipPortal.slnx --disable-parallel --disable-build-servers --verbosity normal

      - name: Build
        run: dotnet build AipPortal.slnx --configuration Release --no-restore --disable-build-servers -m:1

      - name: Run WPC-Final03 security acceptance
        shell: bash
        run: |
          mkdir -p artifacts/wpc-final03-test-results
          dotnet test \
            tests/AipPortal.Tests/AipPortal.Tests.csproj \
            --configuration Release \
            --no-build \
            --disable-build-servers \
            -m:1 \
            --verbosity normal \
            --filter "Scope=WPCFinal03" \
            --logger "trx;LogFileName=wpc-final03-acceptance.trx" \
            --results-directory artifacts/wpc-final03-test-results

      - name: Verify WPC-Final03 required tests
        shell: bash
        run: |
          bash scripts/ci/verify-trx-results.sh \
            artifacts/wpc-final03-test-results/wpc-final03-acceptance.trx \
            --minimum-total 14 \
            --required-tests scripts/ci/wpc-final03-required-tests.txt \
            --label "WPC-Final03 Security"

      - name: Upload WPC-Final03 acceptance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wpc-final03-security-acceptance-results
          path: artifacts/wpc-final03-test-results
          if-no-files-found: warn
          retention-days: 14
