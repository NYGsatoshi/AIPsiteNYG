name: PR 540 targeted verification

on:
  push:
    branches:
      - fix/528-canonical-message-attachments
    paths:
      - .github/workflows/pr540-targeted-verify.yml

permissions:
  contents: read

jobs:
  issue-528-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aipportal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aipportal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=aipportal_test;Username=postgres;Password=postgres
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run Issue 528 PostgreSQL tests
        run: >-
          dotnet test tests/AipPortal.Tests/AipPortal.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~AipPortal.Tests.PostgreSql.MessageCanonicalAttachmentPostgreSqlTests"
          --logger "console;verbosity=normal"
