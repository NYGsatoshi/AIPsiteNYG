jobs:
  - job: FrontendCore
    displayName: Node preflight and Angular validation
    dependsOn: DetectChanges
    condition: or(and(succeeded(), eq(dependencies.DetectChanges.outputs['changes.preflight'], 'true')), and(succeeded(), eq(dependencies.DetectChanges.outputs['changes.frontend'], 'true')))
    timeoutInMinutes: 60
    variables:
      NODE_OPTIONS: --max-old-space-size=4096
      NPM_CONFIG_CACHE: $(Pipeline.Workspace)/.npm
      runPreflight: $[ dependencies.DetectChanges.outputs['changes.preflight'] ]
      runFrontend: $[ dependencies.DetectChanges.outputs['changes.frontend'] ]
    steps:
      - checkout: self
        persistCredentials: false
      - task: NodeTool@0
        displayName: Install Node.js 24
        inputs:
          versionSpec: '24.x'
      - task: Cache@2
        displayName: Restore npm download cache
        condition: and(succeededOrFailed(), eq(variables['runFrontend'], 'true'))
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json | frontend/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(NPM_CONFIG_CACHE)

      - bash: node scripts/ci/verify-node-toolchain.mjs
        displayName: Verify Node toolchain policy
        condition: and(succeededOrFailed(), eq(variables['runPreflight'], 'true'))
      - bash: >-
          node --test
          tests/ui/build-playwright-grep.node-test.mjs
          tests/ui/verify-playwright-required-tests.node-test.mjs
          tests/ui/real-backend-smoke-compose-helpers.node-test.mjs
        displayName: Test P0 manifest and runner helpers
        condition: and(succeededOrFailed(), eq(variables['runPreflight'], 'true'))
      - bash: |
          set -euo pipefail
          node --check tests/ui/prepare-real-backend-p0-state.mjs
          node --check tests/ui/real-backend-smoke-compose-helpers.mjs
          node --check tests/ui/run-real-backend-p0.mjs
          node --check tests/ui/run-real-backend-playwright.mjs
          node --check tests/ui/run-real-backend-smoke-compose.mjs
          grep_pattern="$(node scripts/ci/build-playwright-grep.mjs \
            scripts/ci/real-backend-pr-p0-required-tests.txt \
            --verify tests/ui/real-backend-smoke.spec.ts)"
          test -n "$grep_pattern"
        displayName: Validate P0 syntax and required test titles
        condition: and(succeededOrFailed(), eq(variables['runPreflight'], 'true'))

      - bash: |
          mkdir -p artifacts/frontend-inspections
          bash scripts/ci/npm-ci-retry.sh .
        displayName: Install repository dependencies
        condition: and(succeededOrFailed(), eq(variables['runFrontend'], 'true'))
      - bash: bash scripts/ci/npm-ci-retry.sh frontend
        displayName: Install Angular dependencies
        condition: and(succeededOrFailed(), eq(variables['runFrontend'], 'true'))
      - bash: |
          set -euo pipefail
          for attempt in 1 2; do
            set +e
            if [ "$attempt" -eq 1 ]; then
              npm --prefix tools/frontend-inspections install --prefer-offline --ignore-scripts --no-audit --no-fund
            else
              npm_config_prefer_offline=false npm --prefix tools/frontend-inspections install --prefer-online --ignore-scripts --no-audit --no-fund
            fi
            status=$?
            set -e
            [ "$status" -eq 0 ] && exit 0
            [ "$attempt" -eq 2 ] && exit "$status"
            sleep 10
          done
        displayName: Install frontend inspection toolchain
        condition: and(succeededOrFailed(), eq(variables['runFrontend'], 'true'))

      - bash: |
          set -euo pipefail
          test -n "${SYNCFUSION_LICENSE:-}" || {
            echo "SYNCFUSION_LICENSE must be configured as a secret Azure Pipeline variable." >&2
            exit 1
          }
          test -x node_modules/.bin/syncfusion-license
          npm run syncfusion:activate
        workingDirectory: frontend
        displayName: Activate Syncfusion license
        condition: and(succeededOrFailed(), eq(variables['runFrontend'], 'true'))
        env:
          SYNCFUSION_LICENSE: $(SYNCFUSION_LICENSE)
      - bash: npm run build
        workingDirectory: frontend
        displayName: Angular production build
        condition: and(succeededOrFailed(), eq(variables['runFrontend'], 'true'))
      - bash: npm run test
        workingDirectory: frontend
        displayName: Angular unit tests
        condition: and(succeededOrFailed(), eq(variables['runFrontend'], 'true'))
      - bash: |
          printf '{"status":"inspection-started","workflow":"azure-pipelines"}\n' > artifacts/frontend-inspections/ci-manifest.json
          npm run lint:frontend
        displayName: Run complete frontend inspection inventory
        condition: and(succeededOrFailed(), eq(variables['runFrontend'], 'true'))
      - bash: |
          npm run check:architecture
          npm run test:architecture
          npm run test:syncfusion-license
        workingDirectory: frontend
        displayName: Validate frontend architecture and license safeguards
        condition: and(succeededOrFailed(), eq(variables['runFrontend'], 'true'))
      - bash: npm run build-storybook
        workingDirectory: frontend
        displayName: Angular Storybook build
        condition: and(succeededOrFailed(), eq(variables['runFrontend'], 'true'))
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - task: PublishPipelineArtifact@1
        displayName: Publish frontend inspection reports
        condition: and(always(), eq(variables['runFrontend'], 'true'))
        inputs:
          targetPath: '$(Build.SourcesDirectory)/artifacts/frontend-inspections'
          artifact: frontend-inspection-reports
          publishLocation: pipeline

  - job: FrontendPlaywright
    displayName: Angular Playwright smoke
    dependsOn: DetectChanges
    condition: and(succeeded(), eq(dependencies.DetectChanges.outputs['changes.frontend'], 'true'))
    timeoutInMinutes: 60
    variables:
      NPM_CONFIG_CACHE: $(Pipeline.Workspace)/.npm
    steps:
      - checkout: self
        persistCredentials: false
      - task: NodeTool@0
        inputs:
          versionSpec: '24.x'
        displayName: Install Node.js 24
      - task: Cache@2
        displayName: Restore npm download cache
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json | frontend/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(NPM_CONFIG_CACHE)
      - bash: |
          mkdir -p playwright-report test-results
          bash scripts/ci/npm-ci-retry.sh .
        displayName: Install repository dependencies
      - bash: bash scripts/ci/npm-ci-retry.sh frontend
        displayName: Install Angular dependencies
      - bash: npm run test:ui:angular:docker
        displayName: Run Angular Playwright smoke
      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/playwright-report'
          artifact: angular-playwright-report
          publishLocation: pipeline
        displayName: Publish Playwright report
      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/test-results'
          artifact: angular-playwright-results
          publishLocation: pipeline
        displayName: Publish Playwright results

  - job: RealBackendP0
    displayName: Real Backend P0 acceptance
    dependsOn: DetectChanges
    condition: and(succeeded(), eq(dependencies.DetectChanges.outputs['changes.p0'], 'true'))
    timeoutInMinutes: 45
    variables:
      NPM_CONFIG_CACHE: $(Pipeline.Workspace)/.npm
    steps:
      - checkout: self
        persistCredentials: false
      - task: NodeTool@0
        inputs:
          versionSpec: '24.x'
        displayName: Install Node.js 24
      - task: Cache@2
        displayName: Restore npm download cache
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(NPM_CONFIG_CACHE)
      - bash: |
          mkdir -p playwright-report test-results
          bash scripts/ci/npm-ci-retry.sh .
        displayName: Install smoke runner dependencies
      - bash: |
          set -euo pipefail
          test -n "${SYNCFUSION_LICENSE:-}" || {
            echo "SYNCFUSION_LICENSE is not configured." >&2
            exit 1
          }
          node tests/ui/run-real-backend-p0.mjs
        displayName: Run required real-backend P0 acceptance
        env:
          SYNCFUSION_LICENSE: $(SYNCFUSION_LICENSE)
      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/test-results'
          artifact: real-backend-p0-results
          publishLocation: pipeline
        displayName: Publish P0 evidence
      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/playwright-report'
          artifact: real-backend-p0-playwright
          publishLocation: pipeline
        displayName: Publish P0 Playwright report

