name: Code Quality

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  qodana-dotnet-community:
    name: Qodana Community / .NET
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      QODANA_FRONTEND_REQUIRED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run all registered Qodana Community inspections
        uses: JetBrains/qodana-action@v2026.1
        with:
          args: |
            --image jetbrains/qodana-cdnet:2026.1-eap-privileged
            --solution AipPortal.slnx
            --configuration Release
          pr-mode: false
          results-dir: ${{ runner.temp }}/qodana/results
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: true
          push-fixes: none

      - name: Guard Qodana project model
        if: always()
        env:
          QODANA_PROJECT_MODEL_SUMMARY_PATH: ${{ runner.temp }}/qodana/project-model-summary.json
        shell: bash
        run: |
          sarif="${{ runner.temp }}/qodana/results/qodana.sarif.json"
          if [[ ! -f "$sarif" ]]; then
            echo "::warning::Qodana SARIF was not produced; skipping the secondary project-model guard."
            exit 0
          fi

          node scripts/quality/check-qodana-project-model.mjs "$sarif"

      - name: Upload Qodana project-model summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qodana-project-model-summary
          path: ${{ runner.temp }}/qodana/project-model-summary.json
          if-no-files-found: ignore

  frontend-quality:
    name: Angular / TypeScript / JavaScript / HTML / SCSS / CSS
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            tools/frontend-inspections/package.json

      - name: Set up npm
        run: npm install --global npm@11.17.0

      - name: Install repository test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Angular dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Install inspection toolchain
        run: npm --prefix tools/frontend-inspections install --ignore-scripts --no-audit --no-fund

      - name: Run complete frontend inspection inventory
        run: npm run lint:frontend

      - name: Upload frontend inspection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-inspection-reports
          path: artifacts/frontend-inspections
          if-no-files-found: error
          retention-days: 14

      - name: Validate TypeScript types
        run: npm --prefix frontend exec -- tsc --noEmit --project tsconfig.app.json

      - name: Validate Angular templates and styles
        run: npm --prefix frontend run build

      - name: Run Angular unit tests
        run: npm --prefix frontend test
