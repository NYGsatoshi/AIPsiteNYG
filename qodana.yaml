#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#
#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"

# The workflow selects qodana-dotnet or qodana-cdnet depending on whether a
# QODANA_TOKEN is available. Keep the linter out of this file so both modes can
# share the same inspection configuration.
dotnet:
  solution: AipPortal.slnx

# The repository pins an exact SDK feature band in global.json. Qodana Community
# images can contain a different .NET 10 feature band, which is not sufficient
# for MSBuild toolset discovery. Install the exact pinned SDK only when absent.
bootstrap: |+
  set -eu

  SDK_VERSION="$(awk -F'"' '/"version"[[:space:]]*:/ { print $4; exit }' global.json)"
  if [ -z "$SDK_VERSION" ]; then
    echo "Unable to read sdk.version from global.json" >&2
    exit 1
  fi

  if ! dotnet --list-sdks 2>/dev/null | awk '{ print $1 }' | grep -Fxq "$SDK_VERSION"; then
    echo "Installing .NET SDK $SDK_VERSION required by global.json"
    curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
    sudo bash /tmp/dotnet-install.sh \
      --version "$SDK_VERSION" \
      --install-dir /usr/share/dotnet \
      --no-path
  fi

  echo "Selected .NET SDK: $(dotnet --version)"
  dotnet msbuild -version
  dotnet restore AipPortal.slnx --nologo

profile:
  name: qodana.starter

include:
  - name: UseAwaitUsing
  - name: AsyncMethodWithoutAwait
  - name: ConvertIfStatementToReturnStatement
  - name: ConvertIfStatementToConditionalTernaryExpression
  - name: ConvertIfStatementToNullCoalescingAssignment
  - name: ConvertIfStatementToSwitchStatement
  - name: InvertIf
  - name: UseNameOfInsteadOfToString
  - name: HeapView.BoxingAllocation
  - name: HeapView.PossibleBoxingAllocation
  - name: HeapView.ClosureAllocation
  - name: HeapView.DelegateAllocation
  - name: ForeachCanBePartlyConvertedToQueryUsingAnotherGetEnumerator
  - name: ForeachCanBeConvertedToQueryUsingAnotherGetEnumerator
  - name: SimplifyLinqExpressionUseAll
  - name: MergeIntoLogicalPattern
  - name: MergeIntoPattern
  - name: HeapView.ObjectAllocation
  - name: HeapView.ObjectAllocation.Evident
  - name: HeapView.ObjectAllocation.Possible
  - name: UseRawString
  - name: CA1869
  - name: CA1866
  - name: CA1865
  - name: ASP0018
  - name: CA1826
  - name: CA1822
  - name: CA1861
  - name: CA1859
  - name: UseUtf8StringLiteral
  - name: RouteTemplates.ActionRoutePrefixCanBeExtractedToControllerRoute
  - name: ClassNeverInstantiated.Global
  - name: UseCollectionExpression
  - name: PropertyCanBeMadeInitOnly.Global
  - name: MethodHasAsyncOverloadWithCancellation
  - name: UnusedMethodReturnValue.Global
  - name: MemberCanBePrivate.Global
  - name: MemberCanBePrivate.Local
  - name: MemberCanBeMadeStatic.Local
  - name: ConvertClosureToMethodGroup
  - name: UseVerbatimString
  - name: RouteTemplates.RouteParameterIsNotPassedToMethod
  - name: LoopCanBeConvertedToQuery
  - name: ConvertToConstant.Local
  - name: ChangeFieldTypeToSystemThreadingLock
  - name: InlineTemporaryVariable
  - name: UseObjectOrCollectionInitializer
  - name: ConvertToExtensionBlock
  - name: UnusedType.Global
  - name: UnusedMemberInSuper.Global
  - name: UnusedMember.Global
  - name: SimplifyConditionalTernaryExpression
  - name: AutoPropertyCanBeMadeGetOnly.Global
  - name: MergeIntoNegatedPattern
  - name: UnusedParameter.Global
  - name: SeparateLocalFunctionsWithJumpStatement
  - name: SuggestVarOrType_Elsewhere
  - name: DuplicatedSequentialIfBodies
  - name: MergeSequentialChecks

# qodana.starter follows .gitignore automatically. Do not exclude src/ or tests/:
# those directories contain the code this workflow is intended to inspect.
