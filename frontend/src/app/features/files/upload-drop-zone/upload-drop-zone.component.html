<section
  class="upload-drop-zone"
  [class]="'upload-drop-zone upload-drop-zone--' + upload.state"
  [class.upload-drop-zone--disabled]="!canUpload"
  (drop)="onDrop($event)"
  (dragover)="onDragOver($event)"
  data-testid="upload-drop-zone"
>
  <div class="upload-drop-zone__copy">
    <p>Upload</p>
    <h2>File upload</h2>
    <span>Limit {{ formatBytes(maxUploadBytes) }}. Upload is not available in MVP0.</span>
  </div>

  @if (canUpload) {
    <label class="upload-drop-zone__button">
      <span>Choose file</span>
      <input type="file" (change)="onFileInputChange($event)" data-testid="file-input" />
    </label>
  } @else {
    <button type="button" class="upload-drop-zone__button" data-testid="file-upload-disabled" disabled>
      Upload not available in MVP0
    </button>
  }

  <div class="upload-drop-zone__state" role="status" data-testid="upload-state">
    @if (upload.selectedFileName) {
      <strong>{{ upload.selectedFileName }}</strong>
    }
    <span>{{ upload.message }}</span>
    @if (upload.state === 'progress') {
      <progress max="100" [value]="upload.progressPercent ?? 0" data-testid="upload-progress"></progress>
    }
  </div>
</section>
