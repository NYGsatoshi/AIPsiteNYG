services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - syncfusion_license
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=${DB_HOST:-db};Port=5432;Database=${DB_NAME:-aip_portal};Username=${DB_USER:-aip_portal};Password=${DB_PASSWORD:?set DB_PASSWORD}
      DataProtection__KeysPath: /app/data/protection-keys
      Tenancy__AppMode: ${TENANCY_APP_MODE:-OnPremSingleTenant}
      Tenancy__DefaultTenantSlug: ${TENANCY_DEFAULT_TENANT_SLUG:-default}
      Tenancy__TenantResolutionStrategy: ${TENANCY_RESOLUTION_STRATEGY:-ConfigDefault}
      Tenancy__AllowTenantSwitching: ${TENANCY_ALLOW_SWITCHING:-false}
      Tenancy__SeedOnStartup: "true"
      FileStorage__Provider: LocalFileSystem
      FileStorage__RootPath: /app/storage/uploads
      FileStorage__MaxFileSizeBytes: ${FILE_STORAGE_MAX_FILE_SIZE_BYTES:-52428800}
      Security__CookieSecurePolicy: Always
      Security__RequireHttps: "true"
      Security__EnableHsts: "true"
      # The supported production topology is an operator-provided TLS proxy
      # terminating outside this Compose project and reaching this loopback-only
      # origin. Proxy mode is fail-closed until a trusted source IP/CIDR is set.
      ReverseProxy__TrustForwardedHeaders: ${REVERSE_PROXY_TRUST_FORWARDED_HEADERS:-false}
      ReverseProxy__RequireHeaderSymmetry: ${REVERSE_PROXY_REQUIRE_HEADER_SYMMETRY:-true}
      ReverseProxy__TrustedProxies__0: ${REVERSE_PROXY_TRUSTED_PROXIES:-}
      ReverseProxy__TrustedNetworks__0: ${REVERSE_PROXY_TRUSTED_NETWORKS:-}
      Platform__PlatformAdminSetupMode: "false"
      AIP_SEED_ADMIN_ENABLED: ${AIP_SEED_ADMIN_ENABLED:-false}
      AIP_SEED_ADMIN_EMAIL: ${AIP_SEED_ADMIN_EMAIL:-admin@example.local}
      AIP_SEED_ADMIN_USERNAME: ${AIP_SEED_ADMIN_USERNAME:-admin}
      AIP_SEED_ADMIN_PASSWORD: ${AIP_SEED_ADMIN_PASSWORD:-}
    ports:
      - "${AIP_PORTAL_BIND_ADDRESS:-127.0.0.1}:${AIP_PORTAL_PORT:-8080}:8080"
    volumes:
      - aip_onprem_uploads:/app/storage/uploads
      - aip_onprem_data_protection:/app/data/protection-keys
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error -H 'X-Forwarded-For: 127.0.0.1' -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: localhost' http://localhost:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0.400
    working_dir: /src
    restart: "no"
    volumes:
      - ./:/src
      - aip_onprem_nuget:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=${DB_HOST:-db};Port=5432;Database=${DB_NAME:-aip_portal};Username=${DB_USER:-aip_portal};Password=${DB_PASSWORD:?set DB_PASSWORD}
      NUGET_PACKAGES: /root/.nuget/packages
      Tenancy__SeedOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc "mkdir -p /src/src/AipPortal.Web/wwwroot &&
      dotnet tool restore &&
      dotnet restore src/AipPortal.Web/AipPortal.Web.csproj /p:RestoreFallbackFolders= &&
      dotnet ef database update --project src/AipPortal.Infrastructure --startup-project src/AipPortal.Web"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-aip_portal}
      POSTGRES_USER: ${DB_USER:-aip_portal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    networks:
      default:
        aliases:
          - db
    volumes:
      - aip_onprem_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aip_portal} -d ${DB_NAME:-aip_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aip_onprem_pgdata:
  aip_onprem_uploads:
  aip_onprem_data_protection:
  aip_onprem_nuget:

secrets:
  syncfusion_license:
    environment: SYNCFUSION_LICENSE
