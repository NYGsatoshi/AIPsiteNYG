name: One-time fix PR287

on:
  push:
    branches:
      - agent/ci-compose-helper-preflight

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply deterministic legacy candidate ordering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/AipPortal.Tests/PostgreSql/Wpc01WorkspaceCreationPostgreSqlTests.cs')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'(?P<indent>\s*)\.Select\(message => message\.ConversationId\)\r?\n(?P=indent)\.Distinct\(\);')
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one legacy candidate projection, found {len(matches)}')
          match = matches[0]
          indent = match.group('indent')
          replacement = f'{indent}.Select(message => message.ConversationId)\n{indent}.Distinct()\n{indent}.OrderBy(conversationId => conversationId);'
          path.write_text(text[:match.start()] + replacement + text[match.end():], encoding='utf-8')
          PY

          rm .github/workflows/one-time-fix-pr287.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/AipPortal.Tests/PostgreSql/Wpc01WorkspaceCreationPostgreSqlTests.cs .github/workflows/one-time-fix-pr287.yml
          git commit -m "Stabilize message search authorization regression test"
          git push origin "HEAD:${GITHUB_REF_NAME}"
