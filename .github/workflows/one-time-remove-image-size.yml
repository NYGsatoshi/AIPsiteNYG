name: One-time verify image-size removal

on:
  push:
    branches:
      - fix/remove-image-size-transitive

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Prove image-size is absent from lockfiles
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          for (const file of ['frontend/package-lock.json', 'aipsite-frontend/package-lock.json']) {
            const lock = JSON.parse(fs.readFileSync(file, 'utf8'))
            const packages = lock.packages ?? {}
            const paths = Object.keys(packages).filter(p => p === 'node_modules/image-size' || p.endsWith('/node_modules/image-size'))
            if (paths.length) throw new Error(`${file}: image-size remains at ${paths.join(', ')}`)
            for (const [pkgPath, meta] of Object.entries(packages)) {
              for (const field of ['dependencies', 'optionalDependencies']) {
                if (meta?.[field]?.['image-size'] !== undefined) {
                  throw new Error(`${file}: ${pkgPath || '<root>'} still references image-size via ${field}`)
                }
              }
            }
            const less = Object.entries(packages)
              .filter(([p]) => p === 'node_modules/less' || p.endsWith('/node_modules/less'))
              .map(([p, meta]) => `${p}=${meta.version}`)
            if (!less.length || less.some(value => !value.endsWith('=4.9.0'))) {
              throw new Error(`${file}: unexpected Less resolution: ${less.join(', ')}`)
            }
            console.log(`${file}: ${less.join(', ')}; image-size absent`)
          }
          NODE

      - name: Run npm audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-audit"
          npm --prefix frontend audit --json > "$RUNNER_TEMP/npm-audit/frontend.json" || true
          npm --prefix aipsite-frontend audit --json > "$RUNNER_TEMP/npm-audit/aipsite-frontend.json" || true

      - name: Verify reviewed High and Critical baseline
        run: node scripts/ci/check-npm-audit-baseline.mjs "$RUNNER_TEMP/npm-audit" scripts/ci/npm-audit-baseline.json
