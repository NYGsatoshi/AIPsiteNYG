name: NuGet Dependency Submission (Self-Hosted)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.sln'
      - '**/*.slnx'
      - '**/packages.config'
      - '**/packages.lock.json'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.config/dotnet-tools.json'
      - '.github/workflows/nuget-dependency-submission-self-hosted.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: nuget-dependency-submission-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit-nuget:
    name: submit-nuget
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Prove runner routing
        shell: bash
        run: |
          set -euo pipefail
          echo "runner.name=${RUNNER_NAME}"
          echo "runner.os=${RUNNER_OS}"
          echo "runner.arch=${RUNNER_ARCH}"
          echo "runner.environment=${RUNNER_ENVIRONMENT}"
          if [[ "${RUNNER_ENVIRONMENT}" != "self-hosted" ]]; then
            echo "Unexpected runner environment: ${RUNNER_ENVIRONMENT}" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Submit NuGet dependency snapshot
        uses: advanced-security/component-detection-dependency-submission-action@v0.1.4
        with:
          filePath: '.'
          detectorsCategories: NuGet
          correlator: nuget-self-hosted
