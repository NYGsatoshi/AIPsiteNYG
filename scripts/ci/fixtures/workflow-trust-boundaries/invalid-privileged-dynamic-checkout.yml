name: invalid privileged dynamic checkout
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: write
jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0123456789012345678901234567890123456789
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: echo unsafe
