services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aip_portal};Username=${POSTGRES_USER:-aip_portal};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DataProtection__KeysPath: /app/data/protection-keys
      FileStorage__RootPath: /app/storage/uploads
      FileStorage__MaxFileSizeBytes: ${FILE_STORAGE_MAX_FILE_SIZE_BYTES:-26214400}
    ports:
      - "${AIP_PORTAL_PORT:-8080}:8080"
    volumes:
      - aip_uploads:/app/storage/uploads
      - aip_data_protection:/app/data/protection-keys
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0-preview
    working_dir: /src
    volumes:
      - ./:/src
      - aip_nuget:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aip_portal};Username=${POSTGRES_USER:-aip_portal};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      NUGET_PACKAGES: /root/.nuget/packages
      Tenancy__SeedOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc "dotnet tool restore &&
      dotnet restore src/AipPortal.Web/AipPortal.Web.csproj /p:RestoreFallbackFolders= &&
      dotnet ef database update --project src/AipPortal.Infrastructure --startup-project src/AipPortal.Web"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aip_portal}
      POSTGRES_USER: ${POSTGRES_USER:-aip_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - aip_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aip_portal} -d ${POSTGRES_DB:-aip_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aip_pgdata:
  aip_uploads:
  aip_data_protection:
  aip_nuget:
